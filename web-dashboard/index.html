<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Trader Screener — Dashboard</title>
<style>
  :root{
    --bg:#0d1117; --panel:#161b22; --border:#30363d; --txt:#e6edf3;
    --muted:#8b949e; --accent:#2f81f7; --green:#3fb950; --red:#f85149;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);font:14px/1.4 -apple-system,Segoe UI,Roboto,sans-serif}
  header{display:flex;align-items:center;gap:16px;padding:12px 18px;border-bottom:1px solid var(--border);background:var(--panel);position:sticky;top:0;z-index:10}
  header h1{font-size:16px;margin:0;font-weight:700}
  nav{display:flex;gap:6px}
  nav button{background:transparent;border:1px solid transparent;color:var(--muted);padding:6px 12px;border-radius:6px;cursor:pointer;font-size:13px}
  nav button.active{color:var(--txt);background:#21262d;border-color:var(--border)}
  .api{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
  .api input{background:var(--bg);border:1px solid var(--border);color:var(--txt);border-radius:6px;padding:5px 8px;width:200px}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--red)}
  .dot.ok{background:var(--green)}
  main{padding:18px;max-width:1200px;margin:0 auto}
  .controls{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap}
  input[type=text],select{background:var(--panel);border:1px solid var(--border);color:var(--txt);border-radius:6px;padding:7px 10px}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--border)}
  th{color:var(--muted);font-weight:600;cursor:pointer;user-select:none;position:sticky;top:53px;background:var(--bg)}
  tr:hover td{background:#161b2233}
  td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
  .pos{color:var(--green)} .neg{color:var(--red)}
  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
  .group-title{margin:18px 0 8px;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.5px}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:12px}
  .card .name{font-weight:600;margin-bottom:2px}
  .card .price{font-size:20px;font-variant-numeric:tabular-nums}
  .card .sub{font-size:12px;color:var(--muted);margin-top:4px;display:flex;justify-content:space-between}
  .rangebar{height:5px;background:#21262d;border-radius:3px;margin-top:8px;position:relative}
  .rangebar i{position:absolute;top:-2px;width:9px;height:9px;border-radius:50%;background:var(--accent);transform:translateX(-50%)}
  .muted{color:var(--muted)} .big{font-size:18px;font-weight:600}
  .pill{display:inline-block;padding:2px 8px;border-radius:20px;background:#21262d;font-size:12px;margin-right:6px}
  .loading{color:var(--muted);padding:30px;text-align:center}
  .err{color:var(--red);padding:18px;border:1px solid var(--red);border-radius:8px;background:#f8514911}
</style>
</head>
<body>
<header>
  <h1 id="brand" style="cursor:pointer" title="Home">📈 Trader Screener</h1>
  <nav id="nav"></nav>
  <div class="api">
    <span class="dot" id="dot"></span> API
    <input id="apiBase" value="http://127.0.0.1:8000" />
  </div>
</header>
<main id="view"><div class="loading">Loading…</div></main>

<script>
const API = () => document.getElementById('apiBase').value.replace(/\/$/,'');
let TAB = 'screener';
// commodity futures symbol -> spelled-out name
const COMMODITY_NAMES = {
  'CL=F':'WTI Crude','BZ=F':'Brent Crude','NG=F':'Natural Gas','RB=F':'Gasoline','HO=F':'Heating Oil',
  'GC=F':'Gold','SI=F':'Silver','PL=F':'Platinum','PA=F':'Palladium','HG=F':'Copper','ALI=F':'Aluminum',
  'ZC=F':'Corn','ZW=F':'Wheat','KE=F':'KC HRW Wheat','RS=F':'Canola','DC=F':'Milk (Class III)',
  'ZS=F':'Soybeans','ZL=F':'Soybean Oil','ZM=F':'Soybean Meal','ZO=F':'Oats','ZR=F':'Rough Rice',
  'KC=F':'Coffee','SB=F':'Sugar','CC=F':'Cocoa','CT=F':'Cotton','OJ=F':'Orange Juice','LBS=F':'Lumber',
  'LE=F':'Live Cattle','GF=F':'Feeder Cattle','HE=F':'Lean Hogs',
};
const nm = r => COMMODITY_NAMES[r] || r;
let screenerRows = [], sortKey = 'rank', sortAsc = true;

async function jget(path){
  const r = await fetch(API()+path);
  if(!r.ok) throw new Error(path+' → '+r.status);
  return r.json();
}
function fmt(v,d=2){ return v==null?'–':Number(v).toLocaleString(undefined,{maximumFractionDigits:d}); }
function pct(v){ if(v==null) return '<span class="muted">–</span>'; const c=v>=0?'pos':'neg'; const s=v>=0?'+':''; return `<span class="${c}">${s}${v.toFixed(2)}%</span>`; }

async function ping(){
  try{ const h=await jget('/health'); document.getElementById('dot').classList.toggle('ok',!!h.ok); return h; }
  catch{ document.getElementById('dot').classList.remove('ok'); return null; }
}

// ── SCREENER ──────────────────────────────────────────────
async function renderScreener(){
  const v=document.getElementById('view');
  v.innerHTML=`<div class="controls">
    <input type="text" id="q" placeholder="Search ticker / name…" />
    <select id="sector"><option value="">All sectors</option></select>
    <span class="muted" id="count"></span></div>
    <div id="tbl"><div class="loading">Loading stocks…</div></div>`;
  try{
    const d=await jget('/api/stocks?limit=1000');
    screenerRows=d.stocks;
    const secs=[...new Set(screenerRows.map(r=>r.sector).filter(Boolean))].sort();
    const sel=document.getElementById('sector');
    secs.forEach(s=>{const o=document.createElement('option');o.value=o.textContent=s;sel.appendChild(o);});
    document.getElementById('q').oninput=drawScreener;
    sel.onchange=drawScreener;
    drawScreener();
  }catch(e){ v.querySelector('#tbl').innerHTML=`<div class="err">${e.message}<br>Is the API running? (uvicorn api:app)</div>`; }
}
function drawScreener(){
  const q=(document.getElementById('q').value||'').toLowerCase();
  const sec=document.getElementById('sector').value;
  let rows=screenerRows.filter(r=>
    (!sec||r.sector===sec) &&
    (!q || (r.ticker||'').toLowerCase().includes(q) || (r.name||'').toLowerCase().includes(q)));
  rows.sort((a,b)=>{ let x=a[sortKey],y=b[sortKey];
    if(x==null)return 1; if(y==null)return -1;
    if(typeof x==='string')return sortAsc?x.localeCompare(y):y.localeCompare(x);
    return sortAsc?x-y:y-x; });
  document.getElementById('count').textContent=`${rows.length} stocks`;
  const cols=[['rank','#'],['ticker','Ticker'],['name','Name'],['sector','Sector'],
              ['price','Price'],['score','Score'],['pe','P/E'],['upside','Upside %']];
  const th=cols.map(([k,l])=>`<th class="${['price','score','pe','upside','rank'].includes(k)?'num':''}" onclick="setSort('${k}')">${l}${sortKey===k?(sortAsc?' ▲':' ▼'):''}</th>`).join('');
  const body=rows.slice(0,300).map(r=>`<tr style="cursor:pointer" onclick="openStock('${r.ticker}')" title="Open ${r.ticker} detail">
    <td class="num muted">${r.rank??'–'}</td>
    <td><b style="color:var(--accent)">${r.ticker}</b></td>
    <td class="muted">${(r.name||'').slice(0,38)}</td>
    <td class="muted">${r.sector||'–'}</td>
    <td class="num">${r.price!=null?'$'+fmt(r.price):'–'}</td>
    <td class="num">${fmt(r.score,0)}</td>
    <td class="num">${fmt(r.pe,1)}</td>
    <td class="num">${r.upside!=null?pct(r.upside):'–'}</td></tr>`).join('');
  document.getElementById('tbl').innerHTML=`<table><thead><tr>${th}</tr></thead><tbody>${body}</tbody></table>`;
}
function setSort(k){ if(sortKey===k)sortAsc=!sortAsc; else{sortKey=k;sortAsc=true;} drawScreener(); }

// ── COMMODITIES ───────────────────────────────────────────
async function renderCommodities(){
  const v=document.getElementById('view');
  v.innerHTML=`<div class="loading">Loading commodities…</div>`;
  try{
    const d=await jget('/api/commodities');
    let html=`<div class="muted" style="margin-bottom:6px">as of ${d.asof} · ${d.count} instruments</div>`;
    for(const [grp,items] of Object.entries(d.groups)){
      html+=`<div class="group-title">${grp}</div><div class="cards">`;
      html+=items.map(c=>{
        const rng=c.range_pct!=null?c.range_pct:50;
        return `<div class="card" style="cursor:pointer" onclick="openCommodity('${c.root}')" title="Open ${c.name} detail">
          <div class="name">${c.name}</div>
          <div class="price">${fmt(c.price)}</div>
          <div class="sub"><span>1d ${pct(c.chg_1d)}</span><span>vol ${fmt(c.vol_20d,0)}</span></div>
          <div class="sub"><span>1m ${pct(c.chg_1m)}</span><span>ytd ${pct(c.chg_ytd)}</span></div>
          <div class="rangebar" title="52w range"><i style="left:${rng}%"></i></div>
        </div>`;}).join('');
      html+=`</div>`;
    }
    v.innerHTML=html;
  }catch(e){ v.innerHTML=`<div class="err">${e.message}</div>`; }
}

// ── COMMODITY DETAIL (click a card) ───────────────────────
function fmtAxis(v){ const a=Math.abs(v); return a>=1000?(v/1000).toFixed(1)+'k':a>=100?v.toFixed(0):v.toFixed(2); }
// line chart with y-price ticks + x-date labels. points: [[label, value], …]
function chart(points, opts={}){
  if(!points||points.length<2) return '<div class="muted">no data</div>';
  const w=opts.w||660, h=opts.h||230, ml=48, mr=12, mt=10, mb=30;
  const iw=w-ml-mr, ih=h-mt-mb;
  const vals=points.map(p=>p[1]);
  const min=Math.min(...vals), max=Math.max(...vals), span=(max-min)||1;
  const x=i=>ml+(i/(points.length-1))*iw, y=v=>mt+ih-((v-min)/span)*ih;
  const col=opts.color||(vals[vals.length-1]>=vals[0]?'var(--green)':'var(--red)');
  const path=points.map((p,i)=>`${i?'L':'M'}${x(i).toFixed(1)},${y(p[1]).toFixed(1)}`).join(' ');
  let yt='';
  for(let k=0;k<=4;k++){const v=min+span*k/4,yy=y(v);
    yt+=`<line x1="${ml}" y1="${yy.toFixed(1)}" x2="${w-mr}" y2="${yy.toFixed(1)}" stroke="#21262d"/>
      <text x="${ml-6}" y="${(yy+3).toFixed(1)}" fill="var(--muted)" font-size="10" text-anchor="end">${fmtAxis(v)}</text>`;}
  let xt='';const step=Math.max(1,Math.floor((points.length-1)/5));
  for(let i=0;i<points.length;i+=step){xt+=`<text x="${x(i).toFixed(1)}" y="${h-9}" fill="var(--muted)" font-size="10" text-anchor="middle">${points[i][0]}</text>`;}
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" style="display:block">${yt}
    <path d="${path}" fill="none" stroke="${col}" stroke-width="2"/>${xt}
    ${opts.ylabel?`<text x="12" y="${mt+ih/2}" fill="var(--muted)" font-size="10" text-anchor="middle" transform="rotate(-90 12 ${mt+ih/2})">${opts.ylabel}</text>`:''}</svg>`;
}
// seasonality: 12 bars of seasonal index (100 = annual average)
function seasonalChart(seas){
  if(!seas||seas.length<6) return '<div class="muted">not enough history for seasonality</div>';
  const w=660,h=230,ml=40,mr=12,mt=10,mb=26,iw=w-ml-mr,ih=h-mt-mb;
  const idx=seas.map(s=>s[2]??100);
  const min=Math.min(100,...idx), max=Math.max(100,...idx), span=(max-min)||1;
  const y=v=>mt+ih-((v-min)/span)*ih, bw=iw/seas.length*0.7;
  let bars='';
  seas.forEach((s,i)=>{const v=s[2]??100, cx=ml+(i+0.5)*iw/seas.length;
    const top=Math.min(y(v),y(100)), bh=Math.abs(y(v)-y(100));
    const col=v>=100?'var(--green)':'var(--red)';
    bars+=`<rect x="${(cx-bw/2).toFixed(1)}" y="${top.toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(bh,1).toFixed(1)}" fill="${col}" opacity="0.8"/>
      <text x="${cx.toFixed(1)}" y="${h-9}" fill="var(--muted)" font-size="10" text-anchor="middle">${s[0]}</text>`;});
  const y100=y(100);
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" style="display:block">
    <line x1="${ml}" y1="${y100.toFixed(1)}" x2="${w-mr}" y2="${y100.toFixed(1)}" stroke="var(--muted)" stroke-dasharray="3 3"/>
    <text x="${ml-4}" y="${(y100+3).toFixed(1)}" fill="var(--muted)" font-size="10" text-anchor="end">100</text>${bars}</svg>`;
}
function tradeTable(title, rows){
  if(!rows||!rows.length) return '';
  const max=Math.max(...rows.map(r=>r[1]));
  return `<div class="card" style="flex:1;min-width:240px"><div class="name">${title}</div><table style="font-size:13px">`+
    rows.map(([c,p])=>`<tr><td style="border:none;padding:4px 8px 4px 0">${c}</td>
      <td style="border:none;padding:4px 0;width:55%"><div style="background:#21262d;border-radius:3px;height:14px;position:relative">
        <div style="background:var(--accent);height:14px;border-radius:3px;width:${(p/max*100).toFixed(0)}%"></div></div></td>
      <td class="num muted" style="border:none;padding:4px 0 4px 8px">${p}%</td></tr>`).join('')+
    `</table></div>`;
}
async function openCommodity(root){
  TAB='commodities';
  const v=document.getElementById('view');
  v.innerHTML=`<div class="loading">Loading ${root}…</div>`;
  try{
    const c=await jget('/api/commodities/'+encodeURIComponent(root));
    // price history points [label(YYYY-MM), value]; fall back to 30d spark
    const hpts=(c.history&&c.history.length)?c.history.map(p=>[p[0].slice(0,7),p[1]])
              :(c.spark||[]).map((v,i)=>[String(i+1),v]);
    let html=`<button class="pill" style="cursor:pointer;border:1px solid var(--border)" onclick="renderCommodities()">← Commodities</button>
      <div style="display:flex;align-items:baseline;gap:12px;margin:12px 0 2px">
        <span class="big" style="font-size:24px">${c.name}</span><span class="muted">${c.group} · ${c.root}</span></div>
      <div style="margin:6px 0 14px">
        <span class="pill">${fmt(c.price)}</span>
        <span class="pill">1d ${pct(c.chg_1d)}</span><span class="pill">1m ${pct(c.chg_1m)}</span>
        <span class="pill">YTD ${pct(c.chg_ytd)}</span><span class="pill">1y ${pct(c.chg_1y)}</span>
        <span class="pill">vol ${fmt(c.vol_20d,0)}</span>
        <span class="pill">52w ${fmt(c.low_52w)}–${fmt(c.high_52w)}</span></div>
      <div class="group-title">Price — last year (monthly tick)</div>
      <div class="card">${chart(hpts,{ylabel:'price'})}</div>`;
    // monthly averages (up to 5y)
    if(c.monthly&&c.monthly.length>2){
      html+=`<div class="group-title">Monthly average price (up to 5y)</div>
        <div class="card">${chart(c.monthly,{ylabel:'avg price',color:'var(--accent)'})}</div>`;
    }
    // seasonality
    if(c.seasonality&&c.seasonality.length>=6){
      html+=`<div class="group-title">Seasonality — avg by calendar month <span class="muted">(index, 100 = annual avg; green = seasonally strong)</span></div>
        <div class="card">${seasonalChart(c.seasonality)}</div>`;
    }
    // trade
    if(c.trade){
      html+=`<div class="group-title">Global trade — ${c.trade.unit} <span class="muted">(approx. share, recent yrs)</span></div>
        <div style="display:flex;gap:12px;flex-wrap:wrap">
        ${tradeTable('Top exporters', c.trade.exporters)}
        ${tradeTable('Top importers', c.trade.importers)}</div>`;
    } else {
      html+=`<div class="muted" style="margin-top:14px">No global trade reference for this commodity (US-centric or thinly traded).</div>`;
    }
    v.innerHTML=html;
  }catch(e){ v.innerHTML=`<button class="pill" style="cursor:pointer;border:1px solid var(--border)" onclick="renderCommodities()">← Commodities</button><div class="err" style="margin-top:12px">${e.message}</div>`; }
}

// ── OPTIONS ───────────────────────────────────────────────
async function renderOptions(){
  const v=document.getElementById('view');
  v.innerHTML=`<div class="controls">
    <input type="text" id="optTk" placeholder="Ticker (e.g. NVDA)" value="NVDA" />
    <button onclick="loadOptions()" class="pill" style="cursor:pointer;border:1px solid var(--border)">Load</button></div>
    <div id="optBox"><div class="muted">Enter a ticker that's in the options feed (top-N universe).</div></div>`;
  document.getElementById('optTk').addEventListener('keydown',e=>{if(e.key==='Enter')loadOptions();});
  loadOptions();
}
async function loadOptions(){
  const tk=(document.getElementById('optTk').value||'').toUpperCase().trim();
  const box=document.getElementById('optBox');
  if(!tk) return;
  box.innerHTML=`<div class="loading">Loading ${tk}…</div>`;
  try{
    const s=await jget('/api/options/'+tk);
    const sm=s.summary||{};
    let head=`<div style="margin:6px 0 14px">
      <span class="pill">spot $${fmt(sm.spot)}</span>
      <span class="pill">ATM IV ${sm.atm_iv!=null?(sm.atm_iv*100).toFixed(1)+'%':'–'}</span>
      <span class="pill">IV mean ${sm.iv_mean!=null?(sm.iv_mean*100).toFixed(1)+'%':'–'}</span>
      <span class="pill">P/C OI ${fmt(sm.put_call_oi)}</span>
      <span class="pill">OI ${fmt(sm.total_oi,0)}</span></div>`;
    const exp=s.expirations&&s.expirations[0];
    if(!exp){ box.innerHTML=head+`<div class="muted">no expirations</div>`; return; }
    const ch=await jget(`/api/options/${tk}/${exp}`);
    const rows=ch.contracts.sort((a,b)=>a.strike-b.strike).map(c=>`<tr>
      <td>${c.type}</td><td class="num">${fmt(c.strike)}</td>
      <td class="num">${fmt(c.bid)}</td><td class="num">${fmt(c.ask)}</td>
      <td class="num">${c.iv!=null?(c.iv*100).toFixed(1)+'%':'–'}</td>
      <td class="num">${c.delta??'–'}</td><td class="num">${fmt(c.open_interest,0)}</td>
      <td class="num">${fmt(c.volume,0)}</td></tr>`).join('');
    box.innerHTML=head+`<div class="muted" style="margin-bottom:6px">nearest expiry ${exp} · ${ch.contracts.length} contracts</div>
      <table><thead><tr><th>Type</th><th class="num">Strike</th><th class="num">Bid</th><th class="num">Ask</th>
      <th class="num">IV</th><th class="num">Δ</th><th class="num">OI</th><th class="num">Vol</th></tr></thead>
      <tbody>${rows}</tbody></table>`;
  }catch(e){ box.innerHTML=`<div class="err">${e.message}<br>Ticker may not be in the options feed (only top-N universe tickers are collected).</div>`; }
}

// ── DRIVERS (commodity exposure) ──────────────────────────
async function renderDrivers(){
  const v=document.getElementById('view');
  v.innerHTML=`<div class="controls">
    <input type="text" id="drvTk" placeholder="Ticker (e.g. PSX, TSM, DAL)" value="PSX" />
    <button onclick="loadDrivers()" class="pill" style="cursor:pointer;border:1px solid var(--border)">Load</button>
    <span class="muted">what commodities drive this stock</span></div>
    <div id="drvBox"></div>`;
  document.getElementById('drvTk').addEventListener('keydown',e=>{if(e.key==='Enter')loadDrivers();});
  loadDrivers();
}
async function loadDrivers(){
  const tk=(document.getElementById('drvTk').value||'').toUpperCase().trim();
  const box=document.getElementById('drvBox'); if(!tk) return;
  box.innerHTML=`<div class="loading">Loading ${tk}…</div>`;
  try{
    const d=await jget('/api/stocks/'+tk+'/commodities');
    box.innerHTML=exposureHTML(d);
  }catch(e){ box.innerHTML=`<div class="err">${e.message}<br>No exposure mapped for ${tk}. Curated set covers refiners, E&P, airlines, miners, chemicals, food, semis, autos.</div>`; }
}
// shared exposure renderer (used by Drivers tab + stock detail)
function exposureHTML(d){
  let html='';
  if(d.curated&&d.curated.length){
    html+=`<div class="group-title">Commodity drivers — curated</div><table>
      <thead><tr><th>Commodity</th><th>Role</th><th>Effect of price ↑</th><th>Why</th></tr></thead><tbody>`;
    html+=d.curated.map(c=>{
      const eff=c.sign>0?'<span class="pos">helps ▲</span>':'<span class="neg">hurts ▼</span>';
      return `<tr><td><b>${nm(c.root)}</b></td><td class="muted">${c.role}</td><td>${eff}</td><td class="muted">${c.note||''}</td></tr>`;
    }).join('')+`</tbody></table>`;
  }
  if(d.computed&&d.computed.length){
    html+=`<div class="group-title">Commodity drivers — computed (1y return regression)</div><table>
      <thead><tr><th>Commodity</th><th class="num">Beta</th><th class="num">Corr</th><th class="num">R²</th></tr></thead><tbody>`;
    html+=d.computed.map(c=>{
      const bc=c.beta>=0?'pos':'neg';
      return `<tr><td><b>${nm(c.root)}</b></td><td class="num ${bc}">${c.beta}</td><td class="num">${c.corr}</td><td class="num muted">${c.r2}</td></tr>`;
    }).join('')+`</tbody></table>`;
  }
  if(!html) html=`<div class="muted">No commodity exposure mapped for this stock.</div>`;
  return html;
}

// ── STOCK DETAIL (click a ticker) ─────────────────────────
async function openStock(tk){
  TAB='screener';
  const v=document.getElementById('view');
  v.innerHTML=`<div class="loading">Loading ${tk}…</div>`;
  try{
    const s=await jget('/api/stocks/'+tk);
    // header
    const score=s.score_composite, label=s.score_label, stars=s.score_stars;
    let html=`<button class="pill" style="cursor:pointer;border:1px solid var(--border)" onclick="renderScreener()">← Screener</button>
      <div style="display:flex;align-items:baseline;gap:12px;margin:12px 0 4px">
        <span class="big" style="font-size:24px">${s.ticker}</span>
        <span class="muted">${s.name||''}</span></div>
      <div class="muted" style="margin-bottom:10px">${s.sector||''} · ${s.industry||''} · ${s.cap_size||''} · rank #${s.rank??'–'}</div>
      <div style="margin-bottom:14px">
        <span class="pill">$${fmt(s.price)}</span>
        <span class="pill">mkt cap ${s.mkt_cap!=null?'$'+fmt(s.mkt_cap)+'B':'–'}</span>
        ${score!=null?`<span class="pill">score ${fmt(score,0)} ${label?'· '+label:''} ${stars?'· '+'★'.repeat(Math.round(stars)):''}</span>`:'<span class="pill muted">score pending</span>'}
        ${s.avg_upside!=null?`<span class="pill">upside ${pct(s.avg_upside)}</span>`:''}
      </div>`;
    // 52w range
    if(s.low52!=null&&s.high52!=null&&s.high52>s.low52){
      const pos=((s.price-s.low52)/(s.high52-s.low52)*100).toFixed(0);
      html+=`<div class="muted" style="font-size:12px">52w range $${fmt(s.low52)} – $${fmt(s.high52)}</div>
        <div class="rangebar" style="max-width:320px;margin:6px 0 14px"><i style="left:${pos}%"></i></div>`;
    }
    // metric blocks
    const blocks=[
      ['Valuation',[['P/E',s.pe],['Fwd P/E',s.fwd_pe],['P/B',s.pb],['P/S',s.ps],['EV/EBITDA',s.ev_ebitda],['PEG',s.peg],['Div yield',s.div_yield,'%'],['Beta',s.beta]]],
      ['Quality / margins',[['ROIC',s.roic,'%'],['ROE',s.roe,'%'],['Gross mgn',s.gross_margin,'%'],['Op mgn',s.op_margin,'%'],['Net mgn',s.net_margin,'%'],['FCF mgn',s.fcf_margin,'%'],['Debt/EBITDA',s.d_to_ebitda],['Curr ratio',s.curr_ratio]]],
      ['Growth (CAGR)',[['Rev 5y',s.rev_cagr_5y,'%'],['EPS 5y',s.eps_cagr_5y,'%'],['FCF 5y',s.fcf_cagr_5y,'%'],['Rev 1y',s.rev_cagr_1y,'%'],['EPS ttm',s.eps_ttm],['EPS fwd',s.eps_fwd]]],
      ['Valuation models',[['DCF intrinsic',s.dcf_intrinsic],['DCF upside',s.dcf_upside_pct,'%'],['Comps FV',s.comps_fair_value],['Comps upside',s.comps_upside_pct,'%'],['EPV',s.epv_value],['Graham',s.graham_value],['Signal',s.combined_signal]]],
      ['Analysts / technicals',[['Mean tgt',s.analyst_mean],['Low',s.analyst_low],['High',s.analyst_high],['# analysts',s.num_analysts],['1y return',s.ret_1y,'%'],['RSI',s.rsi],['Momentum',s.mom_signal]]],
    ];
    html+=`<div class="cards" style="grid-template-columns:repeat(auto-fill,minmax(260px,1fr))">`;
    for(const [title,rows] of blocks){
      html+=`<div class="card"><div class="name">${title}</div><table style="font-size:12px">`+
        rows.map(([k,val,suf])=>`<tr><td class="muted" style="border:none;padding:3px 6px 3px 0">${k}</td>
          <td class="num" style="border:none;padding:3px 0">${val==null||val===''?'–':(typeof val==='number'?fmt(val,2):val)}${(val!=null&&suf)?suf:''}</td></tr>`).join('')+
        `</table></div>`;
    }
    html+=`</div>`;
    // options + drivers placeholders, filled async
    html+=`<div id="detOpt"></div><div id="detDrv"><div class="loading">Loading commodity drivers…</div></div>`;
    v.innerHTML=html;
    // options summary (optional)
    try{
      const o=await jget('/api/options/'+tk);
      const sm=o.summary||{};
      document.getElementById('detOpt').innerHTML=`<div class="group-title">Options</div>
        <span class="pill">ATM IV ${sm.atm_iv!=null?(sm.atm_iv*100).toFixed(1)+'%':'–'}</span>
        <span class="pill">IV mean ${sm.iv_mean!=null?(sm.iv_mean*100).toFixed(1)+'%':'–'}</span>
        <span class="pill">P/C OI ${fmt(sm.put_call_oi)}</span>
        <span class="pill">OI ${fmt(sm.total_oi,0)}</span>`;
    }catch{ document.getElementById('detOpt').innerHTML=''; }
    // commodity drivers
    try{
      const drv=await jget('/api/stocks/'+tk+'/commodities');
      document.getElementById('detDrv').innerHTML=exposureHTML(drv);
    }catch{ document.getElementById('detDrv').innerHTML=`<div class="group-title">Commodity drivers</div><div class="muted">No commodity exposure mapped for ${tk}.</div>`; }
  }catch(e){ v.innerHTML=`<button class="pill" style="cursor:pointer;border:1px solid var(--border)" onclick="renderScreener()">← Screener</button><div class="err" style="margin-top:12px">${e.message}</div>`; }
}

// ── DATA workspace (data integrity) ───────────────────────
function ageStr(iso){
  if(!iso) return '–';
  const d=new Date(iso.length<=10?iso+'T00:00:00':iso), hrs=(Date.now()-d.getTime())/3.6e6;
  const lab= hrs<24?`${hrs.toFixed(0)}h ago` : `${(hrs/24).toFixed(1)}d ago`;
  return `${iso.slice(0,16).replace('T',' ')} <span class="muted">(${lab})</span>`;
}
function covBar(val,total,label){
  const pct=total?Math.min(100,val/total*100):0;
  const col=pct>=90?'var(--green)':pct>=60?'var(--accent)':'var(--red)';
  return `<tr><td style="border:none;padding:4px 8px 4px 0">${label}</td>
    <td style="border:none;padding:4px 0;width:55%"><div style="background:#21262d;border-radius:3px;height:14px">
      <div style="background:${col};height:14px;border-radius:3px;width:${pct.toFixed(0)}%"></div></div></td>
    <td class="num muted" style="border:none;padding:4px 0 4px 8px">${val??'–'}/${total??'–'} (${pct.toFixed(0)}%)</td></tr>`;
}
async function renderData(){
  const v=document.getElementById('view');
  v.innerHTML='<div class="loading">Loading data integrity…</div>';
  try{
    const d=await jget('/api/integrity');
    const cov=d.coverage||{}, gen=d.generated||{}, mc=d.model_completeness||{}, q=d.quality_summary||{}, cm=d.commodities||{};
    const baseTot=cov.fundamentals||cov.model||0;
    // freshness
    let html=`<div class="group-title">Freshness — when each dataset was last built</div>
      <div class="card"><table style="font-size:13px">
        ${Object.entries(gen).map(([k,t])=>`<tr><td class="muted" style="border:none;padding:4px 16px 4px 0;text-transform:capitalize">${k}</td><td style="border:none;padding:4px 0">${ageStr(t)}</td></tr>`).join('')}
      </table></div>`;
    // coverage
    html+=`<div class="group-title">Coverage — rows present per stage</div>
      <div class="card"><table style="font-size:13px">
        ${covBar(cov.universe,cov.universe,'Universe (discovered)')}
        ${covBar(cov.fundamentals,Math.max(cov.universe||0,cov.fundamentals||0),'Fundamentals')}
        ${covBar(cov.model,Math.max(cov.universe||0,cov.model||0),'Valuation model')}
        <tr><td class="muted" style="border:none;padding:4px 0">Options tickers</td><td colspan="2" style="border:none;padding:4px 0">${cov.options_tickers??'–'}</td></tr>
        <tr><td class="muted" style="border:none;padding:4px 0">Exposure tickers</td><td colspan="2" style="border:none;padding:4px 0">${cov.exposure_tickers??'–'}</td></tr>
      </table></div>`;
    // data quality + model completeness side by side
    html+=`<div style="display:flex;gap:12px;flex-wrap:wrap">
      <div class="card" style="flex:1;min-width:260px"><div class="name">Data quality (fundamentals)</div>
        <table style="font-size:13px">${Object.entries(q).map(([k,val])=>{
          const col=k.startsWith('High')?'pos':k.startsWith('Low')?'neg':'';
          return `<tr><td class="${col}" style="border:none;padding:4px 16px 4px 0">${k}</td><td class="num" style="border:none;padding:4px 0">${val}</td></tr>`;
        }).join('')||'<tr><td class="muted">n/a</td></tr>'}</table></div>
      <div class="card" style="flex:1;min-width:260px"><div class="name">Valuation-model completeness</div>
        <table style="font-size:13px">
          ${covBar(mc.dcf,mc.total,'DCF')}
          ${covBar(mc.comps,mc.total,'Comps')}
          ${covBar(mc.m3,mc.total,'EPV/Graham')}
          ${covBar(mc.all3,mc.total,'All three')}
        </table></div></div>`;
    // commodities gaps
    html+=`<div class="group-title">Commodities — fetch completeness</div>
      <div class="card">
        <span class="pill">${cm.fetched??'–'}/${cm.expected??'–'} fetched</span>
        ${(cm.missing&&cm.missing.length)?`<span class="pill neg">${cm.missing.length} missing</span>`:'<span class="pill pos">all fetched</span>'}
        ${(cm.missing&&cm.missing.length)?`<div class="muted" style="margin-top:8px">missing: ${cm.missing.map(x=>x.name+' ('+x.root+')').join(', ')}</div>`:''}
      </div>`;
    v.innerHTML=html;
  }catch(e){ v.innerHTML=`<div class="err">${e.message}<br>API unreachable at ${API()} — set the base above.</div>`; }
}

// ── EDUCATION ─────────────────────────────────────────────
async function renderEducation(){
  const v=document.getElementById('view');
  // each entry: metric, feedTier, significance, sources[], multiSource, exampleSignal
  // content issues (#37…) append their section groups here.
  const GROUPS=[
  ];
  const tierColor={ohlcv:'var(--green)',collected:'var(--accent)',macro:'#a371f7',paid:'var(--red)'};
  let html=`<div style="margin:6px 0 4px"><span class="big" style="font-size:22px">Learning the business of trading</span></div>
    <div class="muted" style="margin-bottom:6px;max-width:760px">Every metric the screener computes, grouped by section. Each card: why it matters &amp; how to trade off it, the sources that back it (an <b>overlap</b> pill means 2+ sources agree), and a concrete example signal in the shortlist&rsquo;s proposed column variables (most not yet in the live screener).</div>
    <div style="margin-bottom:6px">
      <span class="pill" style="border:1px solid ${tierColor.ohlcv}">ohlcv free</span>
      <span class="pill" style="border:1px solid ${tierColor.collected}">collected free</span>
      <span class="pill" style="border:1px solid ${tierColor.macro}">macro (FRED)</span>
      <span class="pill" style="border:1px solid ${tierColor.paid}">paid feed</span>
    </div>`;
  for(const [grp,items] of GROUPS){
    html+=`<div class="group-title">${grp}</div><div class="cards" style="grid-template-columns:repeat(auto-fill,minmax(340px,1fr))">`;
    html+=items.map(it=>{
      const tc=tierColor[it.feedTier]||'var(--border)';
      const overlap=it.multiSource?`<span class="pill" style="border:1px solid var(--accent);color:var(--accent)">overlap ×${it.sources.length}</span>`:'';
      const srcPills=it.sources.map(s=>`<span class="pill" style="font-size:11px">${s}</span>`).join('');
      return `<div class="card" style="padding:14px">
        <div style="display:flex;align-items:baseline;justify-content:space-between;gap:8px">
          <div class="name">${it.metric}</div>
          <span class="pill" style="border:1px solid ${tc};color:${tc};font-size:11px;white-space:nowrap">${it.feedTier}</span>
        </div>
        <div class="muted" style="font-size:12.5px;line-height:1.5;margin:8px 0 10px">${it.significance}</div>
        <div style="margin-bottom:8px">${overlap}${srcPills}</div>
        <div class="muted" style="font-size:11px;text-transform:uppercase;letter-spacing:.5px;margin-bottom:3px">Example signal</div>
        <code style="display:block;background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:8px 10px;font-size:12px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:var(--txt);white-space:pre-wrap;word-break:break-word">${it.exampleSignal}</code>
      </div>`;
    }).join('');
    html+='</div>';
  }
  v.innerHTML=html;
}

// ── workspaces / routing ──────────────────────────────────
const SECTIONS={
  data:  {label:'Data',  icon:'🗄️', desc:'Data integrity — freshness, coverage, quality, gaps',
          tabs:[['integrity','Integrity',renderData]]},
  trader:{label:'Trader',icon:'📊', desc:'Commodities, options, commodity drivers',
          tabs:[['commodities','Commodities',renderCommodities],['options','Options',renderOptions],['drivers','Drivers',renderDrivers]]},
  stock: {label:'Stock', icon:'🏢', desc:'Equity screener + per-stock detail',
          tabs:[['screener','Screener',renderScreener]]},
  education:{label:'Education', icon:'🎓', desc:'Learning the business of trading — metric significance, source overlap, example signals',
          tabs:[['learn','Learn',renderEducation]]},
};
let SECTION=null;
function renderNav(){
  const nav=document.getElementById('nav');
  if(!SECTION){ nav.innerHTML=''; return; }
  nav.innerHTML=`<button onclick="goHome()">← Home</button>`+
    SECTIONS[SECTION].tabs.map(([id,label])=>
      `<button class="${TAB===id?'active':''}" onclick="goTab('${id}')">${label}</button>`).join('');
}
function goHome(){ SECTION=null; TAB=null; renderNav(); renderHome(); }
function goSection(id){ SECTION=id; const t=SECTIONS[id].tabs[0]; TAB=t[0]; renderNav(); t[2](); }
function goTab(id){ TAB=id; renderNav(); const t=SECTIONS[SECTION].tabs.find(x=>x[0]===id); if(t) t[2](); }
function renderHome(){
  const v=document.getElementById('view');
  v.innerHTML=`<div style="text-align:center;margin:34px 0 22px">
      <div class="big" style="font-size:28px">Trader Screener</div>
      <div class="muted">pick a workspace</div></div>
    <div class="cards" style="grid-template-columns:repeat(auto-fit,minmax(220px,1fr));max-width:780px;margin:0 auto">
      ${Object.entries(SECTIONS).map(([id,s])=>`
        <div class="card" style="cursor:pointer;text-align:center;padding:30px 18px" onclick="goSection('${id}')">
          <div style="font-size:40px;line-height:1">${s.icon}</div>
          <div class="big" style="margin:10px 0 6px">${s.label}</div>
          <div class="muted" style="font-size:13px">${s.desc}</div></div>`).join('')}
    </div>`;
}
document.getElementById('brand').onclick=goHome;
document.getElementById('apiBase').onchange=()=>{ ping(); if(SECTION&&TAB) goTab(TAB); else renderHome(); };
ping(); goHome();
setInterval(ping, 30000);
</script>
