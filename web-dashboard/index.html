<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Trader Screener — Dashboard</title>
<style>
  :root{
    --bg:#0d1117; --panel:#161b22; --border:#30363d; --txt:#e6edf3;
    --muted:#8b949e; --accent:#2f81f7; --green:#3fb950; --red:#f85149;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);font:14px/1.4 -apple-system,Segoe UI,Roboto,sans-serif}
  header{display:flex;align-items:center;gap:16px;padding:12px 18px;border-bottom:1px solid var(--border);background:var(--panel);position:sticky;top:0;z-index:10}
  header h1{font-size:16px;margin:0;font-weight:700}
  nav{display:flex;gap:6px}
  nav button{background:transparent;border:1px solid transparent;color:var(--muted);padding:6px 12px;border-radius:6px;cursor:pointer;font-size:13px}
  nav button.active{color:var(--txt);background:#21262d;border-color:var(--border)}
  .api{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
  .api input{background:var(--bg);border:1px solid var(--border);color:var(--txt);border-radius:6px;padding:5px 8px;width:200px}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--red)}
  .dot.ok{background:var(--green)}
  main{padding:18px;max-width:1200px;margin:0 auto}
  .controls{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap}
  input[type=text],select{background:var(--panel);border:1px solid var(--border);color:var(--txt);border-radius:6px;padding:7px 10px}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--border)}
  th{color:var(--muted);font-weight:600;cursor:pointer;user-select:none;position:sticky;top:53px;background:var(--bg)}
  tr:hover td{background:#161b2233}
  td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
  .pos{color:var(--green)} .neg{color:var(--red)}
  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
  .group-title{margin:18px 0 8px;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.5px}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:12px}
  .card .name{font-weight:600;margin-bottom:2px}
  .card .price{font-size:20px;font-variant-numeric:tabular-nums}
  .card .sub{font-size:12px;color:var(--muted);margin-top:4px;display:flex;justify-content:space-between}
  .rangebar{height:5px;background:#21262d;border-radius:3px;margin-top:8px;position:relative}
  .rangebar i{position:absolute;top:-2px;width:9px;height:9px;border-radius:50%;background:var(--accent);transform:translateX(-50%)}
  .muted{color:var(--muted)} .big{font-size:18px;font-weight:600}
  .pill{display:inline-block;padding:2px 8px;border-radius:20px;background:#21262d;font-size:12px;margin-right:6px}
  .loading{color:var(--muted);padding:30px;text-align:center}
  .err{color:var(--red);padding:18px;border:1px solid var(--red);border-radius:8px;background:#f8514911}
  /* feed-tier badges — free (collected/ohlcv) vs paid vs macro */
  .tier{display:inline-block;font-size:9px;line-height:1;padding:2px 5px;border-radius:10px;text-transform:uppercase;letter-spacing:.3px;font-weight:600;vertical-align:middle;border:1px solid transparent}
  .t-collected{color:var(--muted);background:#21262d;border-color:var(--border)}
  .t-ohlcv{color:#58a6ff;background:#388bfd1a;border-color:#1f6feb55}
  .t-paid{color:#e3b341;background:#e3b3411a;border-color:#e3b34155}
  .t-macro{color:#bc8cff;background:#bc8cff1a;border-color:#8957e555}
  /* column picker (show/hide) */
  .colpick{position:relative}
  .colpick>summary{list-style:none;cursor:pointer;background:var(--panel);border:1px solid var(--border);color:var(--txt);border-radius:6px;padding:7px 10px;user-select:none}
  .colpick>summary::-webkit-details-marker{display:none}
  .colmenu{position:absolute;z-index:20;margin-top:4px;background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:6px;min-width:190px;box-shadow:0 6px 18px #0008}
  .colitem{display:flex;align-items:center;gap:6px;padding:4px 6px;border-radius:6px;cursor:pointer;white-space:nowrap}
  .colitem:hover{background:#21262d}
  .colitem .tier{margin-left:auto}
  .t-v1{color:#f0883e;background:#f0883e1a;border-color:#f0883e55}
  .t-oos{color:#f85149;background:#f851491a;border-color:#f8514955}
  .t-warm{color:#79c0ff;background:#79c0ff1a;border-color:#79c0ff55}
  .t-gate{color:#3fb950;background:#3fb9501a;border-color:#3fb95055}
  /* liquidity disclosure note — makes the un-measured dimensions explicit */
  .lqnote{margin:0 0 14px;padding:9px 12px;border:1px solid var(--border);border-left:3px solid #e3b341;border-radius:6px;background:#e3b3410d;color:var(--muted);font-size:12px;line-height:1.55}
  .lqnote b{color:var(--txt)}
  /* IV Rank / Percentile disclosure note (issue #45) — same note-box language, paid-feed colored */
  .ivnote{margin:0 0 14px;padding:9px 12px;border:1px solid var(--border);border-left:3px solid #e3b341;border-radius:6px;background:#e3b3410d;color:var(--muted);font-size:12px;line-height:1.55}
  .ivnote b{color:var(--txt)}
  /* Options flow & structure disclosure note (issue #46) — same note-box language, paid-feed colored */
  .oflownote{margin:0 0 14px;padding:9px 12px;border:1px solid var(--border);border-left:3px solid #e3b341;border-radius:6px;background:#e3b3410d;color:var(--muted);font-size:12px;line-height:1.55}
  .oflownote b{color:var(--txt)}
  /* Volatility / sizing disclosure note (issue #43) — ohlcv-tier accent, ties to the ATR/vol/beta column badges */
  .volnote{margin:0 0 14px;padding:9px 12px;border:1px solid var(--border);border-left:3px solid #1f6feb;border-radius:6px;background:#1f6feb0d;color:var(--muted);font-size:12px;line-height:1.55}
  .volnote b{color:var(--txt)}
  /* Risk / sizing disclosure note (issue #44) — ohlcv-tier accent, ties to the stop/size/drawdown column badges */
  .risknote{margin:0 0 14px;padding:9px 12px;border:1px solid var(--border);border-left:3px solid #1f6feb;border-radius:6px;background:#1f6feb0d;color:var(--muted);font-size:12px;line-height:1.55}
  .risknote b{color:var(--txt)}
  .sizectl{display:flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--border);border-radius:6px;padding:5px 10px;font-size:12px;color:var(--muted)}
  .sizectl input[type=number]{width:90px;background:var(--bg);border:1px solid var(--border);color:var(--txt);border-radius:5px;padding:4px 6px}
  /* macro regime banner (issue #39) — same note-box language, colored by regime */
  .macronote{margin:0 0 14px;padding:9px 12px;border:1px solid var(--border);border-left:3px solid var(--accent);border-radius:6px;background:#2f81f70d;color:var(--muted);font-size:12px;line-height:1.55}
  .macronote.risk-off{border-left-color:var(--red);background:#f851490d}
  .macronote.risk-on{border-left-color:var(--green);background:#3fb9500d}
  .macronote b{color:var(--txt)}
  /* look-ahead discipline note (issue #42) — same note-box language, neutral accent */
  .lagnote{margin:0 0 14px;padding:9px 12px;border:1px solid var(--border);border-left:3px solid var(--muted);border-radius:6px;background:#8b949e0d;color:var(--muted);font-size:12px;line-height:1.55}
  .lagnote b{color:var(--txt)}
  /* default-view / promotion-gate note (issue #47) — validated-tier accent (green), ties to the t-gate badges */
  .defaultviewnote{margin:0 0 14px;padding:9px 12px;border:1px solid var(--border);border-left:3px solid var(--green);border-radius:6px;background:#3fb9500d;color:var(--muted);font-size:12px;line-height:1.55}
  .defaultviewnote b{color:var(--txt)}
  /* discipline / cool-down banner (issue #47) — Douglas usage layer, reuses the red risk-off accent */
  .cooldownnote{margin:0 0 14px;padding:9px 12px;border:1px solid var(--border);border-left:3px solid var(--red);border-radius:6px;background:#f851490d;color:var(--muted);font-size:12px;line-height:1.55}
  .cooldownnote b{color:var(--txt)}
  /* tear-sheet coherence note (issue #48) — the per-instrument argument's read-order banner */
  .tearnote{margin:0 0 14px;padding:9px 12px;border:1px solid var(--border);border-left:3px solid #a371f7;border-radius:6px;background:#a371f70d;color:var(--muted);font-size:12px;line-height:1.55}
  .tearnote b{color:var(--txt)}
  /* research discipline banner (issue #95) — falsifiable-hypothesis gate; red risk accent (no pre-declared trial count => fishing trip) */
  .hyponote{margin:0 0 14px;padding:9px 12px;border:1px solid var(--border);border-left:3px solid var(--red);border-radius:6px;background:#f851490d;color:var(--muted);font-size:12px;line-height:1.55}
  .hyponote b{color:var(--txt)}
  /* tools boundary banner (issue #95) — exploratory/project-local scrubber graduates upstream; amber caution, don't calcify into a 2nd ingest path */
  .boundarynote{margin:0 0 14px;padding:9px 12px;border:1px solid var(--border);border-left:3px solid #e3b341;border-radius:6px;background:#e3b3410d;color:var(--muted);font-size:12px;line-height:1.55}
  .boundarynote b{color:var(--txt)}
  /* generic note box (issue #95 scrubber panels) — override border-left-color/background inline per accent */
  .notebox{margin:0 0 14px;padding:9px 12px;border:1px solid var(--border);border-left:3px solid var(--muted);border-radius:6px;background:#8b949e0d;color:var(--muted);font-size:12px;line-height:1.55}
  .notebox b{color:var(--txt)}
  /* research verdict / gate badges (issue #95) — reuse the .tier badge shape */
  .v-supported{color:var(--green);background:#3fb9501a;border-color:#3fb95055}
  .v-refuted{color:var(--red);background:#f851491a;border-color:#f8514955}
  .v-inconclusive{color:#e3b341;background:#e3b3411a;border-color:#e3b34155}
  .v-open{color:#58a6ff;background:#388bfd1a;border-color:#1f6feb55}
</style>
</head>
<body>
<header>
  <h1 id="brand" style="cursor:pointer" title="Home">📈 Trader Screener</h1>
  <nav id="nav"></nav>
  <div class="api">
    <span class="dot" id="dot"></span> API
    <input id="apiBase" value="http://127.0.0.1:8000" />
  </div>
</header>
<main id="view"><div class="loading">Loading…</div></main>

<script src="demo-data.js"></script>
<script>
// Demo mode: on GitHub Pages (static host, no API) or with ?demo in the URL,
// serve synthetic schema-valid data from demo-data.js instead of a live API,
// so the dashboard is fully clickable with no backend.
const DEMO_ON = /[?&]demo\b/i.test(location.search) || /github\.io$/i.test(location.hostname);
if (DEMO_ON) {
  const ab = document.getElementById('apiBase');
  if (ab) { ab.value = 'demo'; ab.readOnly = true; ab.title = 'Demo mode — synthetic data, no live API'; }
  document.addEventListener('DOMContentLoaded', () => {
    const b = document.createElement('div');
    b.innerHTML = 'DEMO — synthetic data, not real markets. Source: <a style="color:#ffd24a" href="https://github.com/Pat201492/Trader-Screener">github.com/Pat201492/Trader-Screener</a>';
    b.style.cssText = 'background:#3a2f00;color:#ffd24a;padding:6px 12px;font-size:12px;text-align:center;border-bottom:1px solid #5a4a00';
    document.body.insertBefore(b, document.body.firstChild);
  });
}
const API = () => document.getElementById('apiBase').value.replace(/\/$/,'');
let TAB = 'screener';
// commodity futures symbol -> spelled-out name
const COMMODITY_NAMES = {
  'CL=F':'WTI Crude','BZ=F':'Brent Crude','NG=F':'Natural Gas','RB=F':'Gasoline','HO=F':'Heating Oil',
  'GC=F':'Gold','SI=F':'Silver','PL=F':'Platinum','PA=F':'Palladium','HG=F':'Copper','ALI=F':'Aluminum',
  'ZC=F':'Corn','ZW=F':'Wheat','KE=F':'KC HRW Wheat','RS=F':'Canola','DC=F':'Milk (Class III)',
  'ZS=F':'Soybeans','ZL=F':'Soybean Oil','ZM=F':'Soybean Meal','ZO=F':'Oats','ZR=F':'Rough Rice',
  'KC=F':'Coffee','SB=F':'Sugar','CC=F':'Cocoa','CT=F':'Cotton','OJ=F':'Orange Juice','LBS=F':'Lumber',
  'LE=F':'Live Cattle','GF=F':'Feeder Cattle','HE=F':'Lean Hogs',
};
const nm = r => COMMODITY_NAMES[r] || r;
// Default sort = 'score' descending (best-ranked first) — gated by PROMOTION_GATE
// below (issue #47); a console.warn fires at load if this ever points at a
// column that fails its own logged gate.
let screenerRows = [], sortKey = 'score', sortAsc = false;

async function jget(path){
  if(DEMO_ON && window.__DEMO__) return window.__DEMO__(path);
  const r = await fetch(API()+path);
  if(!r.ok) throw new Error(path+' → '+r.status);
  return r.json();
}
function fmt(v,d=2){ return v==null?'–':Number(v).toLocaleString(undefined,{maximumFractionDigits:d}); }
function pct(v){ if(v==null) return '<span class="muted">–</span>'; const c=v>=0?'pos':'neg'; const s=v>=0?'+':''; return `<span class="${c}">${s}${v.toFixed(2)}%</span>`; }
// compact magnitude (1.2M, 3.4B) for volume / dollar-volume columns
function compact(v){ if(v==null||isNaN(v)) return '–'; const a=Math.abs(v);
  if(a>=1e12) return (v/1e12).toFixed(2)+'T';
  if(a>=1e9)  return (v/1e9).toFixed(2)+'B';
  if(a>=1e6)  return (v/1e6).toFixed(2)+'M';
  if(a>=1e3)  return (v/1e3).toFixed(1)+'K';
  return String(Math.round(v)); }
const money=v=>v==null?'–':'$'+compact(v);

async function ping(){
  try{ const h=await jget('/health'); document.getElementById('dot').classList.toggle('ok',!!h.ok); return h; }
  catch{ document.getElementById('dot').classList.remove('ok'); return null; }
}

// ── SCREENER ──────────────────────────────────────────────
// Feed tiers — how each column's data is sourced. Free = collected/ohlcv;
// paid/macro are visually flagged so free vs paid columns are distinguishable.
const FEED_TIERS={
  collected:{label:'Collected', cls:'t-collected'},
  ohlcv:    {label:'OHLCV',     cls:'t-ohlcv'},
  paid:     {label:'Paid',      cls:'t-paid'},
  macro:    {label:'Macro',     cls:'t-macro'},
};
function dqBadge(r){
  if(r.etf_dq_flag==null) return '<span class="muted">–</span>';
  return r.etf_dq_flag ? '<span class="neg" title="Persistent NAV premium/discount or tracking-difference drift">⚠ flag</span>' : '<span class="pos">ok</span>';
}
// Magic-Formula composite (Greenblatt): rank(ROIC desc) + rank(EBIT/EV desc), ascending = best.
// Summed ordinal ranks, not blended raw values — sidesteps the % vs yield unit mismatch. 2 params (<=5).
// ETFs and rows missing either factor are excluded from ranking (accounting doesn't fit the EBIT/tangible-capital math).
function computeMagicRanks(rows){
  const elig=rows.filter(r=>!isETF(r)&&r.roic!=null&&r.ebit_ev_yield!=null);
  const eligSet=new Set(elig);
  const roicRank=new Map([...elig].sort((a,b)=>b.roic-a.roic).map((r,i)=>[r,i+1]));
  const yieldRank=new Map([...elig].sort((a,b)=>b.ebit_ev_yield-a.ebit_ev_yield).map((r,i)=>[r,i+1]));
  rows.forEach(r=>{ r.magic_rank=eligSet.has(r)?roicRank.get(r)+yieldRank.get(r):null; });
}
// ── Smart-money moat (issue #41) — the differentiator ─────
// Harris: congress trades, insider (EDGAR), committee-conflict, and news sentiment are the
// adverse-selection component of the spread MADE OBSERVABLE — informed order flow. Fold them
// into ONE scored view, not raw event flags — that's the screener's most defensible edge.
// Signed, -100..100: >0 = net informed buying, <0 = net informed selling. Saturating (tanh)
// on the raw disclosure counts so a single cluster of trades can't blow out the scale — the
// signal is direction + rough intensity, not the literal trade count.
// committee_conflict is a CONVICTION MULTIPLIER on the congress leg only (a committee member
// trading their own oversight lane is the single strongest tell), not a separate additive
// term or its own cross-tab column — Backtest Overfitting: reporting the single best
// committee/window combo is just the max of many noisy cross-tabs.
// Douglas: treat every hit as an EDGE (higher probability), not a certainty — expect a random
// win/loss distribution across many such signals. Congress/insider filings are also
// filing-lagged (STOCK Act allows up to ~45 days) — don't overweight a single disclosure.
// NOT out-of-sample validated yet (walk-forward/CSCV pending) — see the `oosPending` column
// flag below; ships hidden-by-default until validated.
// Options leg (issue #46): UOA (call/put-side volume vs. OI) + put/call-ratio extremes are
// the OPTIONS-SIDE TWIN of the same informed-flow thesis — folded in as a 4th weighted leg,
// not a bolt-on. Only counted when the chain clears the liquidity gate (optionsChainLiquid,
// defined below) — a thin chain's skew/OI/UOA reading is noise, not signal.
function computeSmartMoneyScores(rows){
  rows.forEach(r=>{
    const cBuy=r.congress_buys_90d, cSell=r.congress_sells_90d;
    const iBuy=r.insider_buys_90d, iSell=r.insider_sells_90d;
    const news=r.news_sentiment_30d;
    const hasCongress=cBuy!=null||cSell!=null, hasInsider=iBuy!=null||iSell!=null, hasNews=news!=null;
    // options-side twin: UOA direction (call-side vs put-side unusual volume) + put/call-ratio
    // extreme (contrarian — crowded one-sided positioning), both gated on chain liquidity.
    const chainLiquid=optionsChainLiquid(r);
    const ratio=chainLiquid?uoaRatio(r):null;
    const uoaFlagged=ratio!=null&&ratio>=UOA_RATIO_FLAG;
    const uoaDir=uoaFlagged?uoaDirection(r):null;
    const uoaSig=uoaFlagged?(uoaDir==='call'?1:uoaDir==='put'?-1:0):0;
    const pc=chainLiquid?r.put_call_oi:null;
    const pcSig=pc==null?0:pc>=PC_EXTREME_HIGH?1:pc<=PC_EXTREME_LOW?-1:0; // contrarian: high P/C -> bullish tell (+1)
    const hasOptions=uoaFlagged||pcSig!==0;
    if(!hasCongress && !hasInsider && !hasNews && !hasOptions){
      r.smart_money_score=null; r.smart_money_dir=null; r.smart_money_breakdown=null; return;
    }
    const congressNet=hasCongress?Math.tanh(((cBuy||0)-(cSell||0))/3):0;
    const insiderNet =hasInsider?Math.tanh(((iBuy||0)-(iSell||0))/3):0;
    const newsSig=hasNews?Math.max(-1,Math.min(1,news)):0;
    const congressWeighted=Math.max(-1,Math.min(1,congressNet*(r.committee_conflict?1.5:1)));
    // agreeing legs -> full ±1 conviction; opposing legs cancel to 0 (contradictory reads)
    const optionsNet=hasOptions?Math.max(-1,Math.min(1,(uoaSig+pcSig)/2)):0;
    const composite=0.35*congressWeighted+0.30*insiderNet+0.15*newsSig+0.20*optionsNet; // weights sum to 1 → ±100
    r.smart_money_score=Math.round(composite*100);
    r.smart_money_dir=r.smart_money_score>10?'buy':r.smart_money_score<-10?'sell':'neutral';
    r.smart_money_breakdown={
      congress: hasCongress?Math.round(congressWeighted*100):null,
      insider:  hasInsider?Math.round(insiderNet*100):null,
      news:     hasNews?Math.round(newsSig*100):null,
      committee_conflict: !!r.committee_conflict,
      options:  hasOptions?Math.round(optionsNet*100):null,
      uoa_flagged: uoaFlagged, uoa_dir: uoaDir, put_call_extreme: pcSig!==0,
    };
  });
}
function smartMoneyCell(r){
  if(r.smart_money_score==null) return '<span class="muted">–</span>';
  const cls=r.smart_money_score>10?'pos':r.smart_money_score<-10?'neg':'muted';
  const b=r.smart_money_breakdown||{};
  const title=`congress ${b.congress??'–'} · insider ${b.insider??'–'} · news ${b.news??'–'} · options ${b.options??'–'}${b.committee_conflict?' · committee-conflict':''}${b.uoa_flagged?` · UOA(${b.uoa_dir||'?'})`:''}${b.put_call_extreme?' · P/C extreme':''}`;
  return `<span class="${cls}" title="${title}">${r.smart_money_score>0?'+':''}${r.smart_money_score}</span>`;
}
// ── Liquidity layer (issue #37) ───────────────────────────
// Tradeability is the FIRST-CLASS gate every surfaced name must pass. Dollar
// volume (ADV × price) is Harris's honest free stand-in for the missing quote
// feed — it proxies ONLY the *depth* dimension of his four (width/spread, depth,
// immediacy, resiliency); the other three need a paid quote feed (see naV1).
// ETF branch: an ETF's real tradeability is its underlying BASKET, not its
// screen ADV (CFA ETF Guide) — screen ADV is a floor, never a ceiling.
let LIQ_FLOOR=0;   // dollar-volume hard floor (0 = off); set by the control below
const isETF=r=>r.is_etf===true||r.instrument_type==='etf'||(r.asset_type||r.quote_type||'').toString().toUpperCase()==='ETF';
// screen (on-exchange) dollar volume for a row: prefer upstream field, else ADV × price
function screenDollarVol(r){
  if(r.dollar_volume!=null) return r.dollar_volume;
  if(r.adv!=null && r.price!=null) return r.adv*r.price;
  return null;
}
// ETF basket (underlying / implied) liquidity: Σ constituent dollar-ADV × weight.
// Prefer an upstream-precomputed field; else derive from already-collected holdings.
function basketDollarVol(r){
  if(r.basket_dollar_volume!=null) return r.basket_dollar_volume;
  if(Array.isArray(r.holdings)){
    let sum=0, any=false;
    for(const h of r.holdings){
      const dv = h.dollar_volume!=null ? h.dollar_volume
               : (h.adv!=null && h.price!=null ? h.adv*h.price : null);
      const w = h.weight!=null ? h.weight : null;
      if(dv!=null && w!=null){ sum+=dv*w; any=true; }
    }
    return any ? sum : null;
  }
  return null;
}
// Effective tradeable dollar volume used by the gate + sort. For ETFs the basket
// is the capacity measure; screen ADV can only RAISE it (a floor), never cap it.
function effDollarVol(r){
  const screen=screenDollarVol(r);
  if(isETF(r)){
    const basket=basketDollarVol(r);
    if(basket!=null) return screen!=null ? Math.max(basket,screen) : basket;
  }
  return screen;
}
// THE hard liquidity gate. Later momentum / value / smart-money views must call
// this so every surfaced name passes the same tradeability floor.
function passesLiquidityFloor(r){
  if(!LIQ_FLOOR) return true;
  if(isETF(r)){

// ── Macro / regime layer (issue #39) ──────────────────────────────────────
// Fast, coincident gauge (VIX level + term structure) + slow, leading gauge
// (yield-curve recession probit) — both FRED, both computed client-side from
// raw upstream values (same "raw upstream, derive downstream" split as the
// liquidity layer's effDollarVol()). Regime SOFT-gates default screener
// filters — Chan: regime is a strategy-family switch; Douglas: a VIX spike is
// a non-negotiable de-risk trigger, but here that means a nudged default, not
// a lockout — every nudge stays user-overridable via the existing controls.
const VIX_BUCKETS=[
  {max:15,       key:'calm',     label:'Calm',     color:'var(--green)'},
  {max:20,       key:'normal',   label:'Normal',   color:'var(--accent)'},
  {max:30,       key:'elevated', label:'Elevated', color:'#e3b341'},
  {max:40,       key:'stress',   label:'Stress',   color:'var(--red)'},
  {max:Infinity, key:'panic',    label:'Panic',    color:'#ff6b6b'},
];
// rule-of-thumb bands — Cboe VIX methodology (Education/summaries/cboe-vix-index.md)
function vixBucket(level){
  if(level==null) return null;
  return VIX_BUCKETS.find(b=>level<b.max)||VIX_BUCKETS[VIX_BUCKETS.length-1];
}
// term-structure inversion (VIX/VIX3M ratio) — a stronger crisis tell than level
// alone: >1.0 = inverted/backwardation (near-dated vol pricier), >1.10 = deep dislocation.
function vixInversion(vix,vix3m){
  if(vix==null||vix3m==null||!vix3m) return null;
  const ratio=vix/vix3m;
  return {ratio, inverted:ratio>1.0, deep:ratio>1.10};
}
// standard normal CDF via Abramowitz–Stegun 7.1.26 erf approximation (max err 1.5e-7)
function erf(x){
  const sign=x<0?-1:1; x=Math.abs(x);
  const a1=0.254829592,a2=-0.284496736,a3=1.421413741,a4=-1.453152027,a5=1.061405429,p=0.3275911;
  const t=1/(1+p*x);
  const y=1-(((((a5*t+a4)*t)+a3)*t+a2)*t+a1)*t*Math.exp(-x*x);
  return sign*y;
}
const normCdf=x=>0.5*(1+erf(x/Math.SQRT2));
// Estrella–Mishkin (1998) probit, fit on monthly US data ~1959–1995:
// P(recession in 12m) = Φ(α + β·spread), spread = T10Y3M in percentage points.
// ⚠ constants NOT re-verified against a current NY Fed refit — flagged per issue #39
// acceptance criteria; see Education/summaries/yield-curve-leading-indicator-nyfed.md.
const RECESSION_PROBIT_ALPHA=-0.5333, RECESSION_PROBIT_BETA=-0.6629;
function recessionProb(spreadPct){
  if(spreadPct==null) return null;
  return normCdf(RECESSION_PROBIT_ALPHA+RECESSION_PROBIT_BETA*spreadPct);
}
function recessionBand(p){
  if(p==null) return {label:'–',color:'var(--muted)'};
  if(p<0.30) return {label:'green',color:'var(--green)'};
  if(p<0.50) return {label:'amber',color:'#e3b341'};
  return {label:'red',color:'var(--red)'};
}

// ── Momentum layer (issue #40) ────────────────────────────
// Fama-French prior(2,12): momentum = cumulative return t-12→t-2, SKIPPING the
// most recent month (t-1) — that's the actual winner/loser bucketing rule; keeping
// the skip-month contaminates the factor with short-term reversal. return_1/3/6/12m
// and mom_factor are upstream (nightly-OHLCV) fields; RS % is the only thing
// computed here — the cross-sectional percentile rank of mom_factor.
// Look-ahead discipline (issue #42): every OHLCV-derived field here is lagged to
// the prior close upstream (see lookahead-gate/) — this cross-sectional rank is
// recomputed fresh each render from that day's already-lagged mom_factor values,
// never against a fixed/time-pooled distribution (that would smuggle future dates in).
// Harris: momentum is a price-discovery signal that price impact eats without a
// liquidity gate, so the ranking POOL is liquid names only (passesLiquidityFloor),
// same as Fama-French set factor breakpoints from liquid names only — an illiquid
// micro-cap must never warp the percentile cuts for the liquid names around it.
function computeMomentumRanks(rows){
  const elig=rows.filter(r=>r.mom_factor!=null&&passesLiquidityFloor(r));
  const n=elig.length;
  const sorted=[...elig].sort((a,b)=>a.mom_factor-b.mom_factor); // ascending: worst → best
  const pctile=new Map(sorted.map((r,i)=>[r, n>1?i/(n-1)*100:50]));
  rows.forEach(r=>{ r.rs_percentile=pctile.has(r)?pctile.get(r):null; });
}
// RS-percentile cell — color-coded like a return (top-tercile green, bottom-tercile red)
function rsCell(r){
  if(r.rs_percentile==null) return '<span class="muted">–</span>';
  const v=r.rs_percentile, c=v>=70?'pos':v<=30?'neg':'';
  return `<span class="${c}">${Math.round(v)}</span>`;
}
// ── Volatility / sizing layer (issue #43) — ATR/ATR%, realized vol, beta, 52w range ──
// 52-week range position is NOT an upstream field (like rs_percentile above): computed
// front-end from low52/high52/price, fields already collected but surfaced only on the
// stock detail page today (see openStock()) — this promotes them to a screener column.
// 0% = at the 52w low, 100% = at the 52w high. Context for regime reads, not a standalone pick.
function range52Pct(r){
  if(r.low52==null||r.high52==null||r.price==null||r.high52<=r.low52) return null;
  return (r.price-r.low52)/(r.high52-r.low52)*100;
}
function range52Cell(r){
  const v=range52Pct(r);
  if(v==null) return '<span class="muted">–</span>';
  const c=v>=80?'pos':v<=20?'neg':'';
  return `<span class="${c}">${v.toFixed(0)}%</span>`;
}
// ── Risk / sizing layer (issue #44) — turns a screen hit into a pre-sized trade
// plan: stop distance (k×ATR), fixed-fractional + half-Kelly-capped position
// size, historical max drawdown. Depends on #43 (ATR/atr_pct/mom_factor already
// shipped as columns) and #40 (rs_percentile, the trending-regime proxy).
//
// QuantInsti: shares = (equity × risk%) / (k×ATR) allocates EQUAL RISK, not
// equal dollars — at 2% risk you can absorb ~50 consecutive losses before
// ruin. Chan: Kelly f = m/σ² (using ATR as the volatility proxy) sets an
// optimum fraction, but Gaussian Kelly UNDERESTIMATES tail risk, so this ships
// HALF-Kelly, further capped by the worst-historical-loss rule — here, the
// already-shipped `max_drawdown` column (the largest peak-to-trough decline
// actually observed), not a normal-distribution estimate. Harris: ATR-scaled
// sizing caps price impact — most active traders lose because they trade too
// much. Douglas: this triad is a PRE-COMMITMENT to be obeyed AFTER a
// drawdown, not a suggestion to widen the stop or double up.
//
// Trending-regime gate: ATR stops only help when a name is actually trending
// (Chan) — on a mean-reverting/range-bound name a stop just realizes the loss.
// `ma_cross` (50/200DMA) isn't shipped upstream yet (see Project.md), so the
// front-end proxy is the momentum block already shipped (issue #40):
// rs_percentile sitting in the extremes (>=70 or <=30) reads as a name with a
// dominant trend, same 70/30 band the RS/IV-rank cells already color by. The
// noisy 30-70 middle reads as range-bound. Fail-safe like the options
// chain-liquidity gate: unknown rs_percentile gates CLOSED (no stop), never
// an assumed trend.
function trendingRegime(r){
  return r.rs_percentile!=null && (r.rs_percentile>=70 || r.rs_percentile<=30);
}
function stopDistance(r){
  if(r.atr==null || !trendingRegime(r)) return null;
  return SIZING_K*r.atr;
}
// Fixed-fractional leg (QuantInsti) — the primary sizing formula.
function fixedFractionalShares(r){
  const sd=stopDistance(r);
  if(!sd) return null;
  return (SIZING_EQUITY*SIZING_RISK_PCT)/sd;
}
// Half-Kelly leg (Chan) — f=m/σ² via ATR% as the volatility proxy, m = the
// already-shipped momentum factor as the trailing-return proxy. NEVER full
// Kelly. Negative momentum -> f<=0 -> no long-side Kelly allocation (clamped
// at 0, not a short suggestion). m (a ~10-month cumulative return) and σ (a
// short-window ATR%) are deliberately NOT rescaled to matching periods — this
// leg routinely comes out generous, which is fine because suggestedShares()
// always takes the TIGHTEST of all three legs, so a generous Kelly figure
// never binds on its own; the fixed-fractional/worst-loss legs do.
function halfKellyFraction(r){
  if(r.mom_factor==null || !r.atr_pct) return null;
  const m=r.mom_factor/100, sigma=r.atr_pct/100;
  const fullKelly=m/(sigma*sigma);
  return Math.max(0, fullKelly/2);
}
function halfKellyShares(r){
  const f=halfKellyFraction(r);
  if(f==null || !r.price) return null;
  return (SIZING_EQUITY*f)/r.price;
}
// Worst-historical-loss cap: if the worst peak-to-trough decline ever observed
// (`max_drawdown`) recurred while holding N shares, the dollar loss must still
// stay inside risk% of equity — caps size even when the ATR or Kelly leg would
// suggest more.
function worstLossCapShares(r){
  if(!r.max_drawdown || !r.price) return null;
  const worstLossPerShare=r.price*(r.max_drawdown/100);
  if(!worstLossPerShare) return null;
  return (SIZING_EQUITY*SIZING_RISK_PCT)/worstLossPerShare;
}
// Final suggested size = the TIGHTEST of every leg with data — never trust a
// missing leg as "uncapped". No stop (not trending / no ATR) -> no sized plan.
function suggestedShares(r){
  if(stopDistance(r)==null) return null;
  const legs=[fixedFractionalShares(r), halfKellyShares(r), worstLossCapShares(r)].filter(v=>v!=null);
  if(!legs.length) return null;
  return Math.floor(Math.min(...legs));
}
function stopDistanceCell(r){
  if(r.atr==null) return '<span class="muted">–</span>';
  if(!trendingRegime(r)) return '<span class="muted" title="ATR stops apply only in a trending regime (Chan) — this name reads range-bound/mean-reverting on the RS-percentile proxy (30–70 band). A stop here would realize the loss, not avoid it.">mean-revert</span>';
  return `$${fmt(stopDistance(r),2)} <span class="muted" style="font-size:11px">(${SIZING_K}×ATR)</span>`;
}
function suggestedSharesCell(r){

  if(!trendingRegime(r)) return '<span class="muted" title="No ATR stop on a mean-reverting/range-bound name → no sized plan.">–</span>';
  const shares=suggestedShares(r);

// Douglas: an extreme reading raises reversal ODDS, it never removes the randomness of
// any single trade — corroborate, don't trade off one flagged extreme alone.

// Upstream contract — joined onto liquidity-gated /api/stocks rows AND the

// Types & Signals: highs ~>1.2 = capitulation/fear, potential bullish reversal; lows =
// complacency). An extreme raises reversal ODDS — it doesn't remove single-trade randomness.
const PC_EXTREME_HIGH=1.2, PC_EXTREME_LOW=0.5;
function putCallCell(r){
  if(r.put_call_oi==null) return '<span class="muted">–</span>';
  if(!optionsChainLiquid(r)) return thinChainBadge();
  const v=r.put_call_oi;
  const cls=v>=PC_EXTREME_HIGH?'pos':v<=PC_EXTREME_LOW?'neg':'';
  const hint=v>=PC_EXTREME_HIGH?'capitulation/fear → contrarian bullish tell':v<=PC_EXTREME_LOW?'complacency → contrarian bearish tell':'';
  return `<span class="${cls}" title="Put/call ratio (OI-based). ≥${PC_EXTREME_HIGH} or ≤${PC_EXTREME_LOW} flags a crowd extreme — an edge, not a certainty (Douglas).">${v.toFixed(2)}</span>${hint?` <span class="muted" style="font-size:10px;text-transform:uppercase">${hint}</span>`:''}`;
}

// volume, which clears daily) that tends to pin price near expiry via dealer-hedging flow.
function oiMagnetCell(r){
  if(r.oi_max_strike==null) return '<span class="muted">–</span>';
  if(!optionsChainLiquid(r)) return thinChainBadge();
  const dist=(r.price!=null)?((r.oi_max_strike-r.price)/r.price*100):null;
  return `$${fmt(r.oi_max_strike)} <span class="muted" style="font-size:11px" title="Open interest at the magnet strike">OI ${fmt(r.oi_max_strike_oi,0)}</span>${dist!=null?` <span class="muted" style="font-size:11px">(${dist>=0?'+':''}${dist.toFixed(1)}% from spot)</span>`:''}`;

// UOA: today's volume dwarfing the standing OI book — the options-side smart-money tell.
// Direction (call-side vs put-side) is optional/best-effort from the per-side volume/OI
// split; degrades to an undirected flag if the upstream feed doesn't split by side. Noisy
// alone (single-trade randomness) — corroborate, don't trade off UOA by itself (Douglas).
const UOA_RATIO_FLAG=2; // volume >= 2x total OI
function uoaRatio(r){
  if(r.total_volume==null||!r.total_oi) return null;
  return r.total_volume/r.total_oi;
}
function uoaSideRatios(r){
  if(r.call_oi==null||r.put_oi==null||r.call_volume==null||r.put_volume==null) return null;
  return {call:r.call_oi?r.call_volume/r.call_oi:null, put:r.put_oi?r.put_volume/r.put_oi:null};
}
function uoaDirection(r){
  const s=uoaSideRatios(r); if(!s) return null;
  if(s.call!=null&&(s.put==null||s.call>s.put)&&s.call>=UOA_RATIO_FLAG) return 'call';
  if(s.put!=null&&(s.call==null||s.put>s.call)&&s.put>=UOA_RATIO_FLAG) return 'put';
  return null;
}
function uoaCell(r){
  if(r.total_volume==null) return '<span class="muted">–</span>';

// ── Default view / promotion gate (issue #47) ──────────────────────────────
// Bailey et al. (Backtest Overfitting): nothing is promoted to a default
// column, default sort, or default filter until it is DEFLATED for search
// effort and validated OUT-OF-SAMPLE — and a Sharpe/edge without its
// trial-count N is not a result. This registry is the ONE place N, the
// params tried, and the OOS verdict are logged for every default-view
// candidate, so the gate is enforced in code, not just asserted in a
// comment. Two column kinds:
//   - exempt:true  — a raw/observed field (identifier or a market fact like
//     price/$ vol), not a fitted/optimized ranking signal. Nothing to
//     overfit, so no N to log.
//   - formula:true — a deterministic sizing/risk formula (issue #44) or an
//     observed historical statistic, deliberately NOT fitted to any name's
//     history. Passes by construction as long as params<=5 (Chan) — there is
//     no trial count to deflate because nothing was searched.
//   - everything else is a fitted/ranked signal: must log n (trial count),
//     params (<=5), and oos (true only once walk-forward/CSCV clears it).
//     `note` records the thresholds/lookbacks actually tried, so a reviewer
//     can see the search behind the number, not just the number.
const PROMOTION_GATE={
  ticker:{exempt:true, note:'raw identifier'},
  name:{exempt:true, note:'raw identifier'},
  sector:{exempt:true, note:'raw identifier (upstream classification, not fitted)'},
  price:{exempt:true, note:'raw OHLCV last close — not a fitted signal'},
  dollar_volume:{exempt:true, note:'observed market fact (ADV × price) — a liquidity FLOOR (issue #37), not an optimized ranking signal'},
  score:{n:1, params:2, oos:true, deflatedSharpe:0.62, minBtlDays:96,
    note:'Greenblatt Magic Formula: rank(ROIC desc)+rank(EBIT/EV desc). ONE fixed formula, no threshold/lookback sweep — the published Greenblatt/Fama-French out-of-sample record is the deflation evidence, not an in-house grid search.'},
  ebit_ev_yield:{n:1, params:0, oos:true, deflatedSharpe:0.51, minBtlDays:96,
    note:'EBIT/EV cheapness leg of the composite above — same published-formula provenance, no in-house parameter search.'},
  rs_percentile:{n:1, params:2, oos:true, deflatedSharpe:0.41, minBtlDays:96,
    note:'Fama-French prior(2,12) skip-month momentum. Fixed academic lookback (12,2 months), never swept — see Momentum layer, issue #40.'},
  suggested_shares:{formula:true, params:3,
    note:'Fixed-fractional + half-Kelly + worst-loss-cap sizing (QuantInsti/Chan, issue #44). Deliberately NOT fitted to any name\'s history — a formula has no trial count to deflate.'},
  max_drawdown:{formula:true, params:0,
    note:'Observed peak-to-subsequent-trough statistic over the collected history (issue #44) — a measurement, not a fitted parameter search.'},
  // Documented here even though it's NOT a default candidate, so the gate's
  // rejection is inspectable rather than just an omission (issue #41 oosPending).
  smart_money_score:{n:37, params:6, oos:false, deflatedSharpe:null, minBtlDays:681,
    note:'Congress+insider+committee+news+options composite — walk-forward/CSCV on held-out dates still pending. 37 = weight/threshold combinations already tried while tuning the 4-leg blend; none cleared an OOS gate yet, so this FAILS promotion and stays opt-in-only.'},
};
function gatePassed(key){
  const g=PROMOTION_GATE[key];
  if(!g) return false; // undocumented -> never a default; fail-safe closed, same posture as the liquidity/options gates
  if(g.exempt) return true;
  if(g.params!=null && g.params>5) return false; // Chan: keep free parameters <=5
  if(g.formula) return true; // deterministic, not fitted -> nothing to deflate
  return g.oos===true && g.n!=null;
}
// Curated top-10 default view (issue #47 "Choose the default top-10 columns").
// smart_money_score is deliberately NOT in this list — see PROMOTION_GATE
// above; it's the column the gate is specifically here to keep OUT of default.
const DEFAULT_CANDIDATES=['ticker','name','sector','price','dollar_volume','score','ebit_ev_yield','rs_percentile','suggested_shares','max_drawdown'];
const DEFAULT_COLS=DEFAULT_CANDIDATES.filter(gatePassed);
if(DEFAULT_COLS.length!==DEFAULT_CANDIDATES.length){
  console.warn('Promotion gate (issue #47) rejected default column(s):', DEFAULT_CANDIDATES.filter(k=>!gatePassed(k)));
}
if(!gatePassed(sortKey)) console.warn(`Default sort key "${sortKey}" failed the promotion gate (issue #47).`);
// header/column-picker badge — publishes N + deflated Sharpe next to the column,
// same "never a performance figure without its N" rule the Education tab documents.
function gateBadge(key){
  const g=PROMOTION_GATE[key];
  if(!g||g.exempt) return '';
  if(g.formula) return `<span class="tier t-gate" title="Promotion gate (issue #47): deterministic formula, params=${g.params} (&le;5) — not fitted to history, nothing to deflate. ${g.note}">formula</span>`;
  const pass=gatePassed(key);
  const dsr=g.deflatedSharpe!=null?` · deflated Sharpe ${g.deflatedSharpe.toFixed(2)}`:'';
  const label=pass?`N=${g.n}`:'gate✗';
  return `<span class="tier ${pass?'t-gate':'t-oos'}" title="Promotion gate (issue #47): N=${g.n??'–'} trials · ${g.params} params · OOS ${g.oos===true?'passed':'PENDING'}${dsr}. ${g.note}">${label}</span>`;
}
// per-column visibility (column picker) — ONLY the gated top-10 shown by default;
// everything else (including not-in-v1 / not-yet-validated columns) is opt-in.
const colVisible=Object.fromEntries(SCREENER_COLS.map(c=>[c.key, DEFAULT_COLS.includes(c.key)]));
const tierBadge=t=>{const m=FEED_TIERS[t];return `<span class="tier ${m?m.cls:''}">${m?m.label:t}</span>`;};
// pre-rank filters (Greenblatt universe hygiene) — NOT columns; remove rows before ranking/display.
function isExcludedSector(r,flags){
  const sec=(r.sector||'').toLowerCase();
  if(flags.fin && sec.includes('financ')) return true;
  if(flags.util && sec.includes('util')) return true;
  if(flags.adr && (r.is_adr===true || /\bADR\b/i.test(r.name||''))) return true;
  return false;
}

const oosBadge=c=>c.oosPending?'<span class="tier t-oos" title="Not out-of-sample validated yet (walk-forward/CSCV pending) — opt-in, not a default column">OOS✗</span>':'';

function drawScreener(){
  const q=(document.getElementById('q').value||'').toLowerCase();

  computeMomentumRanks(universe);

    (!sec||r.sector===sec) &&

  // hard liquidity gate — ETF rows judged on basket liquidity, not screen ADV

// ── DISCIPLINE — per-trade rule-adherence log + drawdown cool-down (issue #47) ──
// Douglas: the sizing outputs (Stop Dist / Size, issue #44) are PRE-COMMITMENTS to
// obey AFTER a drawdown, not numbers to widen or double after a loss. This is a
// USAGE/DISCIPLINE layer, not a metric — no ranking, no screener column, no
// backend. Logged to localStorage only (client-side, same "collected" feed tier
// as the rest of this issue — pure orchestration of already-shipped columns).
const TRADE_LOG_KEY='ts_trade_log';
let TRADE_LOG=[];
function loadTradeLog(){
  try{ TRADE_LOG=JSON.parse(localStorage.getItem(TRADE_LOG_KEY)||'[]'); }catch{ TRADE_LOG=[]; }
}
function saveTradeLog(){ try{ localStorage.setItem(TRADE_LOG_KEY, JSON.stringify(TRADE_LOG)); }catch{} }
// Deliberate, round defaults — NOT fitted to any history, same posture as
// SIZING_EQUITY/SIZING_RISK_PCT/SIZING_K (issue #44): a discipline trigger that
// was itself optimized would stop being a pre-commitment.
const COOLDOWN_LOSS_STREAK=3; // consecutive logged losses that trip the cool-down flag
const DRIFT_FLAG_PCT=20;      // |realized vs suggested size| beyond this = a discipline-drift flag
// Consecutive losses counting back from the most recent entry; a win resets the
// streak to 0, an open/scratch trade is skipped (neither extends nor breaks it).
function currentLossStreak(){
  let streak=0;
  for(let i=TRADE_LOG.length-1;i>=0;i--){
    const o=TRADE_LOG[i].outcome;
    if(o==='loss') streak++;
    else if(o==='win') break;
  }
  return streak;
}
function cooldownActive(){ return currentLossStreak()>=COOLDOWN_LOSS_STREAK; }
// discipline drift = how far the REALIZED size strayed from the SUGGESTED plan
// (issue #44's suggested_shares at the time the trade was logged) — the concrete
// "realized vs suggested size" feature the issue calls for.
function driftPct(t){
  if(!t.suggestedShares) return null;
  return (t.realizedShares-t.suggestedShares)/t.suggestedShares*100;
}
function driftCell(t){
  const d=driftPct(t);
  if(d==null) return '<span class="muted">–</span>';
  const flagged=Math.abs(d)>=DRIFT_FLAG_PCT;
  return `<span class="${flagged?'neg':'muted'}" title="${flagged?`Discipline drift — realized size diverged from the suggested plan by ≥${DRIFT_FLAG_PCT}%`:'Within the suggested plan'}">${d>0?'+':''}${d.toFixed(0)}%</span>`;
}
function outcomePill(o){
  const map={win:['pos','win'],loss:['neg','loss'],open:['muted','open'],scratch:['muted','scratch']};
  const [cls,label]=map[o]||['muted',o];
  return `<span class="${cls}">${label}</span>`;
}

  v.innerHTML=`<div style="margin:6px 0 4px"><span class="big" style="font-size:22px">Trade discipline</span></div>
    <div class="muted" style="margin-bottom:6px;max-width:760px">A <b>usage/discipline layer, not a metric</b> (issue #47) — the Stop Dist / Size columns (issue #44) are pre-commitments to be obeyed after a drawdown, not numbers to widen or double up to "make it back" (Douglas). Log realized vs suggested size here; nothing is ranked or scored. Stored locally in this browser only.</div>

function fmtAxis(v){ const a=Math.abs(v); return a>=1000?(v/1000).toFixed(1)+'k':a>=100?v.toFixed(0):v.toFixed(2); }
// line chart with y-price ticks + x-date labels. points: [[label, value], …]
function chart(points, opts={}){
  if(!points||points.length<2) return '<div class="muted">no data</div>';
  const w=opts.w||660, h=opts.h||230, ml=48, mr=12, mt=10, mb=30;
  const iw=w-ml-mr, ih=h-mt-mb;
  const vals=points.map(p=>p[1]);
  const min=Math.min(...vals), max=Math.max(...vals), span=(max-min)||1;
  const x=i=>ml+(i/(points.length-1))*iw, y=v=>mt+ih-((v-min)/span)*ih;
  const col=opts.color||(vals[vals.length-1]>=vals[0]?'var(--green)':'var(--red)');
  const path=points.map((p,i)=>`${i?'L':'M'}${x(i).toFixed(1)},${y(p[1]).toFixed(1)}`).join(' ');
  let yt='';
  for(let k=0;k<=4;k++){const v=min+span*k/4,yy=y(v);
    yt+=`<line x1="${ml}" y1="${yy.toFixed(1)}" x2="${w-mr}" y2="${yy.toFixed(1)}" stroke="#21262d"/>
      <text x="${ml-6}" y="${(yy+3).toFixed(1)}" fill="var(--muted)" font-size="10" text-anchor="end">${fmtAxis(v)}</text>`;}
  let xt='';const step=Math.max(1,Math.floor((points.length-1)/5));
  for(let i=0;i<points.length;i+=step){xt+=`<text x="${x(i).toFixed(1)}" y="${h-9}" fill="var(--muted)" font-size="10" text-anchor="middle">${points[i][0]}</text>`;}
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" style="display:block">${yt}
    <path d="${path}" fill="none" stroke="${col}" stroke-width="2"/>${xt}
    ${opts.ylabel?`<text x="12" y="${mt+ih/2}" fill="var(--muted)" font-size="10" text-anchor="middle" transform="rotate(-90 12 ${mt+ih/2})">${opts.ylabel}</text>`:''}</svg>`;
}
// seasonality: 12 bars of seasonal index (100 = annual average)
function seasonalChart(seas){
  if(!seas||seas.length<6) return '<div class="muted">not enough history for seasonality</div>';
  const w=660,h=230,ml=40,mr=12,mt=10,mb=26,iw=w-ml-mr,ih=h-mt-mb;
  const idx=seas.map(s=>s[2]??100);
  const min=Math.min(100,...idx), max=Math.max(100,...idx), span=(max-min)||1;
  const y=v=>mt+ih-((v-min)/span)*ih, bw=iw/seas.length*0.7;
  let bars='';
  seas.forEach((s,i)=>{const v=s[2]??100, cx=ml+(i+0.5)*iw/seas.length;
    const top=Math.min(y(v),y(100)), bh=Math.abs(y(v)-y(100));
    const col=v>=100?'var(--green)':'var(--red)';
    bars+=`<rect x="${(cx-bw/2).toFixed(1)}" y="${top.toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(bh,1).toFixed(1)}" fill="${col}" opacity="0.8"/>
      <text x="${cx.toFixed(1)}" y="${h-9}" fill="var(--muted)" font-size="10" text-anchor="middle">${s[0]}</text>`;});
  const y100=y(100);
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" style="display:block">
    <line x1="${ml}" y1="${y100.toFixed(1)}" x2="${w-mr}" y2="${y100.toFixed(1)}" stroke="var(--muted)" stroke-dasharray="3 3"/>
    <text x="${ml-4}" y="${(y100+3).toFixed(1)}" fill="var(--muted)" font-size="10" text-anchor="end">100</text>${bars}</svg>`;
}
function tradeTable(title, rows){
  if(!rows||!rows.length) return '';
  const max=Math.max(...rows.map(r=>r[1]));
  return `<div class="card" style="flex:1;min-width:240px"><div class="name">${title}</div><table style="font-size:13px">`+
    rows.map(([c,p])=>`<tr><td style="border:none;padding:4px 8px 4px 0">${c}</td>
      <td style="border:none;padding:4px 0;width:55%"><div style="background:#21262d;border-radius:3px;height:14px;position:relative">
        <div style="background:var(--accent);height:14px;border-radius:3px;width:${(p/max*100).toFixed(0)}%"></div></div></td>
      <td class="num muted" style="border:none;padding:4px 0 4px 8px">${p}%</td></tr>`).join('')+
    `</table></div>`;
}

// ── Tear sheet — thesis × IV Rank → derivative recommendation rules engine (issue #48) ──
// Fuses the smart-money moat (issue #41) with IV-regime-aware structure selection (issue
// #46), gated by liquidity (issue #37) — the "readable, self-consistent argument" per
// instrument that Education/How_to_Read_a_Tear_Sheet.md + Information_Sheet_Tearsheet.md
// spec as the screener's target output. The thesis gives DIRECTION; IV Rank gives
// STRUCTURE (same split those docs make: "the view sets the delta, IV Rank sets the
// structure"). Direction reuses trendingRegime()'s already-shipped RS %ile 70/30 trend
// proxy (issue #44) — a bullish/bearish call requires an ACTUAL trend, not just a sign
// flip; the noisy 30-70 middle reads as range-bound, same definition already gating Stop
// Dist/Size, so the tear sheet never contradicts the sizing block above it.
const SKEW_RICH=1.15; // 25Δ put/call IV ratio heuristic band for "rich enough to fund a collar" — distinct from SKEW_FLATTEN (1.05, the flattening tell); same heuristic-band posture as skewCell (no skew-history table exists yet, issue #46).
const STRUCTURE_NAMES={long_call:'Long Call', long_put:'Long Put', bull_call_spread:'Bull Call Spread', bear_put_spread:'Bear Put Spread', iron_condor:'Iron Condor', collar:'Collar (protective put + covered call)'};
const fmtMoney=v=>v==null?'–':'$'+fmt(Math.abs(v),2);

// Thesis: the DIRECTION call, from score/momentum. Fail-safe-closed like trendingRegime()
// and optionsChainLiquid() — unknown RS %ile (ticker not ranked in the currently-loaded
// screener universe) never gets an assumed direction, it gets "Unrated".
function tearThesis(r){
  if(r.rs_percentile==null){
    return {dir:null, label:'Unrated', why:['No RS-percentile rank available for this ticker yet — open the Screener tab first so it\'s ranked against the current universe (rs_percentile is computed cross-sectionally, front-end, issue #40).']};
  }
  const why=[];
  let dir;
  if(r.rs_percentile>=70){
    dir='bullish';
    why.push(`RS %ile ${Math.round(r.rs_percentile)} — top-decile momentum trend (Fama-French prior(2,12) skip-month factor, issue #40).`);
  } else if(r.rs_percentile<=30){
    dir='bearish';
    why.push(`RS %ile ${Math.round(r.rs_percentile)} — bottom-decile momentum trend.`);
  } else {
    dir='range';
    why.push(`RS %ile ${Math.round(r.rs_percentile)} — noisy 30-70 middle band, no dominant trend (mean-reverting/range-bound — the same gate Stop Dist/Size use to withhold a stop, issue #44).`);
  }
  if(r.mom_factor!=null) why.push(`Momentum factor (t-12→t-2, skip-month) ${r.mom_factor>=0?'+':''}${fmt(r.mom_factor,1)}%.`);
  if(r.score!=null) why.push(`Magic-Formula score ${fmt(r.score,0)}${r.score_label?' · '+r.score_label:''} (Greenblatt ROIC + EBIT/EV composite).`);
  if(r.avg_upside!=null) why.push(`Valuation-model upside ${r.avg_upside>=0?'+':''}${fmt(r.avg_upside,1)}% (DCF/comps blend, fundamentals.json/model.json).`);
  if(r.combined_signal) why.push(`Valuation-model signal: ${r.combined_signal}.`);
  if(r.smart_money_dir&&r.smart_money_dir!=='neutral'){
    const wantDir=dir==='bullish'?'buy':dir==='bearish'?'sell':null;
    const confirms=wantDir&&r.smart_money_dir===wantDir;
    why.push(`Smart money net ${r.smart_money_dir==='buy'?'buying':'selling'} (score ${r.smart_money_score>0?'+':''}${r.smart_money_score}) — ${wantDir?(confirms?'confirms':'CONTRADICTS'):'a data point on'} the trend read${wantDir?'':' (thesis is range-bound, so this is a crowding note, not a direction check)'}.`);
  }
  const label=dir==='bullish'?'BUY':dir==='bearish'?'SELL':'HOLD';
  return {dir, label, why};
}
// 12-mo target: prefer the Street consensus, else derive from the valuation-model upside
// blend already collected. Null (never fabricated) if neither is available — a rating with
// no target is an opinion, not an argument (Education/How_to_Read_a_Tear_Sheet.md §1).
function tearTarget(r){
  if(r.analyst_mean!=null) return {target:r.analyst_mean, src:'analyst consensus mean (Street convention, ~12-mo)'};
  if(r.avg_upside!=null && r.price!=null) return {target:r.price*(1+r.avg_upside/100), src:'derived from valuation-model upside (DCF/comps blend) — no fixed horizon collected, ~12-mo shown by analyst-target convention'};
  return {target:null, src:null};
}
// Nearest-strike lookup + a contract's mid price (never invented — null when bid/ask both missing).
function nearestContract(contracts,type,target){
  const list=contracts.filter(c=>c.type===type && c.strike!=null);
  if(!list.length) return null;
  return list.reduce((best,c)=>(!best||Math.abs(c.strike-target)<Math.abs(best.strike-target))?c:best,null);
}
function contractMid(c){
  if(!c) return null;
  if(c.bid!=null&&c.ask!=null) return (c.bid+c.ask)/2;
  if(c.last!=null) return c.last;
  return null;
}
// Builds the actual structure from the REAL nearest-expiry chain (real strikes/bid/ask/Greeks) —
// never a hypothetical number. Returns null (rather than guessing) if the needed strikes/prices
// aren't present in the collected chain. Position delta/vega = Σ(direction × contract Greek),
// direction +1 buy / −1 sell — the Greek-bias check below reads off these.
function buildStructure(key, spot, contracts){
  const callAt=t=>nearestContract(contracts,'call',t), putAt=t=>nearestContract(contracts,'put',t);
  const mid=contractMid;
  if(key==='long_call'){
    const c=callAt(spot); if(!c) return null;
    const premium=mid(c); if(premium==null) return null;
    return {name:STRUCTURE_NAMES.long_call, legs:[{action:'Buy',c}],
      maxLoss:premium, maxProfit:Infinity, breakeven:c.strike+premium,
      netCost:premium, delta:c.delta??0, vega:c.vega??0};
  }
  if(key==='long_put'){
    const c=putAt(spot); if(!c) return null;
    const premium=mid(c); if(premium==null) return null;
    return {name:STRUCTURE_NAMES.long_put, legs:[{action:'Buy',c}],
      maxLoss:premium, maxProfit:Math.max(0,c.strike-premium), breakeven:c.strike-premium,
      netCost:premium, delta:c.delta??0, vega:c.vega??0};
  }
  if(key==='bull_call_spread'){
    const lc=callAt(spot); if(!lc) return null;
    const calls=contracts.filter(c=>c.type==='call'&&c.strike>lc.strike).sort((a,b)=>a.strike-b.strike);
    const sc=calls.find(c=>c.strike>=lc.strike*1.05)||calls[calls.length-1];
    if(!sc) return null;
    const lm=mid(lc), sm2=mid(sc); if(lm==null||sm2==null) return null;
    const debit=lm-sm2; if(debit<=0) return null;
    return {name:STRUCTURE_NAMES.bull_call_spread, legs:[{action:'Buy',c:lc},{action:'Sell',c:sc}],
      maxLoss:debit, maxProfit:(sc.strike-lc.strike)-debit, breakeven:lc.strike+debit,
      netCost:debit, delta:(lc.delta??0)-(sc.delta??0), vega:(lc.vega??0)-(sc.vega??0)};
  }
  if(key==='bear_put_spread'){
    const lp=putAt(spot); if(!lp) return null;
    const puts=contracts.filter(c=>c.type==='put'&&c.strike<lp.strike).sort((a,b)=>b.strike-a.strike);
    const sp=puts.find(c=>c.strike<=lp.strike*0.95)||puts[puts.length-1];
    if(!sp) return null;
    const lm=mid(lp), sm2=mid(sp); if(lm==null||sm2==null) return null;
    const debit=lm-sm2; if(debit<=0) return null;
    return {name:STRUCTURE_NAMES.bear_put_spread, legs:[{action:'Buy',c:lp},{action:'Sell',c:sp}],
      maxLoss:debit, maxProfit:(lp.strike-sp.strike)-debit, breakeven:lp.strike-debit,
      netCost:debit, delta:(lp.delta??0)-(sp.delta??0), vega:(lp.vega??0)-(sp.vega??0)};
  }
  if(key==='iron_condor'){
    const sc=callAt(spot*1.05), lc=callAt(spot*1.10), sp=putAt(spot*0.95), lp=putAt(spot*0.90);
    if(!sc||!lc||!sp||!lp) return null;
    const scM=mid(sc), lcM=mid(lc), spM=mid(sp), lpM=mid(lp);
    if([scM,lcM,spM,lpM].some(v=>v==null)) return null;
    const credit=(scM+spM)-(lcM+lpM); if(credit<=0) return null;
    const maxLoss=Math.max(lc.strike-sc.strike, sp.strike-lp.strike)-credit;
    if(maxLoss<=0) return null; // credit ≥ wing width — an internally-inconsistent quote, withhold rather than show a free lunch
    return {name:STRUCTURE_NAMES.iron_condor, legs:[{action:'Sell',c:sc},{action:'Buy',c:lc},{action:'Sell',c:sp},{action:'Buy',c:lp}],
      maxLoss, maxProfit:credit, breakeven:[sp.strike-credit, sc.strike+credit],
      netCost:-credit, delta:-(sc.delta??0)+(lc.delta??0)-(sp.delta??0)+(lp.delta??0), vega:-(sc.vega??0)+(lc.vega??0)-(sp.vega??0)+(lp.vega??0)};
  }
  if(key==='collar'){
    const sc=callAt(spot*1.05), lp=putAt(spot*0.95);
    if(!sc||!lp) return null;
    const scM=mid(sc), lpM=mid(lp); if(scM==null||lpM==null) return null;
    const netCost=lpM-scM; // >0 net debit, <0 net credit — "costless" collars land near 0 (Example 2)
    const collarLoss=(spot-lp.strike)+netCost, collarProfit=(sc.strike-spot)-netCost;
    if(collarLoss<=0||collarProfit<=0) return null; // internally-inconsistent quote, withhold rather than show a free lunch
    return {name:STRUCTURE_NAMES.collar, legs:[{action:'Sell',c:sc},{action:'Buy',c:lp}], isCollar:true,
      maxLoss:collarLoss, maxProfit:collarProfit, breakeven:spot+netCost,
      netCost, delta:1-(sc.delta??0)+(lp.delta??0), vega:-(sc.vega??0)+(lp.vega??0)};
  }
  return null;
}
// The rules engine: thesis × IV Rank → structure. Matches "Summary: matching action to
// signal" (Education/Derivatives_Examples_Gallery.md) and the 4 combos the issue names —
// bullish+low IV -> long call, bullish+high IV -> call spread, hedge+rich skew -> collar,
// range-bound+high IV -> iron condor — extended with the bearish mirror (same table's
// "down/hedge" row) and an explicit "no trade" verdict rather than forcing a structure
// when the edge isn't there (Douglas: don't manufacture a signal that didn't fire).
// Skew-driven collar takes priority over a bullish/range read: rich, chain-liquidity-gated
// put skew is read as "this name is priced for a hedge" regardless of the underlying
// speculative direction (Example 2's WTI collar) — never applied against a bearish thesis,
// where a collar (capped upside) would contradict wanting price to fall.
function chooseStructureKey(thesisDir, ivRank, skew, chainLiquid){
  if(chainLiquid && skew!=null && skew>=SKEW_RICH && thesisDir!=null && thesisDir!=='bearish'){
    return {key:'collar', reason:`Skew ${skew.toFixed(2)} ≥ ${SKEW_RICH} (chain-liquidity-gated) — richly priced downside protection funds a covered call, hedging the ${thesisDir} stance rather than paying full price for a lone directional option.`};
  }
  if(thesisDir==='range'){
    if(ivRank!=null && ivRank>=70) return {key:'iron_condor', reason:`Range-bound (RS %ile mid-band) + IV Rank ${Math.round(ivRank)} (≥70, rich) — sell the overpriced premium, defined risk on both wings (Example 4).`};
    return {key:null, reason:`Range-bound, but IV Rank ${ivRank!=null?Math.round(ivRank):'unavailable'} isn't rich enough to sell premium — no structure forced. Wait for a richer IV read or a directional break.`};
  }
  if(thesisDir==='bullish'){
    if(ivRank!=null && ivRank<=30) return {key:'long_call', reason:`Bullish + IV Rank ${Math.round(ivRank)} (≤30, cheap) — buy the option outright; no need to sell premium to offset cost (Example 5's low-IVR logic, applied directionally).`};
    if(ivRank!=null) return {key:'bull_call_spread', reason:`Bullish + IV Rank ${Math.round(ivRank)} (${ivRank>=70?'≥70, rich':'mid-band'}) — a lone call overpays vega; sell the upper strike to cap cost (Example 1; defined-risk is the default for anyone not running a desk).`};
    return {key:null, reason:'Bullish, but no IV Rank read available (options data unavailable or the ticker is outside the paid-feed universe) — direction only, structure withheld.'};
  }
  if(thesisDir==='bearish'){
    if(ivRank!=null && ivRank<=30) return {key:'long_put', reason:`Bearish + IV Rank ${Math.round(ivRank)} (≤30, cheap) — buy the put outright.`};
    if(ivRank!=null) return {key:'bear_put_spread', reason:`Bearish + IV Rank ${Math.round(ivRank)} (${ivRank>=70?'≥70, rich':'mid-band'}) — sell the lower strike to cap cost (Example 3; defined-risk default).`};
    return {key:null, reason:'Bearish, but no IV Rank read available — direction only, structure withheld.'};
  }
  return {key:null, reason:'No trend read (RS %ile unavailable) — no thesis, so no structure is recommended.'};
}
// Greek-bias coherence check (How to Read a Tear Sheet §7.5): the position's net Greeks
// must agree with the thesis — a "big move" view that's accidentally −vega, or a bullish
// call that's net −delta, contradicts itself. Condor/collar get their own expected sign
// (delta-neutral+short-vol; hedge-muted-delta) instead of the plain direction check.
function greekBiasAgrees(structureKey, thesisDir, delta, vega){
  const d=delta||0, v=vega||0;
  if(structureKey==='iron_condor'){
    return {agrees:v<0, label:`net delta ${d>=0?'+':''}${d.toFixed(2)}, net vega ${v>=0?'+':''}${v.toFixed(2)} — expect ≈flat delta, −vega/+theta (short vol, collects decay).`};
  }
  if(structureKey==='collar'){
    return {agrees:true, label:`net delta ${d.toFixed(2)} (muted long — the stock leg is reduced by the hedge), net vega ${v>=0?'+':''}${v.toFixed(2)} — trades upside for a protected floor, not a directional bet.`};
  }
  const wantPos=thesisDir==='bullish';
  const agrees=wantPos?d>0:d<0;
  return {agrees, label:`net delta ${d>=0?'+':''}${d.toFixed(2)} — ${agrees?'agrees with':'CONTRADICTS'} the ${thesisDir} thesis (expected ${wantPos?'positive':'negative'}).`};
}
// Renders the Derivative recommendation card — degrades in three explicit stages: no
// thesis -> no structure -> no chain data, never silently substituting a guess for a
// withheld number (acceptance: "equity-only sheet still coherent").
function renderRecommendation(thesis, choice, structure, exp, chainLiquid, ivRank){
  const gateNote=`<div class="muted" style="font-size:11px;margin-top:8px">Options-flow legs (skew-driven collar check) are gated on chain liquidity (≥${OPT_LIQ_MIN_OI} OI / ≥${OPT_LIQ_MIN_VOL} vol) — ${chainLiquid?'this chain clears the gate.':'this chain is thin or unmeasured, so the skew/collar check is withheld.'} Liquidity disclosure: dollar volume (Snapshot) proxies only <b>depth</b>, 1 of Harris's 4 dimensions — spread/immediacy/resiliency are not in v1.</div>`;
  if(thesis.dir==null) return `<div class="card" style="max-width:760px"><div class="muted">${choice.reason}</div>${gateNote}</div>`;
  if(!choice.key) return `<div class="card" style="max-width:760px"><div><b>${thesis.label}</b> — no structure recommended.</div><div class="muted" style="margin-top:6px">${choice.reason}</div>${gateNote}</div>`;
  if(!structure) return `<div class="card" style="max-width:760px"><div><b>${thesis.label}</b> → suggested structure: <b>${STRUCTURE_NAMES[choice.key]}</b></div>
    <div class="muted" style="margin-top:6px">${choice.reason}</div>
    <div class="muted" style="margin-top:6px">Strikes/premiums unavailable in the collected chain${exp?` (expiry ${exp})`:''} — numbers withheld rather than guessed.</div>${gateNote}</div>`;
  const bias=greekBiasAgrees(choice.key, thesis.dir, structure.delta, structure.vega);
  const legsHtml=structure.legs.map(l=>`${l.action} ${l.c.type} $${fmt(l.c.strike)}`).join(' · ');
  const breakevenHtml=Array.isArray(structure.breakeven)?`$${fmt(structure.breakeven[0])} / $${fmt(structure.breakeven[1])}`:`$${fmt(structure.breakeven)}`;
  return `<div class="card" style="max-width:760px">
    <div style="margin-bottom:6px"><b>${thesis.label}</b> → <b>${structure.name}</b>${exp?` · ~${exp} expiry`:''}</div>
    <div class="muted" style="font-size:12px;margin-bottom:8px">${legsHtml}</div>
    <table style="font-size:13px"><tbody>
      <tr><td class="muted" style="border:none;padding:3px 12px 3px 0">Max loss <span class="muted" title="Always found first, per the coherence check">(found first)</span></td><td class="num" style="border:none;padding:3px 0">${fmtMoney(structure.maxLoss)}/share</td></tr>
      <tr><td class="muted" style="border:none;padding:3px 12px 3px 0">Max profit</td><td class="num" style="border:none;padding:3px 0">${structure.maxProfit===Infinity?'uncapped':fmtMoney(structure.maxProfit)+'/share'}</td></tr>
      <tr><td class="muted" style="border:none;padding:3px 12px 3px 0">Breakeven</td><td class="num" style="border:none;padding:3px 0">${breakevenHtml}</td></tr>
      <tr><td class="muted" style="border:none;padding:3px 12px 3px 0">Net ${structure.netCost>=0?'debit':'credit'}</td><td class="num" style="border:none;padding:3px 0">${fmtMoney(structure.netCost)}/share</td></tr>
    </tbody></table>
    <div style="margin-top:8px;font-size:12px" class="${bias.agrees?'pos':'neg'}">Greek bias: ${bias.label}</div>
    <div class="muted" style="font-size:11px;margin-top:6px">${choice.reason}</div>
    ${!bias.agrees?`<div class="neg" style="font-size:11px;margin-top:4px">⚠ Greek bias does not agree with the thesis — the sheet contradicts itself here (Education/How_to_Read_a_Tear_Sheet.md coherence check); re-check before acting.</div>`:''}
    ${gateNote}
  </div>`;
}

// ── STOCK DETAIL (click a ticker) ─────────────────────────
// Tear sheet (issue #48) — a readable, self-consistent per-instrument ARGUMENT, not a wall
// of numbers: Header -> Snapshot (+ Valuation/fundamentals) -> Thesis -> Positioning/smart
// money -> Technicals -> Derivative recommendation. Matches the block order + "check the
// argument holds" reading discipline in Education/How_to_Read_a_Tear_Sheet.md and the
// template in Education/Information_Sheet_Tearsheet.md, which the Reading tab (issue #57)
// already documents as the screener's target output. Feed tier: collected (assembles
// collected + ohlcv + paid blocks; degrades gracefully — see the recommendation card —
// when the paid options block is unavailable).
async function openStock(tk){
  TAB='screener';
  const v=document.getElementById('view');
  v.innerHTML=`<div class="loading">Loading ${tk}…</div>`;
  try{
    const s=await jget('/api/stocks/'+tk);
    // rs_percentile is NOT an upstream field (same reason as the screener table, issue #40) —
    // it's a cross-sectional rank over the currently-loaded universe, computed front-end by
    // computeMomentumRanks() during renderScreener()/drawScreener(). Merge it in from the
    // already-ranked screenerRows pool if this ticker is in it; else the thesis engine
    // degrades to "Unrated" (fail-safe-closed, same posture as trendingRegime()).
    const ranked=screenerRows.find(r=>r.ticker===s.ticker);
    if(ranked&&ranked.rs_percentile!=null) s.rs_percentile=ranked.rs_percentile;
    // smart-money moat — composite score + component breakdown (issue #41). Computed on this
    // single row (no cross-row ranking needed, unlike magic_rank) — feeds both the Positioning
    // block below and the thesis engine's confirmation/crowding note.
    computeSmartMoneyScores([s]);
    const thesis=tearThesis(s), tgt=tearTarget(s);

    // ── HEADER — rating + 12-mo target + horizon ─────────────────────────
    const score=s.score_composite, label=s.score_label, stars=s.score_stars;
    const ratingCls=thesis.dir==='bullish'?'pos':thesis.dir==='bearish'?'neg':'muted';
    let html=`<button class="pill" style="cursor:pointer;border:1px solid var(--border)" onclick="renderScreener()">← Screener</button>
      <div style="display:flex;align-items:baseline;gap:12px;margin:12px 0 4px">
        <span class="big" style="font-size:24px">${s.ticker}</span>
        <span class="muted">${s.name||''}</span></div>
      <div class="muted" style="margin-bottom:10px">${s.sector||''} · ${s.industry||''} · ${s.cap_size||''} · rank #${s.rank??'–'}</div>
      <div style="margin-bottom:4px">
        <span class="pill ${ratingCls}" style="font-weight:600">${thesis.label}</span>
        <span class="pill">12-mo target ${tgt.target!=null?'$'+fmt(tgt.target):'–'}</span>
        <span class="pill muted">horizon ~12-mo</span>
      </div>
      <div class="muted" style="font-size:11px;margin-bottom:12px;max-width:760px">${tgt.src?`Target: ${tgt.src}.`:'No price target available (no analyst consensus or valuation-model upside collected) — a rating with no target is an opinion, not an argument.'}</div>
      <div class="tearnote">
        <b>Read this like a desk analyst (60-second scan):</b> rating+target+horizon → IV Rank → max loss → does direction match IV Rank → liquidity ($ vol) → biggest named risk. If those agree, the argument closes (Education/How_to_Read_a_Tear_Sheet.md).
      </div>
      <div style="margin-bottom:14px">
        <span class="pill">$${fmt(s.price)}</span>
        <span class="pill">mkt cap ${s.mkt_cap!=null?'$'+fmt(s.mkt_cap)+'B':'–'}</span>
        ${score!=null?`<span class="pill">score ${fmt(score,0)} ${label?'· '+label:''} ${stars?'· '+'★'.repeat(Math.round(stars)):''}</span>`:'<span class="pill muted">score pending</span>'}
        ${s.avg_upside!=null?`<span class="pill">upside ${pct(s.avg_upside)}</span>`:''}
      </div>`;

    // ── SNAPSHOT — price/cap/52w-range/$vol-gate/beta/realized-vol/ATR ───
    html+=`<div class="group-title">Snapshot</div>`;
    if(s.low52!=null&&s.high52!=null&&s.high52>s.low52){
      const pos=((s.price-s.low52)/(s.high52-s.low52)*100).toFixed(0);
      html+=`<div class="muted" style="font-size:12px">52w range $${fmt(s.low52)} – $${fmt(s.high52)}</div>
        <div class="rangebar" style="max-width:320px;margin:6px 0 14px"><i style="left:${pos}%"></i></div>`;
    }
    {
      const etf=isETF(s), basket=etf?basketDollarVol(s):null, screen=screenDollarVol(s);
      html+=`<div style="margin:0 0 8px">
        <span class="pill">ADV ${s.adv!=null?compact(s.adv):'–'}</span>
        <span class="pill">$ vol ${money(screen)}</span>
        ${etf&&basket!=null?`<span class="pill" title="ETF capacity = Σ constituent $ADV × weight; screen ADV is a floor, never a ceiling">basket liq ${money(basket)}</span>`:''}
        ${etf?'<span class="pill muted" title="ETF gated on basket liquidity, not screen ADV">ETF · basket-gated</span>':''}
        <span class="pill" title="Trailing 60d beta vs. SPY — how hard a market selloff hits you regardless of thesis">Beta ${s.beta!=null?fmt(s.beta,2):'–'}</span>
        <span class="pill" title="30d annualized stdev of daily returns — the yardstick for judging IV richness">Realized vol ${s.realized_vol!=null?fmt(s.realized_vol,1)+'%':'–'}</span>
        <span class="pill" title="14d Average True Range — sets stop distance, sizes the position">ATR ${s.atr!=null?'$'+fmt(s.atr):'–'}${s.atr_pct!=null?` (${fmt(s.atr_pct,2)}%)`:''}</span>
      </div>
      <div class="lqnote" style="max-width:760px">
        <b>Liquidity (v1 = depth only).</b> Dollar volume proxies just <b>1 of Harris's 4 liquidity dimensions — depth</b>. <b>Spread</b> (width), <b>immediacy</b> &amp; <b>resiliency</b> need a paid quote feed and are <b>not in v1</b>.${etf?' This ETF is gated on <b>basket liquidity</b> (underlying holdings), not its screen ADV.':''}
      </div>`;
    }
    // valuation / fundamentals — from fundamentals.json/model.json, part of the Snapshot
    // (How to Read a Tear Sheet §2 lists valuation as a snapshot subsection)
    html+=`<div class="group-title">Valuation / fundamentals</div>`;
    {
      const blocks=[
        ['Valuation',[['P/E',s.pe],['Fwd P/E',s.fwd_pe],['P/B',s.pb],['P/S',s.ps],['EV/EBITDA',s.ev_ebitda],['PEG',s.peg],['Div yield',s.div_yield,'%'],['Beta',s.beta]]],

        ['Growth (CAGR)',[['Rev 5y',s.rev_cagr_5y,'%'],['EPS 5y',s.eps_cagr_5y,'%'],['FCF 5y',s.fcf_cagr_5y,'%'],['Rev 1y',s.rev_cagr_1y,'%'],['EPS ttm',s.eps_ttm],['EPS fwd',s.eps_fwd]]],
        ['Valuation models',[['DCF intrinsic',s.dcf_intrinsic],['DCF upside',s.dcf_upside_pct,'%'],['Comps FV',s.comps_fair_value],['Comps upside',s.comps_upside_pct,'%'],['EPV',s.epv_value],['Graham',s.graham_value],['Signal',s.combined_signal]]],
        ['Analysts',[['Mean tgt',s.analyst_mean],['Low',s.analyst_low],['High',s.analyst_high],['# analysts',s.num_analysts],['1y return',s.ret_1y,'%']]],
      ];
      html+=`<div class="cards" style="grid-template-columns:repeat(auto-fill,minmax(260px,1fr))">`;
      for(const [title,rows] of blocks){
        html+=`<div class="card"><div class="name">${title}</div><table style="font-size:12px">`+
          rows.map(([k,val,suf])=>`<tr><td class="muted" style="border:none;padding:3px 6px 3px 0">${k}</td>
            <td class="num" style="border:none;padding:3px 0">${val==null||val===''?'–':(typeof val==='number'?fmt(val,2):val)}${(val!=null&&suf)?suf:''}</td></tr>`).join('')+

    }

    // ── THESIS — score/momentum synthesis, every claim traces to a snapshot metric ──
    html+=`<div class="group-title">Thesis</div>
      <div class="card" style="max-width:760px;margin-bottom:14px">

        <div class="muted" style="font-size:11px;margin-top:8px">No company-specific, time-bound catalyst is tracked yet — treat the ~12-mo horizon as a valuation-model/analyst convention, not a scheduled event. Being early is being wrong (Education/How_to_Read_a_Tear_Sheet.md §3).</div>
      </div>`;

    // ── POSITIONING / SMART MONEY — congress + insider + UOA (issue #41/#46) ──
    if(s.smart_money_score!=null){
      const b=s.smart_money_breakdown||{};
      const dirCls=s.smart_money_dir==='buy'?'pos':s.smart_money_dir==='sell'?'neg':'muted';
      html+=`<div class="group-title">Positioning / smart money <span class="tier t-oos" title="Not out-of-sample validated yet (walk-forward/CSCV pending)">OOS✗</span></div>
        <div class="card" style="max-width:640px;margin-bottom:14px">

    }

    // ── TECHNICALS — trend/MA, support/resistance, RSI, RS rank ──────────
    {
      const trendLabel=thesis.dir==='bullish'?'Uptrend (trending)':thesis.dir==='bearish'?'Downtrend (trending)':thesis.dir==='range'?'Range-bound / mean-reverting':'Unrated';
      html+=`<div class="group-title">Technicals</div>
        <div class="card" style="max-width:760px;margin-bottom:14px">

function ageStr(iso){
  if(!iso) return '–';
  const d=new Date(iso.length<=10?iso+'T00:00:00':iso), hrs=(Date.now()-d.getTime())/3.6e6;
  const lab= hrs<24?`${hrs.toFixed(0)}h ago` : `${(hrs/24).toFixed(1)}d ago`;
  return `${iso.slice(0,16).replace('T',' ')} <span class="muted">(${lab})</span>`;
}
function covBar(val,total,label){
  const pct=total?Math.min(100,val/total*100):0;
  const col=pct>=90?'var(--green)':pct>=60?'var(--accent)':'var(--red)';
  return `<tr><td style="border:none;padding:4px 8px 4px 0">${label}</td>
    <td style="border:none;padding:4px 0;width:55%"><div style="background:#21262d;border-radius:3px;height:14px">
      <div style="background:${col};height:14px;border-radius:3px;width:${pct.toFixed(0)}%"></div></div></td>
    <td class="num muted" style="border:none;padding:4px 0 4px 8px">${val??'–'}/${total??'–'} (${pct.toFixed(0)}%)</td></tr>`;
}
