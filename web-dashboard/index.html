<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Trader Screener — Dashboard</title>
<style>
  :root{
    --bg:#0d1117; --panel:#161b22; --border:#30363d; --txt:#e6edf3;
    --muted:#8b949e; --accent:#2f81f7; --green:#3fb950; --red:#f85149;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);font:14px/1.4 -apple-system,Segoe UI,Roboto,sans-serif}
  header{display:flex;align-items:center;gap:16px;padding:12px 18px;border-bottom:1px solid var(--border);background:var(--panel);position:sticky;top:0;z-index:10}
  header h1{font-size:16px;margin:0;font-weight:700}
  nav{display:flex;gap:6px}
  nav button{background:transparent;border:1px solid transparent;color:var(--muted);padding:6px 12px;border-radius:6px;cursor:pointer;font-size:13px}
  nav button.active{color:var(--txt);background:#21262d;border-color:var(--border)}
  .api{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
  .api input{background:var(--bg);border:1px solid var(--border);color:var(--txt);border-radius:6px;padding:5px 8px;width:200px}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--red)}
  .dot.ok{background:var(--green)}
  main{padding:18px;max-width:1200px;margin:0 auto}
  .controls{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap}
  input[type=text],select{background:var(--panel);border:1px solid var(--border);color:var(--txt);border-radius:6px;padding:7px 10px}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--border)}
  th{color:var(--muted);font-weight:600;cursor:pointer;user-select:none;position:sticky;top:53px;background:var(--bg)}
  tr:hover td{background:#161b2233}
  td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
  .pos{color:var(--green)} .neg{color:var(--red)}
  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
  .group-title{margin:18px 0 8px;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.5px}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:12px}
  .card .name{font-weight:600;margin-bottom:2px}
  .card .price{font-size:20px;font-variant-numeric:tabular-nums}
  .card .sub{font-size:12px;color:var(--muted);margin-top:4px;display:flex;justify-content:space-between}
  .rangebar{height:5px;background:#21262d;border-radius:3px;margin-top:8px;position:relative}
  .rangebar i{position:absolute;top:-2px;width:9px;height:9px;border-radius:50%;background:var(--accent);transform:translateX(-50%)}
  .muted{color:var(--muted)} .big{font-size:18px;font-weight:600}
  .pill{display:inline-block;padding:2px 8px;border-radius:20px;background:#21262d;font-size:12px;margin-right:6px}
  .loading{color:var(--muted);padding:30px;text-align:center}
  .err{color:var(--red);padding:18px;border:1px solid var(--red);border-radius:8px;background:#f8514911}
  /* feed-tier badges — free (collected/ohlcv) vs paid vs macro */
  .tier{display:inline-block;font-size:9px;line-height:1;padding:2px 5px;border-radius:10px;text-transform:uppercase;letter-spacing:.3px;font-weight:600;vertical-align:middle;border:1px solid transparent}
  .t-collected{color:var(--muted);background:#21262d;border-color:var(--border)}
  .t-ohlcv{color:#58a6ff;background:#388bfd1a;border-color:#1f6feb55}
  .t-paid{color:#e3b341;background:#e3b3411a;border-color:#e3b34155}
  .t-macro{color:#bc8cff;background:#bc8cff1a;border-color:#8957e555}
  /* column picker (show/hide) */
  .colpick{position:relative}
  .colpick>summary{list-style:none;cursor:pointer;background:var(--panel);border:1px solid var(--border);color:var(--txt);border-radius:6px;padding:7px 10px;user-select:none}
  .colpick>summary::-webkit-details-marker{display:none}
  .colmenu{position:absolute;z-index:20;margin-top:4px;background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:6px;min-width:190px;box-shadow:0 6px 18px #0008}
  .colitem{display:flex;align-items:center;gap:6px;padding:4px 6px;border-radius:6px;cursor:pointer;white-space:nowrap}
  .colitem:hover{background:#21262d}
  .colitem .tier{margin-left:auto}
  .t-v1{color:#f0883e;background:#f0883e1a;border-color:#f0883e55}
  .t-oos{color:#f85149;background:#f851491a;border-color:#f8514955}
  /* liquidity disclosure note — makes the un-measured dimensions explicit */
  .lqnote{margin:0 0 14px;padding:9px 12px;border:1px solid var(--border);border-left:3px solid #e3b341;border-radius:6px;background:#e3b3410d;color:var(--muted);font-size:12px;line-height:1.55}
  .lqnote b{color:var(--txt)}
  /* macro regime banner (issue #39) — same note-box language, colored by regime */
  .macronote{margin:0 0 14px;padding:9px 12px;border:1px solid var(--border);border-left:3px solid var(--accent);border-radius:6px;background:#2f81f70d;color:var(--muted);font-size:12px;line-height:1.55}
  .macronote.risk-off{border-left-color:var(--red);background:#f851490d}
  .macronote.risk-on{border-left-color:var(--green);background:#3fb9500d}
  .macronote b{color:var(--txt)}
  /* look-ahead discipline note (issue #42) — same note-box language, neutral accent */
  .lagnote{margin:0 0 14px;padding:9px 12px;border:1px solid var(--border);border-left:3px solid var(--muted);border-radius:6px;background:#8b949e0d;color:var(--muted);font-size:12px;line-height:1.55}
  .lagnote b{color:var(--txt)}
</style>
</head>
<body>
<header>
  <h1 id="brand" style="cursor:pointer" title="Home">📈 Trader Screener</h1>
  <nav id="nav"></nav>
  <div class="api">
    <span class="dot" id="dot"></span> API
    <input id="apiBase" value="http://127.0.0.1:8000" />
  </div>
</header>
<main id="view"><div class="loading">Loading…</div></main>

<script>
const API = () => document.getElementById('apiBase').value.replace(/\/$/,'');
let TAB = 'screener';
// commodity futures symbol -> spelled-out name
const COMMODITY_NAMES = {
  'CL=F':'WTI Crude','BZ=F':'Brent Crude','NG=F':'Natural Gas','RB=F':'Gasoline','HO=F':'Heating Oil',
  'GC=F':'Gold','SI=F':'Silver','PL=F':'Platinum','PA=F':'Palladium','HG=F':'Copper','ALI=F':'Aluminum',
  'ZC=F':'Corn','ZW=F':'Wheat','KE=F':'KC HRW Wheat','RS=F':'Canola','DC=F':'Milk (Class III)',
  'ZS=F':'Soybeans','ZL=F':'Soybean Oil','ZM=F':'Soybean Meal','ZO=F':'Oats','ZR=F':'Rough Rice',
  'KC=F':'Coffee','SB=F':'Sugar','CC=F':'Cocoa','CT=F':'Cotton','OJ=F':'Orange Juice','LBS=F':'Lumber',
  'LE=F':'Live Cattle','GF=F':'Feeder Cattle','HE=F':'Lean Hogs',
};
const nm = r => COMMODITY_NAMES[r] || r;
let screenerRows = [], sortKey = 'rank', sortAsc = true;

async function jget(path){
  const r = await fetch(API()+path);
  if(!r.ok) throw new Error(path+' → '+r.status);
  return r.json();
}
function fmt(v,d=2){ return v==null?'–':Number(v).toLocaleString(undefined,{maximumFractionDigits:d}); }
function pct(v){ if(v==null) return '<span class="muted">–</span>'; const c=v>=0?'pos':'neg'; const s=v>=0?'+':''; return `<span class="${c}">${s}${v.toFixed(2)}%</span>`; }
// compact magnitude (1.2M, 3.4B) for volume / dollar-volume columns
function compact(v){ if(v==null||isNaN(v)) return '–'; const a=Math.abs(v);
  if(a>=1e12) return (v/1e12).toFixed(2)+'T';
  if(a>=1e9)  return (v/1e9).toFixed(2)+'B';
  if(a>=1e6)  return (v/1e6).toFixed(2)+'M';
  if(a>=1e3)  return (v/1e3).toFixed(1)+'K';
  return String(Math.round(v)); }
const money=v=>v==null?'–':'$'+compact(v);

async function ping(){
  try{ const h=await jget('/health'); document.getElementById('dot').classList.toggle('ok',!!h.ok); return h; }
  catch{ document.getElementById('dot').classList.remove('ok'); return null; }
}

// ── SCREENER ──────────────────────────────────────────────
// Feed tiers — how each column's data is sourced. Free = collected/ohlcv;
// paid/macro are visually flagged so free vs paid columns are distinguishable.
const FEED_TIERS={
  collected:{label:'Collected', cls:'t-collected'},
  ohlcv:    {label:'OHLCV',     cls:'t-ohlcv'},
  paid:     {label:'Paid',      cls:'t-paid'},
  macro:    {label:'Macro',     cls:'t-macro'},
};
function dqBadge(r){
  if(r.etf_dq_flag==null) return '<span class="muted">–</span>';
  return r.etf_dq_flag ? '<span class="neg" title="Persistent NAV premium/discount or tracking-difference drift">⚠ flag</span>' : '<span class="pos">ok</span>';
}
// Magic-Formula composite (Greenblatt): rank(ROIC desc) + rank(EBIT/EV desc), ascending = best.
// Summed ordinal ranks, not blended raw values — sidesteps the % vs yield unit mismatch. 2 params (<=5).
// ETFs and rows missing either factor are excluded from ranking (accounting doesn't fit the EBIT/tangible-capital math).
function computeMagicRanks(rows){
  const elig=rows.filter(r=>!isETF(r)&&r.roic!=null&&r.ebit_ev_yield!=null);
  const eligSet=new Set(elig);
  const roicRank=new Map([...elig].sort((a,b)=>b.roic-a.roic).map((r,i)=>[r,i+1]));
  const yieldRank=new Map([...elig].sort((a,b)=>b.ebit_ev_yield-a.ebit_ev_yield).map((r,i)=>[r,i+1]));
  rows.forEach(r=>{ r.magic_rank=eligSet.has(r)?roicRank.get(r)+yieldRank.get(r):null; });
}
// ── Smart-money moat (issue #41) — the differentiator ─────
// Harris: congress trades, insider (EDGAR), committee-conflict, and news sentiment are the
// adverse-selection component of the spread MADE OBSERVABLE — informed order flow. Fold them
// into ONE scored view, not raw event flags — that's the screener's most defensible edge.
// Signed, -100..100: >0 = net informed buying, <0 = net informed selling. Saturating (tanh)
// on the raw disclosure counts so a single cluster of trades can't blow out the scale — the
// signal is direction + rough intensity, not the literal trade count.
// committee_conflict is a CONVICTION MULTIPLIER on the congress leg only (a committee member
// trading their own oversight lane is the single strongest tell), not a separate additive
// term or its own cross-tab column — Backtest Overfitting: reporting the single best
// committee/window combo is just the max of many noisy cross-tabs.
// Douglas: treat every hit as an EDGE (higher probability), not a certainty — expect a random
// win/loss distribution across many such signals. Congress/insider filings are also
// filing-lagged (STOCK Act allows up to ~45 days) — don't overweight a single disclosure.
// NOT out-of-sample validated yet (walk-forward/CSCV pending) — see the `oosPending` column
// flag below; ships hidden-by-default until validated.
function computeSmartMoneyScores(rows){
  rows.forEach(r=>{
    const cBuy=r.congress_buys_90d, cSell=r.congress_sells_90d;
    const iBuy=r.insider_buys_90d, iSell=r.insider_sells_90d;
    const news=r.news_sentiment_30d;
    const hasCongress=cBuy!=null||cSell!=null, hasInsider=iBuy!=null||iSell!=null, hasNews=news!=null;
    if(!hasCongress && !hasInsider && !hasNews){
      r.smart_money_score=null; r.smart_money_dir=null; r.smart_money_breakdown=null; return;
    }
    const congressNet=hasCongress?Math.tanh(((cBuy||0)-(cSell||0))/3):0;
    const insiderNet =hasInsider?Math.tanh(((iBuy||0)-(iSell||0))/3):0;
    const newsSig=hasNews?Math.max(-1,Math.min(1,news)):0;
    const congressWeighted=Math.max(-1,Math.min(1,congressNet*(r.committee_conflict?1.5:1)));
    const composite=0.45*congressWeighted+0.35*insiderNet+0.20*newsSig; // weights sum to 1 → ±100
    r.smart_money_score=Math.round(composite*100);
    r.smart_money_dir=r.smart_money_score>10?'buy':r.smart_money_score<-10?'sell':'neutral';
    r.smart_money_breakdown={
      congress: hasCongress?Math.round(congressWeighted*100):null,
      insider:  hasInsider?Math.round(insiderNet*100):null,
      news:     hasNews?Math.round(newsSig*100):null,
      committee_conflict: !!r.committee_conflict,
    };
  });
}
function smartMoneyCell(r){
  if(r.smart_money_score==null) return '<span class="muted">–</span>';
  const cls=r.smart_money_score>10?'pos':r.smart_money_score<-10?'neg':'muted';
  const b=r.smart_money_breakdown||{};
  const title=`congress ${b.congress??'–'} · insider ${b.insider??'–'} · news ${b.news??'–'}${b.committee_conflict?' · committee-conflict':''}`;
  return `<span class="${cls}" title="${title}">${r.smart_money_score>0?'+':''}${r.smart_money_score}</span>`;
}
// ── Liquidity layer (issue #37) ───────────────────────────
// Tradeability is the FIRST-CLASS gate every surfaced name must pass. Dollar
// volume (ADV × price) is Harris's honest free stand-in for the missing quote
// feed — it proxies ONLY the *depth* dimension of his four (width/spread, depth,
// immediacy, resiliency); the other three need a paid quote feed (see naV1).
// ETF branch: an ETF's real tradeability is its underlying BASKET, not its
// screen ADV (CFA ETF Guide) — screen ADV is a floor, never a ceiling.
let LIQ_FLOOR=0;   // dollar-volume hard floor (0 = off); set by the control below
const isETF=r=>r.is_etf===true||r.instrument_type==='etf'||(r.asset_type||r.quote_type||'').toString().toUpperCase()==='ETF';
// screen (on-exchange) dollar volume for a row: prefer upstream field, else ADV × price
function screenDollarVol(r){
  if(r.dollar_volume!=null) return r.dollar_volume;
  if(r.adv!=null && r.price!=null) return r.adv*r.price;
  return null;
}
// ETF basket (underlying / implied) liquidity: Σ constituent dollar-ADV × weight.
// Prefer an upstream-precomputed field; else derive from already-collected holdings.
function basketDollarVol(r){
  if(r.basket_dollar_volume!=null) return r.basket_dollar_volume;
  if(Array.isArray(r.holdings)){
    let sum=0, any=false;
    for(const h of r.holdings){
      const dv = h.dollar_volume!=null ? h.dollar_volume
               : (h.adv!=null && h.price!=null ? h.adv*h.price : null);
      const w = h.weight!=null ? h.weight : null;
      if(dv!=null && w!=null){ sum+=dv*w; any=true; }
    }
    return any ? sum : null;
  }
  return null;
}
// Effective tradeable dollar volume used by the gate + sort. For ETFs the basket
// is the capacity measure; screen ADV can only RAISE it (a floor), never cap it.
function effDollarVol(r){
  const screen=screenDollarVol(r);
  if(isETF(r)){
    const basket=basketDollarVol(r);
    if(basket!=null) return screen!=null ? Math.max(basket,screen) : basket;
  }
  return screen;
}
// THE hard liquidity gate. Later momentum / value / smart-money views must call
// this so every surfaced name passes the same tradeability floor.
function passesLiquidityFloor(r){
  if(!LIQ_FLOOR) return true;
  if(isETF(r)){
    // ETFs gate on BASKET liquidity; screen ADV is a floor, never a ceiling — so
    // never hard-reject an ETF on its own screen ADV. Unknown basket ⇒ pass.
    const basket=basketDollarVol(r);
    if(basket==null) return true;
    return Math.max(basket, screenDollarVol(r)??0) >= LIQ_FLOOR;
  }
  const liq=screenDollarVol(r);
  return liq!=null && liq>=LIQ_FLOOR;
}
// dollar-volume cell — ETFs show basket liquidity (the real capacity), tagged so
// the screen-ADV rejection is explicitly BLANKED for ETF rows.
function dvolCell(r){
  if(isETF(r)){
    const basket=basketDollarVol(r);
    if(basket!=null) return `${money(basket)} <span class="tier t-ohlcv" title="ETF gated on basket liquidity (Σ constituent $ADV × weight), not screen ADV">basket</span>`;
    return `${money(screenDollarVol(r))} <span class="muted" title="ETF — no basket holdings collected; screen $vol shown but never used to hard-reject an ETF">etf</span>`;
  }
  return money(screenDollarVol(r));
}
// not-in-v1 cell (spread / depth / resiliency — need a paid quote feed)
const naV1=()=>'<span class="muted" title="Order-book liquidity dimension — needs a paid quote feed. Not in v1.">n/a · v1</span>';

// ── Macro / regime layer (issue #39) ──────────────────────────────────────
// Fast, coincident gauge (VIX level + term structure) + slow, leading gauge
// (yield-curve recession probit) — both FRED, both computed client-side from
// raw upstream values (same "raw upstream, derive downstream" split as the
// liquidity layer's effDollarVol()). Regime SOFT-gates default screener
// filters — Chan: regime is a strategy-family switch; Douglas: a VIX spike is
// a non-negotiable de-risk trigger, but here that means a nudged default, not
// a lockout — every nudge stays user-overridable via the existing controls.
const VIX_BUCKETS=[
  {max:15,       key:'calm',     label:'Calm',     color:'var(--green)'},
  {max:20,       key:'normal',   label:'Normal',   color:'var(--accent)'},
  {max:30,       key:'elevated', label:'Elevated', color:'#e3b341'},
  {max:40,       key:'stress',   label:'Stress',   color:'var(--red)'},
  {max:Infinity, key:'panic',    label:'Panic',    color:'#ff6b6b'},
];
// rule-of-thumb bands — Cboe VIX methodology (Education/summaries/cboe-vix-index.md)
function vixBucket(level){
  if(level==null) return null;
  return VIX_BUCKETS.find(b=>level<b.max)||VIX_BUCKETS[VIX_BUCKETS.length-1];
}
// term-structure inversion (VIX/VIX3M ratio) — a stronger crisis tell than level
// alone: >1.0 = inverted/backwardation (near-dated vol pricier), >1.10 = deep dislocation.
function vixInversion(vix,vix3m){
  if(vix==null||vix3m==null||!vix3m) return null;
  const ratio=vix/vix3m;
  return {ratio, inverted:ratio>1.0, deep:ratio>1.10};
}
// standard normal CDF via Abramowitz–Stegun 7.1.26 erf approximation (max err 1.5e-7)
function erf(x){
  const sign=x<0?-1:1; x=Math.abs(x);
  const a1=0.254829592,a2=-0.284496736,a3=1.421413741,a4=-1.453152027,a5=1.061405429,p=0.3275911;
  const t=1/(1+p*x);
  const y=1-(((((a5*t+a4)*t)+a3)*t+a2)*t+a1)*t*Math.exp(-x*x);
  return sign*y;
}
const normCdf=x=>0.5*(1+erf(x/Math.SQRT2));
// Estrella–Mishkin (1998) probit, fit on monthly US data ~1959–1995:
// P(recession in 12m) = Φ(α + β·spread), spread = T10Y3M in percentage points.
// ⚠ constants NOT re-verified against a current NY Fed refit — flagged per issue #39
// acceptance criteria; see Education/summaries/yield-curve-leading-indicator-nyfed.md.
const RECESSION_PROBIT_ALPHA=-0.5333, RECESSION_PROBIT_BETA=-0.6629;
function recessionProb(spreadPct){
  if(spreadPct==null) return null;
  return normCdf(RECESSION_PROBIT_ALPHA+RECESSION_PROBIT_BETA*spreadPct);
}
function recessionBand(p){
  if(p==null) return {label:'–',color:'var(--muted)'};
  if(p<0.30) return {label:'green',color:'var(--green)'};
  if(p<0.50) return {label:'amber',color:'#e3b341'};
  return {label:'red',color:'var(--red)'};
}
let MACRO={loaded:false, vix:null, vix9d:null, vix3m:null, spread:null, spreadMonthly:false, asof:null};
let macroPromise=null;
let regimeDefaultsApplied=false;
let CAP_FLOOR=0; // persisted across screener re-renders, same pattern as LIQ_FLOOR
function regimeVerdict(){
  const vb=vixBucket(MACRO.vix);
  const prob=recessionProb(MACRO.spread);
  const riskOff=(MACRO.vix!=null&&MACRO.vix>30)||(prob!=null&&prob>=0.5);
  return {vixBucket:vb, prob, riskOff, inversion:vixInversion(MACRO.vix,MACRO.vix3m)};
}
// soft pre-set, applied once per session load: risk-off nudges the liquidity + cap
// floor DEFAULTS tighter. Never forced — both stay user-editable selects. "VIX>30
// suppresses new longs" == a tighter default $-volume floor, not a hard block.
function applyRegimeDefaults(){
  if(regimeDefaultsApplied||!MACRO.loaded) return;
  regimeDefaultsApplied=true;
  if(regimeVerdict().riskOff){
    if(!LIQ_FLOOR) LIQ_FLOOR=1000000;
    if(!CAP_FLOOR) CAP_FLOOR=0.2;
  }
}
function loadMacro(){
  if(!macroPromise) macroPromise=(async()=>{
    try{
      const d=await jget('/api/macro');
      MACRO={loaded:true, vix:d.vix??null, vix9d:d.vix9d??null, vix3m:d.vix3m??null,
        spread:(d.t10y3m_monthly??d.t10y3m??null), spreadMonthly:d.t10y3m_monthly!=null,
        asof:d.asof??null};
    }catch{
      MACRO={loaded:false, vix:null, vix9d:null, vix3m:null, spread:null, spreadMonthly:false, asof:null};
    }
    applyRegimeDefaults();
  })();
  return macroPromise;
}
function capFloorLabel(v){ return v>=1?'$'+v+'B':'$'+(v*1000).toFixed(0)+'M'; }
// shared regime banner — used by both the Screener controls and the Macro tab
function regimeBannerHTML(){
  if(!MACRO.loaded) return '';
  const rv=regimeVerdict(), vb=rv.vixBucket, rb=recessionBand(rv.prob);
  const cls=rv.riskOff?'risk-off':'risk-on';
  const vixPill=vb?`<span class="pill" style="border:1px solid ${vb.color};color:${vb.color}">VIX ${fmt(MACRO.vix,1)} · ${vb.label}</span>`:'';
  const recPill=`<span class="pill" style="border:1px solid ${rb.color};color:${rb.color}">P(recession 12m) ${rv.prob!=null?(rv.prob*100).toFixed(0)+'%':'–'}</span>`;
  const invNote=(rv.inversion&&rv.inversion.inverted)?`<span class="pill" style="border:1px solid var(--red);color:var(--red)" title="VIX/VIX3M ratio ${rv.inversion.ratio.toFixed(2)} — near-term vol pricier than 3m; a stronger crisis tell than level alone">term-structure inverted${rv.inversion.deep?' (deep)':''}</span>`:'';
  const defaultsNote=rv.riskOff
    ?`Defaults nudged: $vol floor ≥ $${compact(LIQ_FLOOR)}/day, cap floor ≥ ${capFloorLabel(CAP_FLOOR)} — <b>soft, override any filter above.</b>`
    :'No default-filter changes for this regime.';
  return `<div class="macronote ${cls}">
    <div style="margin-bottom:4px">${vixPill} ${recPill} ${invNote}</div>
    <b>Regime: ${rv.riskOff?'risk-off':'risk-on / normal'}.</b> ${defaultsNote}
    Yield-curve inversion is a <b>12-month leading warning, not a sell trigger</b>.
  </div>`;
}

// ── Momentum layer (issue #40) ────────────────────────────
// Fama-French prior(2,12): momentum = cumulative return t-12→t-2, SKIPPING the
// most recent month (t-1) — that's the actual winner/loser bucketing rule; keeping
// the skip-month contaminates the factor with short-term reversal. return_1/3/6/12m
// and mom_factor are upstream (nightly-OHLCV) fields; RS % is the only thing
// computed here — the cross-sectional percentile rank of mom_factor.
// Look-ahead discipline (issue #42): every OHLCV-derived field here is lagged to
// the prior close upstream (see lookahead-gate/) — this cross-sectional rank is
// recomputed fresh each render from that day's already-lagged mom_factor values,
// never against a fixed/time-pooled distribution (that would smuggle future dates in).
// Harris: momentum is a price-discovery signal that price impact eats without a
// liquidity gate, so the ranking POOL is liquid names only (passesLiquidityFloor),
// same as Fama-French set factor breakpoints from liquid names only — an illiquid
// micro-cap must never warp the percentile cuts for the liquid names around it.
function computeMomentumRanks(rows){
  const elig=rows.filter(r=>r.mom_factor!=null&&passesLiquidityFloor(r));
  const n=elig.length;
  const sorted=[...elig].sort((a,b)=>a.mom_factor-b.mom_factor); // ascending: worst → best
  const pctile=new Map(sorted.map((r,i)=>[r, n>1?i/(n-1)*100:50]));
  rows.forEach(r=>{ r.rs_percentile=pctile.has(r)?pctile.get(r):null; });
}
// RS-percentile cell — color-coded like a return (top-tercile green, bottom-tercile red)
function rsCell(r){
  if(r.rs_percentile==null) return '<span class="muted">–</span>';
  const v=r.rs_percentile, c=v>=70?'pos':v<=30?'neg':'';
  return `<span class="${c}">${Math.round(v)}</span>`;
}
// Central column registry — the ONE place columns are defined. Adding a metric
// = adding one entry here (no <th>/<td> markup edits). Each entry:
//   {key,label,num?,cls?,fmt?,tier}  where
//   key   – field on the /api/stocks row (also the sort key)
//   label – header text
//   num   – right-align + numeric sort/format (default string)
//   cls   – extra <td> class (e.g. 'muted')
//   fmt   – (row)=>cell HTML; defaults to the raw value
//   tier  – feed tier (key of FEED_TIERS) for the badge
//   oosPending – present but NOT out-of-sample validated yet (walk-forward/CSCV pending);
//                hidden by default + flagged, same idea as notInV1 but for backtest-
//                overfitting risk rather than a missing feed (see computeSmartMoneyScores)
const SCREENER_COLS=[
  {key:'rank',   label:'#',        num:true, cls:'muted', tier:'collected', fmt:r=>r.rank??'–'},

  {key:'sector', label:'Sector',            cls:'muted',  tier:'collected', fmt:r=>r.sector||'–'},
  {key:'mkt_cap',label:'Mkt Cap', num:true, cls:'muted',  tier:'collected', fmt:r=>r.mkt_cap!=null?`$${fmt(r.mkt_cap)}B${r.cap_size?` <span class="muted">(${r.cap_size})</span>`:''}`:'–'},
  {key:'price',  label:'Price',    num:true,               tier:'ohlcv',     fmt:r=>r.price!=null?'$'+fmt(r.price):'–'},
  // ── liquidity layer (default columns) — the tradeability gate every view passes
  {key:'adv',           label:'ADV',   num:true,           tier:'ohlcv',     fmt:r=>r.adv!=null?compact(r.adv):'–'},
  {key:'dollar_volume', label:'$ Vol', num:true,           tier:'ohlcv',     sortVal:r=>effDollarVol(r), fmt:r=>dvolCell(r)},
  // ── momentum layer (issue #40) — trailing returns, skip-month factor, RS rank
  {key:'return_1m',  label:'Ret 1M',  num:true,             tier:'ohlcv',     fmt:r=>pct(r.return_1m)},
  {key:'return_3m',  label:'Ret 3M',  num:true,             tier:'ohlcv',     fmt:r=>pct(r.return_3m)},
  {key:'return_6m',  label:'Ret 6M',  num:true,             tier:'ohlcv',     fmt:r=>pct(r.return_6m)},
  {key:'return_12m', label:'Ret 12M', num:true,             tier:'ohlcv',     fmt:r=>pct(r.return_12m)},
  {key:'mom_factor', label:'Momentum', num:true,            tier:'ohlcv',
    tip:'Fama-French prior(2,12): cumulative return t-12→t-2, skipping the most recent month (t-1) to avoid short-term-reversal contamination. Re-ranked monthly.',
    fmt:r=>pct(r.mom_factor)},
  {key:'rs_percentile', label:'RS %ile', num:true,          tier:'ohlcv',
    tip:'Cross-sectional percentile rank of the momentum factor vs. the universe (0=weakest, 100=strongest). Breakpoints computed from liquid names only — illiquid micro-caps never warp the cuts, and no name failing the $ vol floor can surface here.',
    fmt:r=>rsCell(r)},
  {key:'score',  label:'Score',    num:true,               tier:'collected', fmt:r=>fmt(r.score,0)},
  {key:'pe',     label:'P/E',      num:true,               tier:'collected', fmt:r=>isETF(r)?'–':fmt(r.pe,1)},
  {key:'ebit_ev_yield', label:'EBIT/EV', num:true,         tier:'collected', fmt:r=>(isETF(r)||r.ebit_ev_yield==null)?'–':pct(r.ebit_ev_yield)},
  {key:'roic',   label:'ROIC',     num:true,               tier:'collected', fmt:r=>(isETF(r)||r.roic==null)?'–':pct(r.roic)},
  {key:'magic_rank', label:'Magic Rank', num:true,          tier:'collected', fmt:r=>r.magic_rank??'–'},
  {key:'upside', label:'Upside %', num:true,               tier:'collected', fmt:r=>(isETF(r)||r.upside==null)?'–':pct(r.upside)},
  {key:'expense_ratio', label:'Expense', num:true,         tier:'collected', fmt:r=>(isETF(r)&&r.expense_ratio!=null)?pct(r.expense_ratio):'–'},
  {key:'tco',    label:'TCO',      num:true,               tier:'collected', fmt:r=>(isETF(r)&&r.tco!=null)?pct(r.tco):'–'},
  {key:'etf_dq_flag', label:'ETF DQ', cls:'muted',         tier:'collected', fmt:r=>isETF(r)?dqBadge(r):'–'},
  // ── smart-money moat composite (issue #41) — congress + insider + committee-conflict +
  // news sentiment folded into ONE adverse-selection-intensity score (see
  // computeSmartMoneyScores). Reuses the SAME liquidity-gated `rows` pipeline as every other
  // column, so it never surfaces a name below the $ vol floor. oosPending: not out-of-sample
  // validated yet — hidden by default & flagged (Backtest Overfitting caveat).
  {key:'smart_money_score', label:'Smart $', num:true,     tier:'collected', oosPending:true, fmt:r=>smartMoneyCell(r)},

  // depth. Default hidden; discoverable & flagged in the column picker.
  {key:'spread',     label:'Spread',     num:true,         tier:'paid', notInV1:true, fmt:naV1},
  {key:'depth',      label:'Depth',      num:true,         tier:'paid', notInV1:true, fmt:naV1},
  {key:'resiliency', label:'Resiliency', num:true,         tier:'paid', notInV1:true, fmt:naV1},
];
// per-column visibility (column picker) — all shown except not-in-v1 / not-yet-validated columns.
const colVisible=Object.fromEntries(SCREENER_COLS.map(c=>[c.key,!c.notInV1 && !c.oosPending]));
const tierBadge=t=>{const m=FEED_TIERS[t];return `<span class="tier ${m?m.cls:''}">${m?m.label:t}</span>`;};
// pre-rank filters (Greenblatt universe hygiene) — NOT columns; remove rows before ranking/display.
function isExcludedSector(r,flags){
  const sec=(r.sector||'').toLowerCase();
  if(flags.fin && sec.includes('financ')) return true;
  if(flags.util && sec.includes('util')) return true;
  if(flags.adr && (r.is_adr===true || /\bADR\b/i.test(r.name||''))) return true;
  return false;
}
const v1Badge=c=>c.notInV1?'<span class="tier t-v1" title="not in v1 — needs a paid quote feed">v1✗</span>':'';
const oosBadge=c=>c.oosPending?'<span class="tier t-oos" title="Not out-of-sample validated yet (walk-forward/CSCV pending) — opt-in, not a default column">OOS✗</span>':'';

function renderColMenu(){
  const m=document.getElementById('colmenu'); if(!m) return;
  m.innerHTML=SCREENER_COLS.map(c=>

function toggleCol(k,on){ colVisible[k]=on; drawScreener(); }
function drawScreener(){
  const q=(document.getElementById('q').value||'').toLowerCase();
  const sec=document.getElementById('sector').value;
  const capFloor=CAP_FLOOR;
  const exclFlags={fin:document.getElementById('exclFin').checked,util:document.getElementById('exclUtil').checked,adr:document.getElementById('exclAdr').checked};
  // pre-rank filters (not columns) — apply before ranking so excluded names never enter the composite
  const universe=screenerRows.filter(r=>
    (!capFloor || (r.mkt_cap!=null && r.mkt_cap>=capFloor)) &&
    !isExcludedSector(r,exclFlags));
  computeMagicRanks(universe);
  computeSmartMoneyScores(universe);
  computeMomentumRanks(universe);
  const searched=universe.filter(r=>
    (!sec||r.sector===sec) &&
    (!q || (r.ticker||'').toLowerCase().includes(q) || (r.name||'').toLowerCase().includes(q)));
  // hard liquidity gate — ETF rows judged on basket liquidity, not screen ADV
  let rows=searched.filter(passesLiquidityFloor);
  const gated=searched.length-rows.length;
  const scol=SCREENER_COLS.find(c=>c.key===sortKey);
  rows.sort((a,b)=>{ let x=scol&&scol.sortVal?scol.sortVal(a):a[sortKey], y=scol&&scol.sortVal?scol.sortVal(b):b[sortKey];
    if(x==null)return 1; if(y==null)return -1;
    if(typeof x==='string')return sortAsc?x.localeCompare(y):y.localeCompare(x);
    return sortAsc?x-y:y-x; });
  document.getElementById('count').textContent=
    `${rows.length} stocks`+(LIQ_FLOOR?` · ${gated} below $${compact(LIQ_FLOOR)}/day $vol floor`:'');
  const cols=SCREENER_COLS.filter(c=>colVisible[c.key]);
  const th=cols.map(c=>{
    const arrow=sortKey===c.key?(sortAsc?' ▲':' ▼'):'';
    const title=(c.tip?c.tip+' · ':`${c.label} · `)+`${FEED_TIERS[c.tier]?FEED_TIERS[c.tier].label:c.tier} feed`;
    return `<th class="${c.num?'num':''}" onclick="setSort('${c.key}')" title="${title}">${c.label}${arrow} ${tierBadge(c.tier)}${v1Badge(c)}${oosBadge(c)}</th>`;
  }).join('');
  const body=rows.slice(0,300).map(r=>`<tr style="cursor:pointer" onclick="openStock('${r.ticker}')" title="Open ${r.ticker} detail">`+
    cols.map(c=>`<td class="${c.num?'num':''}${c.cls?' '+c.cls:''}">${c.fmt?c.fmt(r):(r[c.key]??'–')}</td>`).join('')+
    `</tr>`).join('');
  document.getElementById('tbl').innerHTML=`<table><thead><tr>${th}</tr></thead><tbody>${body}</tbody></table>`;
}
function setSort(k){ if(sortKey===k)sortAsc=!sortAsc; else{sortKey=k;sortAsc=true;} drawScreener(); }

// line chart with y-price ticks + x-date labels. points: [[label, value], …]
function chart(points, opts={}){
  if(!points||points.length<2) return '<div class="muted">no data</div>';
  const w=opts.w||660, h=opts.h||230, ml=48, mr=12, mt=10, mb=30;
  const iw=w-ml-mr, ih=h-mt-mb;
  const vals=points.map(p=>p[1]);
  const min=Math.min(...vals), max=Math.max(...vals), span=(max-min)||1;
  const x=i=>ml+(i/(points.length-1))*iw, y=v=>mt+ih-((v-min)/span)*ih;
  const col=opts.color||(vals[vals.length-1]>=vals[0]?'var(--green)':'var(--red)');
  const path=points.map((p,i)=>`${i?'L':'M'}${x(i).toFixed(1)},${y(p[1]).toFixed(1)}`).join(' ');
  let yt='';
  for(let k=0;k<=4;k++){const v=min+span*k/4,yy=y(v);
    yt+=`<line x1="${ml}" y1="${yy.toFixed(1)}" x2="${w-mr}" y2="${yy.toFixed(1)}" stroke="#21262d"/>
      <text x="${ml-6}" y="${(yy+3).toFixed(1)}" fill="var(--muted)" font-size="10" text-anchor="end">${fmtAxis(v)}</text>`;}
  let xt='';const step=Math.max(1,Math.floor((points.length-1)/5));
  for(let i=0;i<points.length;i+=step){xt+=`<text x="${x(i).toFixed(1)}" y="${h-9}" fill="var(--muted)" font-size="10" text-anchor="middle">${points[i][0]}</text>`;}
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" style="display:block">${yt}
    <path d="${path}" fill="none" stroke="${col}" stroke-width="2"/>${xt}
    ${opts.ylabel?`<text x="12" y="${mt+ih/2}" fill="var(--muted)" font-size="10" text-anchor="middle" transform="rotate(-90 12 ${mt+ih/2})">${opts.ylabel}</text>`:''}</svg>`;
}
// seasonality: 12 bars of seasonal index (100 = annual average)
function seasonalChart(seas){
  if(!seas||seas.length<6) return '<div class="muted">not enough history for seasonality</div>';
  const w=660,h=230,ml=40,mr=12,mt=10,mb=26,iw=w-ml-mr,ih=h-mt-mb;
  const idx=seas.map(s=>s[2]??100);
  const min=Math.min(100,...idx), max=Math.max(100,...idx), span=(max-min)||1;
  const y=v=>mt+ih-((v-min)/span)*ih, bw=iw/seas.length*0.7;
  let bars='';
  seas.forEach((s,i)=>{const v=s[2]??100, cx=ml+(i+0.5)*iw/seas.length;
    const top=Math.min(y(v),y(100)), bh=Math.abs(y(v)-y(100));
    const col=v>=100?'var(--green)':'var(--red)';
    bars+=`<rect x="${(cx-bw/2).toFixed(1)}" y="${top.toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(bh,1).toFixed(1)}" fill="${col}" opacity="0.8"/>
      <text x="${cx.toFixed(1)}" y="${h-9}" fill="var(--muted)" font-size="10" text-anchor="middle">${s[0]}</text>`;});
  const y100=y(100);
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" style="display:block">
    <line x1="${ml}" y1="${y100.toFixed(1)}" x2="${w-mr}" y2="${y100.toFixed(1)}" stroke="var(--muted)" stroke-dasharray="3 3"/>
    <text x="${ml-4}" y="${(y100+3).toFixed(1)}" fill="var(--muted)" font-size="10" text-anchor="end">100</text>${bars}</svg>`;
}
function tradeTable(title, rows){
  if(!rows||!rows.length) return '';
  const max=Math.max(...rows.map(r=>r[1]));
  return `<div class="card" style="flex:1;min-width:240px"><div class="name">${title}</div><table style="font-size:13px">`+
    rows.map(([c,p])=>`<tr><td style="border:none;padding:4px 8px 4px 0">${c}</td>
      <td style="border:none;padding:4px 0;width:55%"><div style="background:#21262d;border-radius:3px;height:14px;position:relative">
        <div style="background:var(--accent);height:14px;border-radius:3px;width:${(p/max*100).toFixed(0)}%"></div></div></td>
      <td class="num muted" style="border:none;padding:4px 0 4px 8px">${p}%</td></tr>`).join('')+
    `</table></div>`;
}

function exposureHTML(d){
  let html='';

    html+=`<div class="group-title">Commodity drivers — curated</div><table>
      <thead><tr><th>Commodity</th><th>Role</th><th>Effect of price ↑</th><th>Why</th></tr></thead><tbody>`;

    html+=`<div class="group-title">Commodity drivers — computed (1y return regression)</div><table>
      <thead><tr><th>Commodity</th><th class="num">Beta</th><th class="num">Corr</th><th class="num">R²</th></tr></thead><tbody>`;

          const col=k.startsWith('High')?'pos':k.startsWith('Low')?'neg':'';
          return `<tr><td class="${col}" style="border:none;padding:4px 16px 4px 0">${k}</td><td class="num" style="border:none;padding:4px 0">${val}</td></tr>`;
        }).join('')||'<tr><td class="muted">n/a</td></tr>'}</table></div>
      <div class="card" style="flex:1;min-width:260px"><div class="name">Valuation-model completeness</div>
        <table style="font-size:13px">
          ${covBar(mc.dcf,mc.total,'DCF')}
          ${covBar(mc.comps,mc.total,'Comps')}
          ${covBar(mc.m3,mc.total,'EPV/Graham')}
          ${covBar(mc.all3,mc.total,'All three')}
        </table></div></div>`;
    // commodities gaps
    html+=`<div class="group-title">Commodities — fetch completeness</div>
      <div class="card">
        <span class="pill">${cm.fetched??'–'}/${cm.expected??'–'} fetched</span>
        ${(cm.missing&&cm.missing.length)?`<span class="pill neg">${cm.missing.length} missing</span>`:'<span class="pill pos">all fetched</span>'}
        ${(cm.missing&&cm.missing.length)?`<div class="muted" style="margin-top:8px">missing: ${cm.missing.map(x=>x.name+' ('+x.root+')').join(', ')}</div>`:''}
      </div>`;
    v.innerHTML=html;
  }catch(e){ v.innerHTML=`<div class="err">${e.message}<br>API unreachable at ${API()} — set the base above.</div>`; }
}

    ['Volatility — sizing, stops &amp; regime (issue #50)', [
      {metric:'ATR / ATR% (Average True Range)', feedTier:'ohlcv', multiSource:true,
        sources:['QuantInsti — Risk Management','Chan — Quantitative Trading','Harris — Trading &amp; Exchanges','How to Read a Tear Sheet','Information Sheet / Tearsheet'],
        significance:'The <b>load-bearing volatility input</b>: ATR is the typical daily dollar move, so it sets stop distance and therefore all position sizing downstream. A stop too tight relative to ATR gets hit by normal noise; ATR tells the position how much room it needs to breathe and <b>keeps dollar-risk constant across names</b>. Size by volatility — a high-ATR name gets fewer shares. Lag it like any signal.',

      {metric:'Realized / historical volatility (rVol)', feedTier:'ohlcv', multiSource:true,
        sources:['Harris — Trading &amp; Exchanges','Bailey et al. — Backtest Overfitting','How to Read a Tear Sheet','Information Sheet / Tearsheet','OIC — IV Rank / IV Percentile','CME Intro to Futures'],
        significance:'How much the name actually moves (annualized stdev of returns) — the <b>baseline for risk</b> and the yardstick you compare implied vol against. High rVol means wider stops, smaller size, and pricier options. It encodes the fundamental-vs-transitory split, so use it as a <b>regime/sizing input, not a standalone stock picker</b>. On futures, compute on a roll-adjusted series so roll gaps aren’t counted as volatility.',

        significance:'Tells you how much the name amplifies the market — high beta means the P/L is really a <b>leveraged index bet</b>, and in a selloff beta drives your loss regardless of the single-name thesis. Use it to size and for regime/low-vol tilts (favor low-beta quantiles), not as a standalone signal. Under a risk-off macro regime the default screen should <b>bias away from high-beta names</b>.',

      {metric:'IV / IV-rank (the §2h mirror in volatility)', feedTier:'paid', multiSource:true,

    ['Price & momentum (issue #49)', [
      {metric:'Momentum factor (prior 2–12 month return, skip-most-recent-month)', feedTier:'ohlcv', multiSource:true,

        significance:'The core academic momentum signal: cumulate the return from 12 months ago to 2 months ago and <b>skip the most recent month</b>, then percentile-rank each name against the universe — that rank <b>is</b> the winner/loser bucketing. Skipping the last month matters: including it <b>contaminates momentum with short-term reversal</b>. Trade it as a <b>cross-sectional rank, re-ranked monthly</b>, and never surface a name that fails the liquidity floor — price impact eats the edge otherwise. It is a price-discovery signal (informed flow drags price toward value), but it is only <b>tradeable, not a certainty</b>.',
        exampleSignal:'ret_2_12_rank >= 80 (skip t-1) AND dollar_vol > $20M AND price > 200DMA -> momentum long candidate'},
      {metric:'Relative strength (RS) rank vs universe', feedTier:'ohlcv', multiSource:true,

        sources:['Fama-French','Harris — Trading &amp; Exchanges','CME Intro to Futures','Bailey et al. — Backtest Overfitting'],
        significance:'Standardized trailing-return windows feed the momentum/RS rank and give the tear sheet its “has this moved” context. The <b>12-month window (minus the skip month)</b> is the momentum input. On futures, compute on a <b>back-adjusted or return-spliced series</b> — naively stitched prices inject phantom roll gaps that fake momentum and breakouts.',
        exampleSignal:'ret_12m top-decile AND ret_1m NOT top-decile (avoid reversal) -> momentum-confirmed'},
      {metric:'Moving-average cross (50/200-day) / trend arrow', feedTier:'ohlcv', multiSource:true,
        sources:['How to Read a Tear Sheet','Information Sheet / Tearsheet','Chan — Quantitative Trading','CME Intro to Futures'],
        significance:'Defines the prevailing trend — price above a rising 50/200DMA is an uptrend; a 200-day break is a checkable bearish confirmation. Technicals rarely make the thesis, they <b>time it</b>: “cheap in a downtrend stays cheap.” The trend flag also gates whether <b>ATR stops are even valid</b> (stops help only in trending regimes). Compute on data up to the prior close only, and on futures choose the continuous-series construction deliberately — back-adjusting corrupts absolute MA levels.',

        significance:'A trend-following momentum cross. Same discipline as RSI: it is a <b>selection-biased signal if tuned over many parameter sets</b>, so gate it out-of-sample and log the trial count before defaulting on it, and lag it to the prior close so you don’t inject look-ahead. On futures, compute on the correctly constructed continuous series.',

      {metric:'VWAP', feedTier:'paid', multiSource:false,

        exampleSignal:'fill_price vs VWAP -> effective-cost estimate (paid/intraday only, not in v1)'},
    ]],
    ['Risk & sizing (issue #55)', [
      {metric:'Fixed-fractional sizing (ATR stop, 1–2% risk)', feedTier:'ohlcv', multiSource:true,
        sources:['QuantInsti — Risk Management','Harris — Trading &amp; Exchanges','CME Intro to Futures'],
        significance:'The core sizing rule that turns a screen hit into an executable, pre-sized trade plan: risk 1–2% of equity per trade and size backwards from an ATR stop — shares = (equity × risk%) / (k × ATR), stop = entry − k × ATR. This allocates <b>equal RISK (not equal dollars)</b> per name; wider stop means fewer shares. At 2% risk you can absorb <b>~50 consecutive losses</b> before ruin. Surface size, stop, and drawdown as default columns.',
        exampleSignal:'shares = (equity * 0.02) / (2*ATR); stop = price - 2*ATR -> pre-sized plan surfaced on each row'},
      {metric:'Kelly sizing (f = m/σ², half-Kelly, Sharpe/DD/MAR gates)', feedTier:'ohlcv', multiSource:true,
        sources:['Chan — Quantitative Trading','Harris — Trading &amp; Exchanges','Bailey et al. — Backtest Overfitting'],
        significance:'Kelly f = m/σ² (via ATR as the vol proxy) sets an optimal fraction, but use <b>HALF-Kelly</b>, further capped by the worst-historical-loss rule because Gaussian Kelly underestimates tail risk (the S&amp;P’s worst day was -20.5%). Attach Sharpe + max drawdown + MAR to the equity curve before trusting any ranking, and require backtest Sharpe <b>≥1 over ≥681 daily points</b>. ATR stops only in a trending regime — never on mean-reverting names, where a stop just realizes the loss.',
        exampleSignal:'size = min(half-Kelly f, worst-loss-cap); require backtest Sharpe >= 1 over >= 681 days before trusting rank'},
      {metric:'Stop distance (ATR multiple) gated on trend/regime', feedTier:'ohlcv', multiSource:true,
        sources:['QuantInsti — Risk Management','Chan — Quantitative Trading','Harris — Trading &amp; Exchanges','How to Read a Tear Sheet'],
        significance:'Express stops as a volatility unit — stop = entry − k×ATR — so share count auto-scales to each name’s noise and the stop isn’t an arbitrary round number. Critical caveat: stops only help in <b>trending/momentum regimes</b>; on mean-reverting names a stop realizes the catastrophic loss rather than avoiding it, so gate ATR stops on the 50/200DMA trend confirmation. News-driven moves are momentum (don’t stand in front of the train); newsless liquidity events mean-revert.',
        exampleSignal:'stop = price - 2*ATR ONLY IF trend_up (price>200DMA); mean-revert name -> no ATR stop'},
      {metric:'Max drawdown (historical)', feedTier:'ohlcv', multiSource:true,
        sources:['Chan — Quantitative Trading','QuantInsti — Risk Management','Douglas — Trading in the Zone','Bailey et al. — Backtest Overfitting','Information Sheet / Tearsheet'],
        significance:'The honest worst-case that must be pre-accepted up front and cross-checked against the per-trade risk % (the 2%→~50-losses-to-ruin gauge). It’s a sample-level input judged over a series of trades, not reacted to after one loss — max drawdown = <b>peak-to-subsequent-trough</b> (time order matters). Flag drawdowns deeper than ~10% or longer than ~4 months. Display it <b>deflated for search effort</b> with its trial-count N, never as a raw optimized figure.',
        exampleSignal:'max_drawdown > 10% OR dd_duration > 4mo -> risk red flag; show deflated with N_trials'},
      {metric:'Sharpe / MAR gate (with trial-count N)', feedTier:'ohlcv', multiSource:true,
        sources:['Chan — Quantitative Trading','Bailey et al. — Backtest Overfitting'],
        significance:'Rank on survivability, not raw return: a strategy with Sharpe below 1 is not suitable stand-alone, and a Sharpe without its trial count N is <b>uninterpretable</b> (strong evidence after 2 trials, pure luck after 1,000). Publish N and the deflated Sharpe (probability true Sharpe is positive) next to every performance figure, deflate for skew/kurtosis too, and demand a track record ≥ the minimum backtest length before trusting a factor.',
        exampleSignal:'show Sharpe only WITH N_trials and deflated_Sharpe (DSR = P(true Sharpe>0)); require Sharpe>=1 over>=681 pts'},
      {metric:'Behavioral pre-commitment layer', feedTier:'ohlcv', multiSource:true,
        sources:['Douglas — Trading in the Zone','QuantInsti — Risk Management'],
        significance:'The sizing outputs are pre-commitments to be obeyed <b>AFTER a drawdown</b> — predefine and fully accept the risk before entry, then don’t widen the stop or double up to ‘make it back.’ The concrete feature is a per-trade rule-adherence log (realized vs suggested size = discipline drift) plus a drawdown cool-down flag, and keeping the truths/principles visible as a checklist. This is <b>behavior/usage policy, not a new metric column</b>.',
        exampleSignal:'log(realized_size vs suggested_size) -> discipline-drift flag; after losing streak -> cool-down flag'},
    ]],
    ['Macro / regime (issue #54)', [

    ['Reading the tear sheet (issue #57)', [

        sources:['How to Read a Tear Sheet','Information Sheet / Tearsheet'],

        significance:'The OHLCV-derived risk snapshot: average daily <b>dollar</b> volume is the hard liquidity gate (a $2M/day name is unexploitable), beta tells you how hard a market selloff hits you regardless of thesis, realized vol is the yardstick for judging IV richness, and ATR sizes the stop so dollar-risk is constant across names. Together they turn a row into a sized, tradeable plan.',

        sources:['Information Sheet / Tearsheet','How to Read a Tear Sheet','Metrics Field Guide'],
        significance:'Technicals time the thesis rather than make it: trend vs rising 50/200DMA (a 200-day break is bearish confirmation), support/resistance set where stops and targets — and therefore option strikes — go, and RSI / RS rank confirm the move has fuel and leadership. “Cheap in a downtrend stays cheap,” so don’t fight the trend. OHLCV-derived.',

        significance:'The volatility block that sets the <b>structure</b>: IV Rank is the load-bearing number (view sets delta/direction, IV Rank sets structure), skew shows which tail is bid and which strikes are richest to sell, and term-structure backwardation warns of near-term event risk. IV richness is judged relative to the name’s <b>own</b> realized vol, not an absolute level. Paid options feed.',
        exampleSignal:'IV_rank sets structure (high->sell/spread, low->buy); skew picks strikes; backwardation warns event risk'},
      {metric:'Derivative recommendation (rules engine) — the firm-grade output', feedTier:'collected', multiSource:true,
        sources:['Metrics Field Guide','How to Read a Tear Sheet','Information Sheet / Tearsheet','Derivatives — Types &amp; Signals'],
        significance:'The conclusion of the argument: a rules engine maps thesis (score/momentum) × IV Rank → a specific structure, with strikes, expiry, net cost, max profit/loss, breakeven, Greek bias and a payoff chart. Always find max loss <b>first</b> (defined vs undefined) and default to defined-risk. The coherence test: does the structure profit in the thesis’s scenario, survive the named risk, and fit today’s volatility? A screener that emits a readable, self-consistent per-instrument <b>argument</b> — not just numbers — is the firm-grade product, and the decision recipe <b>is</b> the recommendation engine.',

    ['Options / derivatives (issue #56)', [

        significance:'A <b>whole second data dimension</b> with no equivalent in plain equity screening, and a real ongoing cost — IV, IV-Rank, skew, OI, Greeks and UOA all need a paid options-chain feed (Polygon / ORATS / Tradier / CBOE); free yfinance won’t cover them reliably. Decide instrument coverage before building, and <b>gate options signals on adequate OI/volume</b> since thin chains give unreliable readings.',
        exampleSignal:'require paid options feed AND per-strike OI/volume adequate before computing any §2h column'},
      {metric:'IV Rank + IV Percentile (must-have normalizer)', feedTier:'paid', multiSource:true,
        sources:['IV Rank / IV Percentile (OIC)','Derivatives — Types &amp; Signals','How to Read a Tear Sheet','Information Sheet / Tearsheet'],
        significance:'<b>THE pivot metric</b> of the whole options view: raw IV is meaningless across names (a biotech’s 60% vs a utility’s 18%), so IVR = (IV − 52wk-low)/(52wk-high − low)×100 and IVP = % of past-year days IV closed below today normalize it to “is vol expensive FOR THIS name right now?” — which flips the structure. High rank (&gt;~70) = premium-selling (spreads, condors, covered calls); low (&lt;~30) = premium-buying (long calls/puts, straddles). Ship <b>BOTH</b> (IVR is fragile to one spike; IVP is more robust). Start the nightly IV snapshot now — IVP needs ~3-6 months, true IVR ~1 year; flag “warming up” until then.',

      {metric:'Skew (25Δ put/call IV ratio)', feedTier:'paid', multiSource:true,
        sources:['IV Rank / IV Percentile (OIC)','Derivatives — Types &amp; Signals','How to Read a Tear Sheet','Information Sheet / Tearsheet','Cboe VIX Index'],
        significance:'IV differs across strikes; equities skew negative by default (structural since the 1987 crash), so the presence of put-side skew is <b>NOT</b> the signal — a <b>FLATTENING skew is the notable event</b>, and a steepening put skew signals rising crash-pricing / defensive demand. Skew ratio = 25Δ put IV ÷ 25Δ call IV (&gt;1 confirms put-side fear) and hints which strikes are richest to sell. Rich call-side skew on a commodity can make a producer collar nearly costless.',
        exampleSignal:'skew_ratio flattening from elevated -> notable signal; rich put skew -> sell put-side / build collar'},
      {metric:'Put/Call ratio (contrarian sentiment)', feedTier:'paid', multiSource:true,
        sources:['IV Rank / IV Percentile (OIC)','Derivatives — Types &amp; Signals','Douglas — Trading in the Zone','Information Sheet / Tearsheet','How to Read a Tear Sheet'],
        significance:'Put volume ÷ call volume — a <b>contrarian sentiment gauge read only at extremes</b> (highs ~&gt;1.2 = capitulation/fear, potential bullish reversal; lows = complacency). It feeds the smart-money view as a sentiment overlay, but an extreme raises the <b>odds</b> of a reversal, it does not remove the randomness of any single trade — don’t treat it as a guaranteed reversal.',
        exampleSignal:'put_call_ratio > 1.2 (capitulation) AND smart-money confirmation -> contrarian long candidate'},
      {metric:'Open interest by strike', feedTier:'paid', multiSource:true,
        sources:['Derivatives — Types &amp; Signals','CME Intro to Futures'],
        significance:'Total outstanding contracts at a strike/expiry. <b>Large-OI strikes act as support/resistance magnets</b> via dealer hedging; rising OI + rising price = conviction, falling OI = positions closing. On futures OI is the second liquidity dimension and its drain from the front month is the <b>roll signal</b>.',
        exampleSignal:'large OI at strike K near spot -> price magnet / support-resistance for strike selection'},
      {metric:'Term structure (VIX vs VIX3M) / contango-backwardation', feedTier:'paid', multiSource:true,
        sources:['IV Rank / IV Percentile (OIC)','Cboe VIX Index','Derivatives — Types &amp; Signals','CME Intro to Futures','Information Sheet / Tearsheet'],
        significance:'IV plotted across expiries: <b>contango</b> (far &gt; near, ~85% of the time) is calm; <b>backwardation</b> (near &gt; far) signals acute near-term event risk or stress. VIX vs VIX3M is a cheap free proxy without a per-name chain, and curve inversion is a <b>more reliable crisis tell than VIX level alone</b>. On futures the curve defines roll yield (backwardation → positive roll, contango → negative).',
        exampleSignal:'VIX/VIX3M > 1.0 (backwardation) -> near-term stress flag; contango -> calm regime'},
      {metric:'The Greeks (Delta / Gamma / Theta / Vega / Rho)', feedTier:'paid', multiSource:true,
        sources:['Derivatives — Types &amp; Signals','How to Read a Tear Sheet','Information Sheet / Tearsheet'],
        significance:'Delta = directional exposure / hedge ratio; Gamma = delta acceleration and dealer-hedging flow; Theta = time decay (seller tailwind, buyer drag); Vega = IV-change exposure; Rho = rate sensitivity (minor short-dated). A <b>per-position risk dashboard</b> rather than a cross-sectional screen column. The Greek bias must <b>agree with the thesis</b> — a “big move” view that is accidentally −vega is self-contradictory.',
        exampleSignal:'long-straddle -> +vega/−theta must match \'big move\' thesis; mismatch -> wrong structure'},
      {metric:'Payoff / structure suggestion (Greek + IVR filter → rules engine)', feedTier:'paid', multiSource:true,
        sources:['Information Sheet / Tearsheet','How to Read a Tear Sheet','Derivatives — Types &amp; Signals','IV Rank / IV Percentile (OIC)'],
        significance:'<b>The differentiator</b>: let users filter by Greek exposure + IV Rank, then have a small principled rules engine suggest the structure — the “matching action to signal” table. The thesis gives <b>direction</b> (delta); IV Rank gives <b>structure</b>. Always find max loss first and default to defined-risk. Keep the rule set small to avoid overfitting the illustrative examples.',
        exampleSignal:'bullish AND IV_rank<30 -> long call; bullish AND IV_rank>70 -> bull call spread; range-bound AND IV_rank>70 -> iron condor'},
    ]],
  ];
  const tierColor={ohlcv:'var(--green)',collected:'var(--accent)',macro:'#a371f7',paid:'var(--red)'};
  let html=`<div style="margin:6px 0 4px"><span class="big" style="font-size:22px">Learning the business of trading</span></div>
    <div class="muted" style="margin-bottom:6px;max-width:760px">Every metric the screener computes, grouped by section. Each card: why it matters &amp; how to trade off it, the sources that back it (an <b>overlap</b> pill means 2+ sources agree), and a concrete example signal in the shortlist&rsquo;s proposed column variables (most not yet in the live screener).</div>
    <div style="margin-bottom:6px">
      <span class="pill" style="border:1px solid ${tierColor.ohlcv}">ohlcv free</span>
      <span class="pill" style="border:1px solid ${tierColor.collected}">collected free</span>
      <span class="pill" style="border:1px solid ${tierColor.macro}">macro (FRED)</span>
      <span class="pill" style="border:1px solid ${tierColor.paid}">paid feed</span>
    </div>`;
  for(const [grp,items] of GROUPS){
    html+=`<div class="group-title">${grp}</div><div class="cards" style="grid-template-columns:repeat(auto-fill,minmax(340px,1fr))">`;
    html+=items.map(it=>{
      const tc=tierColor[it.feedTier]||'var(--border)';
      const overlap=it.multiSource?`<span class="pill" style="border:1px solid var(--accent);color:var(--accent)">overlap ×${it.sources.length}</span>`:'';
      const srcPills=it.sources.map(s=>`<span class="pill" style="font-size:11px">${s}</span>`).join('');
      return `<div class="card" style="padding:14px">
        <div style="display:flex;align-items:baseline;justify-content:space-between;gap:8px">
          <div class="name">${it.metric}</div>
          <span class="pill" style="border:1px solid ${tc};color:${tc};font-size:11px;white-space:nowrap">${it.feedTier}</span>
        </div>
        <div class="muted" style="font-size:12.5px;line-height:1.5;margin:8px 0 10px">${it.significance}</div>
        <div style="margin-bottom:8px">${overlap}${srcPills}</div>
        <div class="muted" style="font-size:11px;text-transform:uppercase;letter-spacing:.5px;margin-bottom:3px">Example signal</div>
        <code style="display:block;background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:8px 10px;font-size:12px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:var(--txt);white-space:pre-wrap;word-break:break-word">${it.exampleSignal}</code>
      </div>`;
    }).join('');
    html+='</div>';
  }
  v.innerHTML=html;
}

// ── workspaces / routing ──────────────────────────────────
const SECTIONS={
  data:  {label:'Data',  icon:'🗄️', desc:'Data integrity — freshness, coverage, quality, gaps',
          tabs:[['integrity','Integrity',renderData]]},
  trader:{label:'Trader',icon:'📊', desc:'Commodities, options, commodity drivers',
          tabs:[['commodities','Commodities',renderCommodities],['options','Options',renderOptions],['drivers','Drivers',renderDrivers]]},
  stock: {label:'Stock', icon:'🏢', desc:'Equity screener + per-stock detail + smart-money moat',
          tabs:[['screener','Screener',renderScreener],['smartmoney','Smart Money',renderSmartMoney]]},
  macro: {label:'Macro', icon:'🌡️', desc:'VIX regime + yield-curve recession probability — soft-gates the screener defaults',
          tabs:[['regime','Regime',renderMacro]]},
  education:{label:'Education', icon:'🎓', desc:'Learning the business of trading — metric significance, source overlap, example signals',
          tabs:[['learn','Learn',renderEducation]]},
};
let SECTION=null;
function renderNav(){
  const nav=document.getElementById('nav');
  if(!SECTION){ nav.innerHTML=''; return; }
  nav.innerHTML=`<button onclick="goHome()">← Home</button>`+
    SECTIONS[SECTION].tabs.map(([id,label])=>
      `<button class="${TAB===id?'active':''}" onclick="goTab('${id}')">${label}</button>`).join('');
}
function goHome(){ SECTION=null; TAB=null; renderNav(); renderHome(); }
function goSection(id){ SECTION=id; const t=SECTIONS[id].tabs[0]; TAB=t[0]; renderNav(); t[2](); }
function goTab(id){ TAB=id; renderNav(); const t=SECTIONS[SECTION].tabs.find(x=>x[0]===id); if(t) t[2](); }
function renderHome(){
  const v=document.getElementById('view');
  v.innerHTML=`<div style="text-align:center;margin:34px 0 22px">
      <div class="big" style="font-size:28px">Trader Screener</div>
      <div class="muted">pick a workspace</div></div>
    <div class="cards" style="grid-template-columns:repeat(auto-fit,minmax(220px,1fr));max-width:780px;margin:0 auto">
      ${Object.entries(SECTIONS).map(([id,s])=>`
        <div class="card" style="cursor:pointer;text-align:center;padding:30px 18px" onclick="goSection('${id}')">
          <div style="font-size:40px;line-height:1">${s.icon}</div>
          <div class="big" style="margin:10px 0 6px">${s.label}</div>
          <div class="muted" style="font-size:13px">${s.desc}</div></div>`).join('')}
    </div>`;
}
document.getElementById('brand').onclick=goHome;
document.getElementById('apiBase').onchange=()=>{ ping(); if(SECTION&&TAB) goTab(TAB); else renderHome(); };
ping(); goHome();
setInterval(ping, 30000);
</script>
