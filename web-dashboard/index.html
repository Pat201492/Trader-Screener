<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Trader Screener — Dashboard</title>
<style>
  :root{
    --bg:#0d1117; --panel:#161b22; --border:#30363d; --txt:#e6edf3;
    --muted:#8b949e; --accent:#2f81f7; --green:#3fb950; --red:#f85149;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);font:14px/1.4 -apple-system,Segoe UI,Roboto,sans-serif}
  header{display:flex;align-items:center;gap:16px;padding:12px 18px;border-bottom:1px solid var(--border);background:var(--panel);position:sticky;top:0;z-index:10}
  header h1{font-size:16px;margin:0;font-weight:700}
  nav{display:flex;gap:6px}
  nav button{background:transparent;border:1px solid transparent;color:var(--muted);padding:6px 12px;border-radius:6px;cursor:pointer;font-size:13px}
  nav button.active{color:var(--txt);background:#21262d;border-color:var(--border)}
  .api{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
  .api input{background:var(--bg);border:1px solid var(--border);color:var(--txt);border-radius:6px;padding:5px 8px;width:200px}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--red)}
  .dot.ok{background:var(--green)}
  main{padding:18px;max-width:1200px;margin:0 auto}
  .controls{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap}
  input[type=text],select{background:var(--panel);border:1px solid var(--border);color:var(--txt);border-radius:6px;padding:7px 10px}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--border)}
  th{color:var(--muted);font-weight:600;cursor:pointer;user-select:none;position:sticky;top:53px;background:var(--bg)}
  tr:hover td{background:#161b2233}
  td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
  .pos{color:var(--green)} .neg{color:var(--red)}
  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
  .group-title{margin:18px 0 8px;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.5px}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:12px}
  .card .name{font-weight:600;margin-bottom:2px}
  .card .price{font-size:20px;font-variant-numeric:tabular-nums}
  .card .sub{font-size:12px;color:var(--muted);margin-top:4px;display:flex;justify-content:space-between}
  .rangebar{height:5px;background:#21262d;border-radius:3px;margin-top:8px;position:relative}
  .rangebar i{position:absolute;top:-2px;width:9px;height:9px;border-radius:50%;background:var(--accent);transform:translateX(-50%)}
  .muted{color:var(--muted)} .big{font-size:18px;font-weight:600}
  .pill{display:inline-block;padding:2px 8px;border-radius:20px;background:#21262d;font-size:12px;margin-right:6px}
  .loading{color:var(--muted);padding:30px;text-align:center}
  .err{color:var(--red);padding:18px;border:1px solid var(--red);border-radius:8px;background:#f8514911}
  /* feed-tier badges — free (collected/ohlcv) vs paid vs macro */
  .tier{display:inline-block;font-size:9px;line-height:1;padding:2px 5px;border-radius:10px;text-transform:uppercase;letter-spacing:.3px;font-weight:600;vertical-align:middle;border:1px solid transparent}
  .t-collected{color:var(--muted);background:#21262d;border-color:var(--border)}
  .t-ohlcv{color:#58a6ff;background:#388bfd1a;border-color:#1f6feb55}
  .t-paid{color:#e3b341;background:#e3b3411a;border-color:#e3b34155}
  .t-macro{color:#bc8cff;background:#bc8cff1a;border-color:#8957e555}
  /* column picker (show/hide) */
  .colpick{position:relative}
  .colpick>summary{list-style:none;cursor:pointer;background:var(--panel);border:1px solid var(--border);color:var(--txt);border-radius:6px;padding:7px 10px;user-select:none}
  .colpick>summary::-webkit-details-marker{display:none}
  .colmenu{position:absolute;z-index:20;margin-top:4px;background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:6px;min-width:190px;box-shadow:0 6px 18px #0008}
  .colitem{display:flex;align-items:center;gap:6px;padding:4px 6px;border-radius:6px;cursor:pointer;white-space:nowrap}
  .colitem:hover{background:#21262d}
  .colitem .tier{margin-left:auto}
  .t-v1{color:#f0883e;background:#f0883e1a;border-color:#f0883e55}
  /* liquidity disclosure note — makes the un-measured dimensions explicit */
  .lqnote{margin:0 0 14px;padding:9px 12px;border:1px solid var(--border);border-left:3px solid #e3b341;border-radius:6px;background:#e3b3410d;color:var(--muted);font-size:12px;line-height:1.55}
  .lqnote b{color:var(--txt)}
</style>
</head>
<body>
<header>
  <h1 id="brand" style="cursor:pointer" title="Home">📈 Trader Screener</h1>
  <nav id="nav"></nav>
  <div class="api">
    <span class="dot" id="dot"></span> API
    <input id="apiBase" value="http://127.0.0.1:8000" />
  </div>
</header>
<main id="view"><div class="loading">Loading…</div></main>

<script>
const API = () => document.getElementById('apiBase').value.replace(/\/$/,'');
let TAB = 'screener';
// commodity futures symbol -> spelled-out name
const COMMODITY_NAMES = {
  'CL=F':'WTI Crude','BZ=F':'Brent Crude','NG=F':'Natural Gas','RB=F':'Gasoline','HO=F':'Heating Oil',
  'GC=F':'Gold','SI=F':'Silver','PL=F':'Platinum','PA=F':'Palladium','HG=F':'Copper','ALI=F':'Aluminum',
  'ZC=F':'Corn','ZW=F':'Wheat','KE=F':'KC HRW Wheat','RS=F':'Canola','DC=F':'Milk (Class III)',
  'ZS=F':'Soybeans','ZL=F':'Soybean Oil','ZM=F':'Soybean Meal','ZO=F':'Oats','ZR=F':'Rough Rice',
  'KC=F':'Coffee','SB=F':'Sugar','CC=F':'Cocoa','CT=F':'Cotton','OJ=F':'Orange Juice','LBS=F':'Lumber',
  'LE=F':'Live Cattle','GF=F':'Feeder Cattle','HE=F':'Lean Hogs',
};
const nm = r => COMMODITY_NAMES[r] || r;
let screenerRows = [], sortKey = 'rank', sortAsc = true;

async function jget(path){
  const r = await fetch(API()+path);
  if(!r.ok) throw new Error(path+' → '+r.status);
  return r.json();
}
function fmt(v,d=2){ return v==null?'–':Number(v).toLocaleString(undefined,{maximumFractionDigits:d}); }
function pct(v){ if(v==null) return '<span class="muted">–</span>'; const c=v>=0?'pos':'neg'; const s=v>=0?'+':''; return `<span class="${c}">${s}${v.toFixed(2)}%</span>`; }
// compact magnitude (1.2M, 3.4B) for volume / dollar-volume columns
function compact(v){ if(v==null||isNaN(v)) return '–'; const a=Math.abs(v);
  if(a>=1e12) return (v/1e12).toFixed(2)+'T';
  if(a>=1e9)  return (v/1e9).toFixed(2)+'B';
  if(a>=1e6)  return (v/1e6).toFixed(2)+'M';
  if(a>=1e3)  return (v/1e3).toFixed(1)+'K';
  return String(Math.round(v)); }
const money=v=>v==null?'–':'$'+compact(v);

async function ping(){
  try{ const h=await jget('/health'); document.getElementById('dot').classList.toggle('ok',!!h.ok); return h; }
  catch{ document.getElementById('dot').classList.remove('ok'); return null; }
}

// ── SCREENER ──────────────────────────────────────────────
// Feed tiers — how each column's data is sourced. Free = collected/ohlcv;
// paid/macro are visually flagged so free vs paid columns are distinguishable.
const FEED_TIERS={
  collected:{label:'Collected', cls:'t-collected'},
  ohlcv:    {label:'OHLCV',     cls:'t-ohlcv'},
  paid:     {label:'Paid',      cls:'t-paid'},
  macro:    {label:'Macro',     cls:'t-macro'},
};
function dqBadge(r){
  if(r.etf_dq_flag==null) return '<span class="muted">–</span>';
  return r.etf_dq_flag ? '<span class="neg" title="Persistent NAV premium/discount or tracking-difference drift">⚠ flag</span>' : '<span class="pos">ok</span>';
}
// Magic-Formula composite (Greenblatt): rank(ROIC desc) + rank(EBIT/EV desc), ascending = best.
// Summed ordinal ranks, not blended raw values — sidesteps the % vs yield unit mismatch. 2 params (<=5).
// ETFs and rows missing either factor are excluded from ranking (accounting doesn't fit the EBIT/tangible-capital math).
function computeMagicRanks(rows){
  const elig=rows.filter(r=>!isETF(r)&&r.roic!=null&&r.ebit_ev_yield!=null);
  const eligSet=new Set(elig);
  const roicRank=new Map([...elig].sort((a,b)=>b.roic-a.roic).map((r,i)=>[r,i+1]));
  const yieldRank=new Map([...elig].sort((a,b)=>b.ebit_ev_yield-a.ebit_ev_yield).map((r,i)=>[r,i+1]));
  rows.forEach(r=>{ r.magic_rank=eligSet.has(r)?roicRank.get(r)+yieldRank.get(r):null; });
}
// ── Liquidity layer (issue #37) ───────────────────────────
// Tradeability is the FIRST-CLASS gate every surfaced name must pass. Dollar
// volume (ADV × price) is Harris's honest free stand-in for the missing quote
// feed — it proxies ONLY the *depth* dimension of his four (width/spread, depth,
// immediacy, resiliency); the other three need a paid quote feed (see naV1).
// ETF branch: an ETF's real tradeability is its underlying BASKET, not its
// screen ADV (CFA ETF Guide) — screen ADV is a floor, never a ceiling.
let LIQ_FLOOR=0;   // dollar-volume hard floor (0 = off); set by the control below
const isETF=r=>r.is_etf===true||r.instrument_type==='etf'||(r.asset_type||r.quote_type||'').toString().toUpperCase()==='ETF';
// screen (on-exchange) dollar volume for a row: prefer upstream field, else ADV × price
function screenDollarVol(r){
  if(r.dollar_volume!=null) return r.dollar_volume;
  if(r.adv!=null && r.price!=null) return r.adv*r.price;
  return null;
}
// ETF basket (underlying / implied) liquidity: Σ constituent dollar-ADV × weight.
// Prefer an upstream-precomputed field; else derive from already-collected holdings.
function basketDollarVol(r){
  if(r.basket_dollar_volume!=null) return r.basket_dollar_volume;
  if(Array.isArray(r.holdings)){
    let sum=0, any=false;
    for(const h of r.holdings){
      const dv = h.dollar_volume!=null ? h.dollar_volume
               : (h.adv!=null && h.price!=null ? h.adv*h.price : null);
      const w = h.weight!=null ? h.weight : null;
      if(dv!=null && w!=null){ sum+=dv*w; any=true; }
    }
    return any ? sum : null;
  }
  return null;
}
// Effective tradeable dollar volume used by the gate + sort. For ETFs the basket
// is the capacity measure; screen ADV can only RAISE it (a floor), never cap it.
function effDollarVol(r){
  const screen=screenDollarVol(r);
  if(isETF(r)){
    const basket=basketDollarVol(r);
    if(basket!=null) return screen!=null ? Math.max(basket,screen) : basket;
  }
  return screen;
}
// THE hard liquidity gate. Later momentum / value / smart-money views must call
// this so every surfaced name passes the same tradeability floor.
function passesLiquidityFloor(r){
  if(!LIQ_FLOOR) return true;
  if(isETF(r)){
    // ETFs gate on BASKET liquidity; screen ADV is a floor, never a ceiling — so
    // never hard-reject an ETF on its own screen ADV. Unknown basket ⇒ pass.
    const basket=basketDollarVol(r);
    if(basket==null) return true;
    return Math.max(basket, screenDollarVol(r)??0) >= LIQ_FLOOR;
  }
  const liq=screenDollarVol(r);
  return liq!=null && liq>=LIQ_FLOOR;
}
// dollar-volume cell — ETFs show basket liquidity (the real capacity), tagged so
// the screen-ADV rejection is explicitly BLANKED for ETF rows.
function dvolCell(r){
  if(isETF(r)){
    const basket=basketDollarVol(r);
    if(basket!=null) return `${money(basket)} <span class="tier t-ohlcv" title="ETF gated on basket liquidity (Σ constituent $ADV × weight), not screen ADV">basket</span>`;
    return `${money(screenDollarVol(r))} <span class="muted" title="ETF — no basket holdings collected; screen $vol shown but never used to hard-reject an ETF">etf</span>`;
  }
  return money(screenDollarVol(r));
}
// not-in-v1 cell (spread / depth / resiliency — need a paid quote feed)
const naV1=()=>'<span class="muted" title="Order-book liquidity dimension — needs a paid quote feed. Not in v1.">n/a · v1</span>';
// Central column registry — the ONE place columns are defined. Adding a metric
// = adding one entry here (no <th>/<td> markup edits). Each entry:
//   {key,label,num?,cls?,fmt?,tier}  where
//   key   – field on the /api/stocks row (also the sort key)
//   label – header text
//   num   – right-align + numeric sort/format (default string)
//   cls   – extra <td> class (e.g. 'muted')
//   fmt   – (row)=>cell HTML; defaults to the raw value
//   tier  – feed tier (key of FEED_TIERS) for the badge
const SCREENER_COLS=[
  {key:'rank',   label:'#',        num:true, cls:'muted', tier:'collected', fmt:r=>r.rank??'–'},
  {key:'ticker', label:'Ticker',                          tier:'collected', fmt:r=>`<b style="color:var(--accent)">${r.ticker}</b>`},
  {key:'name',   label:'Name',              cls:'muted',  tier:'collected', fmt:r=>(r.name||'').slice(0,38)},
  {key:'sector', label:'Sector',            cls:'muted',  tier:'collected', fmt:r=>r.sector||'–'},
  {key:'mkt_cap',label:'Mkt Cap', num:true, cls:'muted',  tier:'collected', fmt:r=>r.mkt_cap!=null?`$${fmt(r.mkt_cap)}B${r.cap_size?` <span class="muted">(${r.cap_size})</span>`:''}`:'–'},
  {key:'price',  label:'Price',    num:true,               tier:'ohlcv',     fmt:r=>r.price!=null?'$'+fmt(r.price):'–'},
  // ── liquidity layer (default columns) — the tradeability gate every view passes
  {key:'adv',           label:'ADV',   num:true,           tier:'ohlcv',     fmt:r=>r.adv!=null?compact(r.adv):'–'},
  {key:'dollar_volume', label:'$ Vol', num:true,           tier:'ohlcv',     sortVal:r=>effDollarVol(r), fmt:r=>dvolCell(r)},
  {key:'score',  label:'Score',    num:true,               tier:'collected', fmt:r=>fmt(r.score,0)},
  {key:'pe',     label:'P/E',      num:true,               tier:'collected', fmt:r=>isETF(r)?'–':fmt(r.pe,1)},
  {key:'ebit_ev_yield', label:'EBIT/EV', num:true,         tier:'collected', fmt:r=>(isETF(r)||r.ebit_ev_yield==null)?'–':pct(r.ebit_ev_yield)},
  {key:'roic',   label:'ROIC',     num:true,               tier:'collected', fmt:r=>(isETF(r)||r.roic==null)?'–':pct(r.roic)},
  {key:'magic_rank', label:'Magic Rank', num:true,          tier:'collected', fmt:r=>r.magic_rank??'–'},
  {key:'upside', label:'Upside %', num:true,               tier:'collected', fmt:r=>(isETF(r)||r.upside==null)?'–':pct(r.upside)},
  {key:'expense_ratio', label:'Expense', num:true,         tier:'collected', fmt:r=>(isETF(r)&&r.expense_ratio!=null)?pct(r.expense_ratio):'–'},
  {key:'tco',    label:'TCO',      num:true,               tier:'collected', fmt:r=>(isETF(r)&&r.tco!=null)?pct(r.tco):'–'},
  {key:'etf_dq_flag', label:'ETF DQ', cls:'muted',         tier:'collected', fmt:r=>isETF(r)?dqBadge(r):'–'},
  // ── un-measured liquidity dimensions — PRESENT but explicitly NOT in v1 (need a
  // paid quote feed). Harris's width(spread)/immediacy/resiliency + true order-book
  // depth. Default hidden; discoverable & flagged in the column picker.
  {key:'spread',     label:'Spread',     num:true,         tier:'paid', notInV1:true, fmt:naV1},
  {key:'depth',      label:'Depth',      num:true,         tier:'paid', notInV1:true, fmt:naV1},
  {key:'resiliency', label:'Resiliency', num:true,         tier:'paid', notInV1:true, fmt:naV1},
];
// per-column visibility (column picker) — all shown except not-in-v1 columns.
const colVisible=Object.fromEntries(SCREENER_COLS.map(c=>[c.key,!c.notInV1]));
const tierBadge=t=>{const m=FEED_TIERS[t];return `<span class="tier ${m?m.cls:''}">${m?m.label:t}</span>`;};
// pre-rank filters (Greenblatt universe hygiene) — NOT columns; remove rows before ranking/display.
function isExcludedSector(r,flags){
  const sec=(r.sector||'').toLowerCase();
  if(flags.fin && sec.includes('financ')) return true;
  if(flags.util && sec.includes('util')) return true;
  if(flags.adr && (r.is_adr===true || /\bADR\b/i.test(r.name||''))) return true;
  return false;
}
const v1Badge=c=>c.notInV1?'<span class="tier t-v1" title="not in v1 — needs a paid quote feed">v1✗</span>':'';

async function renderScreener(){
  const v=document.getElementById('view');
  v.innerHTML=`<div class="controls">
    <input type="text" id="q" placeholder="Search ticker / name…" />
    <select id="sector"><option value="">All sectors</option></select>
    <select id="capFloor" title="Greenblatt cap-floor pre-rank filter">
      <option value="0">Cap floor: none</option>
      <option value="0.05">Cap floor: $50M+</option>
      <option value="0.2">Cap floor: $200M+</option>
      <option value="1">Cap floor: $1B+</option>
    </select>
    <label class="colitem" style="display:inline-flex;border:1px solid var(--border);border-radius:6px"><input type="checkbox" id="exclFin"> Excl. financials</label>
    <label class="colitem" style="display:inline-flex;border:1px solid var(--border);border-radius:6px"><input type="checkbox" id="exclUtil"> Excl. utilities</label>
    <label class="colitem" style="display:inline-flex;border:1px solid var(--border);border-radius:6px"><input type="checkbox" id="exclAdr"> Excl. ADRs</label>
    <select id="dvolFloor" title="Hard liquidity gate — hide names below this daily dollar-volume floor (ETFs judged on basket liquidity)">
      <option value="0">$ vol floor: any</option>
      <option value="100000">≥ $100K/day</option>
      <option value="1000000">≥ $1M/day</option>
      <option value="5000000">≥ $5M/day</option>
      <option value="20000000">≥ $20M/day</option>
      <option value="100000000">≥ $100M/day</option>
    </select>
    <details class="colpick"><summary>Columns ▾</summary><div class="colmenu" id="colmenu"></div></details>
    <span class="muted" id="count"></span></div>
    <div class="lqnote">
      <b>Liquidity = the first-class gate.</b> Dollar volume (ADV × price) is a free stand-in for a quote feed, proxying only <b>1 of Harris's 4 liquidity dimensions — depth</b>. Spread (width), immediacy &amp; resiliency need a paid quote feed → <b>not in v1</b> (see the flagged columns). <b>ETFs</b> gate on <b>basket liquidity</b> (Σ constituent $ADV × weight), not screen ADV — a low-volume ETF on a liquid basket is not rejected.
    </div>
    <div id="tbl"><div class="loading">Loading stocks…</div></div>`;
  try{
    const d=await jget('/api/stocks?limit=1000');
    screenerRows=d.stocks;
    const secs=[...new Set(screenerRows.map(r=>r.sector).filter(Boolean))].sort();
    const sel=document.getElementById('sector');
    secs.forEach(s=>{const o=document.createElement('option');o.value=o.textContent=s;sel.appendChild(o);});
    document.getElementById('q').oninput=drawScreener;
    sel.onchange=drawScreener;
    document.getElementById('capFloor').onchange=drawScreener;
    document.getElementById('exclFin').onchange=drawScreener;
    document.getElementById('exclUtil').onchange=drawScreener;
    document.getElementById('exclAdr').onchange=drawScreener;
    const df=document.getElementById('dvolFloor');
    df.value=String(LIQ_FLOOR);
    df.onchange=()=>{ LIQ_FLOOR=Number(df.value)||0; drawScreener(); };
    renderColMenu();
    drawScreener();
  }catch(e){ v.querySelector('#tbl').innerHTML=`<div class="err">${e.message}<br>Is the API running? (uvicorn api:app)</div>`; }
}
// column-picker menu — one checkbox per registered column, tagged with its tier.
function renderColMenu(){
  const m=document.getElementById('colmenu'); if(!m) return;
  m.innerHTML=SCREENER_COLS.map(c=>
    `<label class="colitem"><input type="checkbox" ${colVisible[c.key]?'checked':''} onchange="toggleCol('${c.key}',this.checked)"> ${c.label} ${tierBadge(c.tier)}${v1Badge(c)}</label>`).join('');
}
function toggleCol(k,on){ colVisible[k]=on; drawScreener(); }
function drawScreener(){
  const q=(document.getElementById('q').value||'').toLowerCase();
  const sec=document.getElementById('sector').value;
  const capFloor=Number(document.getElementById('capFloor').value||0);
  const exclFlags={fin:document.getElementById('exclFin').checked,util:document.getElementById('exclUtil').checked,adr:document.getElementById('exclAdr').checked};
  // pre-rank filters (not columns) — apply before ranking so excluded names never enter the composite
  const universe=screenerRows.filter(r=>
    (!capFloor || (r.mkt_cap!=null && r.mkt_cap>=capFloor)) &&
    !isExcludedSector(r,exclFlags));
  computeMagicRanks(universe);
  const searched=universe.filter(r=>
    (!sec||r.sector===sec) &&
    (!q || (r.ticker||'').toLowerCase().includes(q) || (r.name||'').toLowerCase().includes(q)));
  // hard liquidity gate — ETF rows judged on basket liquidity, not screen ADV
  let rows=searched.filter(passesLiquidityFloor);
  const gated=searched.length-rows.length;
  const scol=SCREENER_COLS.find(c=>c.key===sortKey);
  rows.sort((a,b)=>{ let x=scol&&scol.sortVal?scol.sortVal(a):a[sortKey], y=scol&&scol.sortVal?scol.sortVal(b):b[sortKey];
    if(x==null)return 1; if(y==null)return -1;
    if(typeof x==='string')return sortAsc?x.localeCompare(y):y.localeCompare(x);
    return sortAsc?x-y:y-x; });
  document.getElementById('count').textContent=
    `${rows.length} stocks`+(LIQ_FLOOR?` · ${gated} below $${compact(LIQ_FLOOR)}/day $vol floor`:'');
  const cols=SCREENER_COLS.filter(c=>colVisible[c.key]);
  const th=cols.map(c=>{
    const arrow=sortKey===c.key?(sortAsc?' ▲':' ▼'):'';
    return `<th class="${c.num?'num':''}" onclick="setSort('${c.key}')" title="${c.label} · ${FEED_TIERS[c.tier]?FEED_TIERS[c.tier].label:c.tier} feed">${c.label}${arrow} ${tierBadge(c.tier)}${v1Badge(c)}</th>`;
  }).join('');
  const body=rows.slice(0,300).map(r=>`<tr style="cursor:pointer" onclick="openStock('${r.ticker}')" title="Open ${r.ticker} detail">`+
    cols.map(c=>`<td class="${c.num?'num':''}${c.cls?' '+c.cls:''}">${c.fmt?c.fmt(r):(r[c.key]??'–')}</td>`).join('')+
    `</tr>`).join('');
  document.getElementById('tbl').innerHTML=`<table><thead><tr>${th}</tr></thead><tbody>${body}</tbody></table>`;
}

function fmtAxis(v){ const a=Math.abs(v); return a>=1000?(v/1000).toFixed(1)+'k':a>=100?v.toFixed(0):v.toFixed(2); }
// line chart with y-price ticks + x-date labels. points: [[label, value], …]
function chart(points, opts={}){
  if(!points||points.length<2) return '<div class="muted">no data</div>';
  const w=opts.w||660, h=opts.h||230, ml=48, mr=12, mt=10, mb=30;
  const iw=w-ml-mr, ih=h-mt-mb;
  const vals=points.map(p=>p[1]);
  const min=Math.min(...vals), max=Math.max(...vals), span=(max-min)||1;
  const x=i=>ml+(i/(points.length-1))*iw, y=v=>mt+ih-((v-min)/span)*ih;
  const col=opts.color||(vals[vals.length-1]>=vals[0]?'var(--green)':'var(--red)');
  const path=points.map((p,i)=>`${i?'L':'M'}${x(i).toFixed(1)},${y(p[1]).toFixed(1)}`).join(' ');
  let yt='';
  for(let k=0;k<=4;k++){const v=min+span*k/4,yy=y(v);
    yt+=`<line x1="${ml}" y1="${yy.toFixed(1)}" x2="${w-mr}" y2="${yy.toFixed(1)}" stroke="#21262d"/>
      <text x="${ml-6}" y="${(yy+3).toFixed(1)}" fill="var(--muted)" font-size="10" text-anchor="end">${fmtAxis(v)}</text>`;}
  let xt='';const step=Math.max(1,Math.floor((points.length-1)/5));
  for(let i=0;i<points.length;i+=step){xt+=`<text x="${x(i).toFixed(1)}" y="${h-9}" fill="var(--muted)" font-size="10" text-anchor="middle">${points[i][0]}</text>`;}
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" style="display:block">${yt}
    <path d="${path}" fill="none" stroke="${col}" stroke-width="2"/>${xt}
    ${opts.ylabel?`<text x="12" y="${mt+ih/2}" fill="var(--muted)" font-size="10" text-anchor="middle" transform="rotate(-90 12 ${mt+ih/2})">${opts.ylabel}</text>`:''}</svg>`;
}
// seasonality: 12 bars of seasonal index (100 = annual average)
function seasonalChart(seas){
  if(!seas||seas.length<6) return '<div class="muted">not enough history for seasonality</div>';
  const w=660,h=230,ml=40,mr=12,mt=10,mb=26,iw=w-ml-mr,ih=h-mt-mb;
  const idx=seas.map(s=>s[2]??100);
  const min=Math.min(100,...idx), max=Math.max(100,...idx), span=(max-min)||1;
  const y=v=>mt+ih-((v-min)/span)*ih, bw=iw/seas.length*0.7;
  let bars='';
  seas.forEach((s,i)=>{const v=s[2]??100, cx=ml+(i+0.5)*iw/seas.length;
    const top=Math.min(y(v),y(100)), bh=Math.abs(y(v)-y(100));
    const col=v>=100?'var(--green)':'var(--red)';
    bars+=`<rect x="${(cx-bw/2).toFixed(1)}" y="${top.toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(bh,1).toFixed(1)}" fill="${col}" opacity="0.8"/>
      <text x="${cx.toFixed(1)}" y="${h-9}" fill="var(--muted)" font-size="10" text-anchor="middle">${s[0]}</text>`;});
  const y100=y(100);
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" style="display:block">
    <line x1="${ml}" y1="${y100.toFixed(1)}" x2="${w-mr}" y2="${y100.toFixed(1)}" stroke="var(--muted)" stroke-dasharray="3 3"/>
    <text x="${ml-4}" y="${(y100+3).toFixed(1)}" fill="var(--muted)" font-size="10" text-anchor="end">100</text>${bars}</svg>`;
}
function tradeTable(title, rows){
  if(!rows||!rows.length) return '';
  const max=Math.max(...rows.map(r=>r[1]));
  return `<div class="card" style="flex:1;min-width:240px"><div class="name">${title}</div><table style="font-size:13px">`+
    rows.map(([c,p])=>`<tr><td style="border:none;padding:4px 8px 4px 0">${c}</td>
      <td style="border:none;padding:4px 0;width:55%"><div style="background:#21262d;border-radius:3px;height:14px;position:relative">
        <div style="background:var(--accent);height:14px;border-radius:3px;width:${(p/max*100).toFixed(0)}%"></div></div></td>
      <td class="num muted" style="border:none;padding:4px 0 4px 8px">${p}%</td></tr>`).join('')+
    `</table></div>`;
}

        ${covBar(cov.model,Math.max(cov.universe||0,cov.model||0),'Valuation model')}
        <tr><td class="muted" style="border:none;padding:4px 0">Options tickers</td><td colspan="2" style="border:none;padding:4px 0">${cov.options_tickers??'–'}</td></tr>
        <tr><td class="muted" style="border:none;padding:4px 0">Exposure tickers</td><td colspan="2" style="border:none;padding:4px 0">${cov.exposure_tickers??'–'}</td></tr>
      </table></div>`;
    // data quality + model completeness side by side
    html+=`<div style="display:flex;gap:12px;flex-wrap:wrap">
      <div class="card" style="flex:1;min-width:260px"><div class="name">Data quality (fundamentals)</div>
        <table style="font-size:13px">${Object.entries(q).map(([k,val])=>{
          const col=k.startsWith('High')?'pos':k.startsWith('Low')?'neg':'';
          return `<tr><td class="${col}" style="border:none;padding:4px 16px 4px 0">${k}</td><td class="num" style="border:none;padding:4px 0">${val}</td></tr>`;
        }).join('')||'<tr><td class="muted">n/a</td></tr>'}</table></div>
      <div class="card" style="flex:1;min-width:260px"><div class="name">Valuation-model completeness</div>
        <table style="font-size:13px">
          ${covBar(mc.dcf,mc.total,'DCF')}
          ${covBar(mc.comps,mc.total,'Comps')}
          ${covBar(mc.m3,mc.total,'EPV/Graham')}
          ${covBar(mc.all3,mc.total,'All three')}
        </table></div></div>`;
    // commodities gaps
    html+=`<div class="group-title">Commodities — fetch completeness</div>
      <div class="card">
        <span class="pill">${cm.fetched??'–'}/${cm.expected??'–'} fetched</span>
        ${(cm.missing&&cm.missing.length)?`<span class="pill neg">${cm.missing.length} missing</span>`:'<span class="pill pos">all fetched</span>'}
        ${(cm.missing&&cm.missing.length)?`<div class="muted" style="margin-top:8px">missing: ${cm.missing.map(x=>x.name+' ('+x.root+')').join(', ')}</div>`:''}
      </div>`;
    v.innerHTML=html;
  }catch(e){ v.innerHTML=`<div class="err">${e.message}<br>API unreachable at ${API()} — set the base above.</div>`; }
}

let SECTION=null;
function renderNav(){
  const nav=document.getElementById('nav');
  if(!SECTION){ nav.innerHTML=''; return; }
  nav.innerHTML=`<button onclick="goHome()">← Home</button>`+
    SECTIONS[SECTION].tabs.map(([id,label])=>
      `<button class="${TAB===id?'active':''}" onclick="goTab('${id}')">${label}</button>`).join('');
}
function goHome(){ SECTION=null; TAB=null; renderNav(); renderHome(); }
function goSection(id){ SECTION=id; const t=SECTIONS[id].tabs[0]; TAB=t[0]; renderNav(); t[2](); }
function goTab(id){ TAB=id; renderNav(); const t=SECTIONS[SECTION].tabs.find(x=>x[0]===id); if(t) t[2](); }
function renderHome(){
  const v=document.getElementById('view');
  v.innerHTML=`<div style="text-align:center;margin:34px 0 22px">
      <div class="big" style="font-size:28px">Trader Screener</div>
      <div class="muted">pick a workspace</div></div>
    <div class="cards" style="grid-template-columns:repeat(auto-fit,minmax(220px,1fr));max-width:780px;margin:0 auto">
      ${Object.entries(SECTIONS).map(([id,s])=>`
        <div class="card" style="cursor:pointer;text-align:center;padding:30px 18px" onclick="goSection('${id}')">
          <div style="font-size:40px;line-height:1">${s.icon}</div>
          <div class="big" style="margin:10px 0 6px">${s.label}</div>
          <div class="muted" style="font-size:13px">${s.desc}</div></div>`).join('')}
    </div>`;
}
document.getElementById('brand').onclick=goHome;
document.getElementById('apiBase').onchange=()=>{ ping(); if(SECTION&&TAB) goTab(TAB); else renderHome(); };
ping(); goHome();
setInterval(ping, 30000);
