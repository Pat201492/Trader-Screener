        sources:['Greenblatt — Magic Formula','Fama-French','Harris — Trading &amp; Exchanges','Chan — Quantitative Trading','Douglas — Trading in the Zone','Bailey et al. — Backtest Overfitting'],
        significance:'A <b>summed-ordinal-rank engine</b>: combine factors via rank(A) + rank(B), never blended raw values — sidesteps the unit mismatch between a percentage and a yield. It’s the screener’s <b>value-trader engine</b>, flagging where price diverges from fundamental value; pair it with smart-money as the timing/confirmation overlay. Judge it at the <b>sample level over 20+ trades</b>, not the last one. Keep params ≤5 and validate out-of-sample — its upstream search history is opaque, so it must clear a deflation/OOS gate before becoming a default sort.',
        exampleSignal:'score = rank(ROIC) + rank(EBIT/EV) [+ momentum/smart-money ranks]\n-> sort ascending; top decile = candidates'},
      {metric:'ROIC / Return on Capital (quality axis)', feedTier:'collected', multiSource:true,
        sources:['Greenblatt — Magic Formula','Fama-French'],
        significance:'The <b>quality factor</b> — ideally EBIT ÷ tangible capital (net working capital + net fixed assets, with excess cash and goodwill removed), stricter than a book ROIC field and cleaner than ROE/ROA. EBIT (not net income) lets firms with different debt/tax loads compare fairly. In factor terms it’s the <b>RMW quality tilt</b>. Verify the pipeline’s ROIC actually strips excess cash, short-term debt, and goodwill.',
        exampleSignal:'roic top-quartile (EBIT / tangible-capital) -> quality leg of composite'},
      {metric:'EBIT/EV earnings-yield (cheapness axis)', feedTier:'collected', multiSource:true,
        sources:['Greenblatt — Magic Formula','Fama-French'],
        significance:'The <b>capital-structure-neutral</b> cheapness rank — preferred over P/E and E/P because EV counts both equity price and net debt, so two firms with different leverage but identical economics rank the same. Carry an EBIT/EV column beside P/E; a loose P/E field is only a rough approximation of the intended cheapness rank.',
        exampleSignal:'rank by EBIT/EV descending (cheapest first) -> cheapness leg; beside pe column'},
      {metric:'Market cap (cap-floor pre-rank filter)', feedTier:'collected', multiSource:true,
        sources:['Greenblatt — Magic Formula','Fama-French','How to Read a Tear Sheet'],
        significance:'A market-cap <b>floor applied before ranking</b> (not a display column) — tiers like &gt;$50M / &gt;$200M / &gt;$1B, with $50–100M recommended for individuals, because thin names can’t be replicated in the real world. It sets the liquidity tier and which risks apply — a small-cap can move 20% on one order. Also drop names that announced earnings in the last week and P/E ≤ 5 as <b>data-error guards</b>.',
        exampleSignal:'mkt_cap < $50M -> exclude pre-rank\npe <= 5 OR earnings_within_7d -> data-error exclude'},
      {metric:'Sector (financials/utilities/ADR exclusions)', feedTier:'collected', multiSource:false,
        sources:['Greenblatt — Magic Formula'],
        significance:'A <b>pre-rank sector filter</b>, not a display column: eliminate financials and utilities (their balance sheets break the capital/EBIT math) plus foreign companies/ADRs before ranking. Open question whether to exclude globally or only on the factors their accounting distorts. Sector also drives the risk-off defensive tilt.',
        exampleSignal:'sector IN (financials, utilities) OR is_adr -> exclude pre-rank from EBIT-based factors'},
      {metric:'DCF/comps upside % (absolute intrinsic value)', feedTier:'collected', multiSource:true,
        sources:['Greenblatt — Magic Formula','Harris — Trading &amp; Exchanges','Chan — Quantitative Trading','Bailey et al. — Backtest Overfitting'],
        significance:'Complementary to the composite, not redundant: DCF/comps upside is <b>absolute intrinsic value</b> (forecasts, WACC) answering “what is it worth?”, while the Magic-Formula rank is <b>relative, cross-sectional, trailing-only</b> — “which is best-ranked right now?”. The composite can host both as separate factors. Treat fundamentals as point-in-time — restated financials carry embedded look-ahead bias.',
        exampleSignal:'dcf_upside_pct > +20% AND score top-decile -> value + rank agreement'},
      {metric:'Factor-model tilts (SMB / HML / RMW / low-beta)', feedTier:'collected', multiSource:true,
        sources:['Fama-French','Greenblatt — Magic Formula'],
        significance:'Build tilts — SMB size (median-cap split), HML value (invert P/E to earnings-yield / book-to-market), RMW ROIC quality, low-beta — and combine as <b>composite z-scores</b>, not stacked hard filters, so no single characteristic zeroes out the universe. Match cadence to the factor: re-rank momentum monthly but value/quality/size annually or quarterly to cut turnover.',
        exampleSignal:'z(momentum) + z(quality) + z(value) + z(-beta) -> composite tilt score\nre-rank per factor cadence'},
      {metric:'Composite discipline (≤5 params, out-of-sample, point-in-time)', feedTier:'collected', multiSource:true,
        sources:['Chan — Quantitative Trading','Bailey et al. — Backtest Overfitting','Greenblatt — Magic Formula'],
        significance:'Keep parameters ≤5, validate <b>out-of-sample</b> (older = train, recent = test; test length by sample-size rule, not a fixed third), and treat all fundamentals as point-in-time. Restated financials carry embedded look-ahead, and a value bent maximizes survivorship inflation (Chan’s example: -42% real vs +388% survivorship-inflated). No factor becomes a default until it clears an OOS gate with its trial-count N logged.',
        exampleSignal:'promote factor to default sort ONLY IF\nparams <= 5 AND OOS_Sharpe >= 0 AND N_trials logged'},
      {metric:'ETF fundamentals rows (expense ratio + TCO)', feedTier:'collected', multiSource:false,
        sources:['CFA ETF Guide'],
        significance:'P/E, ROIC and upside are meaningless for a pooled fund — blank them for ETFs and show <b>expense ratio + total cost of ownership</b> instead (TCO = expense ratio + spread + premium/discount paid + creation/redemption costs). Add a data-quality flag on persistent/large NAV premium/discount and wide tracking difference — signals of stale marks or structural drift — and demote such ETFs.',
        exampleSignal:'is_etf -> blank pe/roic/upside; show expense_ratio + TCO\nflag if |premium_discount| persistent -> demote'},
    ]],
    ['Liquidity &amp; microstructure (issue #51)', [
      {metric:'Dollar volume (ADV × price)', feedTier:'ohlcv', multiSource:true,
        sources:['Harris — Trading &amp; Exchanges','Greenblatt — Magic Formula','Chan — Quantitative Trading','How to Read a Tear Sheet','Information Sheet / Tearsheet','Fama-French','CFA ETF Guide'],
        significance:'The P1 tradeability filter and the single most underrated line — a <b>hard filter</b>, not a nice-to-have. It’s the honest free stand-in for the missing quote feed, proxying the <b>depth</b> dimension of liquidity: a signal you can’t act on at size is not a signal, and there’s no liquidity to exit in a panic. Ship it as both a default column and a hard floor. It makes explicit the tradeability screen a cap-floor only handles implicitly, and the independent trader’s edge lives specifically at low capacity. Caveat: it proxies <b>depth ONLY</b> — nothing about spread or resiliency.',
        exampleSignal:'dollar_vol < $2M -> hard-reject (untradeable); dollar_vol > $20M -> passes P1 liquidity floor'},
      {metric:'Bid/ask spread (width / price-of-immediacy)', feedTier:'paid', multiSource:true,
        sources:['Harris — Trading &amp; Exchanges','CFA ETF Guide','CME Intro to Futures'],
        significance:'The <b>width</b> dimension — literally the price impatient traders pay for immediacy, and it carries an adverse-selection component. It’s a real trading cost the game/screener omits, but it needs a quote feed, so it’s correctly labelled ‘not in v1.’ Documenting it tells the build which liquidity dimension is <b>NOT</b> being measured rather than leaving the gap silent.',
        exampleSignal:'spread_bps (paid feed) -> effective-cost gate; not in v1, dollar_vol proxies depth only'},
      {metric:'Market depth / order book (resiliency)', feedTier:'paid', multiSource:true,
        sources:['Harris — Trading &amp; Exchanges','CME Intro to Futures'],
        significance:'The <b>depth</b> dimension and the only window onto <b>resiliency</b> (how fast the book refills). It cannot be measured from nightly OHLCV at all — state this limit explicitly. Dollar volume proxies depth only; true depth/book and resiliency are paid, real-time-only.',
        exampleSignal:'book_depth / resiliency (paid, real-time) -> not measurable in v1 nightly pipeline'},
      {metric:'Capacity filter', feedTier:'ohlcv', multiSource:false,
        sources:['Chan — Quantitative Trading'],
        significance:'Screen out names too thin to trade at your size without slippage, and treat capacity as a <b>first-class filter</b>. The independent trader’s edge lives specifically at <b>LOW capacity</b> — it’s far easier to run a high Sharpe on a small account — so don’t screen for strategies only a large fund could run. Minimize market impact by scaling order size.',
        exampleSignal:'target_shares > 5% of ADV -> too big to trade cleanly at this size, demote'},
      {metric:'ETF liquidity (basket-based, branched logic)', feedTier:'ohlcv', multiSource:false,
        sources:['CFA ETF Guide'],
        significance:'An ETF’s real tradeability lives in its <b>underlying basket</b>, not its on-screen volume — an AP can source the basket, so a thin-volume ETF on a mega-cap basket is highly tradeable. Never hard-reject an ETF on low screen ADV (ADV is a floor, not a ceiling). Compute capacity as the sum of each constituent’s dollar-ADV × weight (free, since holdings are already collected); the achievable spread (arbitrage band), not ADV, is the ETF gate.',
        exampleSignal:'is_etf AND screen_ADV low BUT basket_dollar_ADV high -> keep (liquid basket), gate on spread'},
      {metric:'Futures liquidity (contract volume + open interest, days-to-roll)', feedTier:'ohlcv', multiSource:false,
        sources:['CME Intro to Futures'],
        significance:'For futures, replace ADV/dollar-volume with active-month contract volume + open interest. <b>OI</b> is the tradeability signal ADV misses — it’s committed capital, and when OI drains from the front month it flags a dying contract about to roll. Surface days-to-roll so you’re not screening a contract that’s about to lose its liquidity.',
        exampleSignal:'is_future AND front_month_OI falling AND days_to_roll < 5 -> flag dying front month, roll'},
      {metric:'Factor breakpoints from liquid names only', feedTier:'ohlcv', multiSource:false,
        sources:['Fama-French'],
        significance:'When cutting the universe into percentile buckets, derive the breakpoints from <b>high dollar-volume names only</b>, then classify the whole universe against those cuts. Otherwise a flood of illiquid micro-caps warps the percentile cut points and distorts every factor rank.',
        exampleSignal:'compute percentile breakpoints on dollar_vol-top-quartile, then rank full universe against them'},
    ]],
    ['Momentum — skip-month factor + RS rank (issue #40)', [
      {metric:'Trailing returns (1/3/6/12-month)', feedTier:'ohlcv', multiSource:false,
        sources:['Fama-French'],
        significance:'Simple close-to-close returns over each trailing window, free from nightly OHLCV. Display-only building blocks — the priced-in signal is the skip-month factor below, not raw 12-month return.',

        significance:'Cumulative return from 12 months ago to 2 months ago, <b>skipping the most recent month (t-1)</b>. This IS French’s winner/loser bucketing rule — including t-1 contaminates the factor with short-term reversal, a different (opposite-signed) effect. Chan: momentum and mean-reversion are the only two profitable factor families worth a dedicated column. Re-ranked monthly.',

      {metric:'RS percentile (cross-sectional rank)', feedTier:'ohlcv', multiSource:true,

    ['Volatility — sizing, stops &amp; regime (issue #50)', [
      {metric:'ATR / ATR% (Average True Range)', feedTier:'ohlcv', multiSource:true,
        sources:['QuantInsti — Risk Management','Chan — Quantitative Trading','Harris — Trading &amp; Exchanges','How to Read a Tear Sheet','Information Sheet / Tearsheet'],
        significance:'The <b>load-bearing volatility input</b>: ATR is the typical daily dollar move, so it sets stop distance and therefore all position sizing downstream. A stop too tight relative to ATR gets hit by normal noise; ATR tells the position how much room it needs to breathe and <b>keeps dollar-risk constant across names</b>. Size by volatility — a high-ATR name gets fewer shares. Lag it like any signal.',
        exampleSignal:'stop = price - 2*ATR; shares = (equity * 1%) / (2*ATR) -> pre-sized trade plan'},
      {metric:'Realized / historical volatility (rVol)', feedTier:'ohlcv', multiSource:true,
        sources:['Harris — Trading &amp; Exchanges','Bailey et al. — Backtest Overfitting','How to Read a Tear Sheet','Information Sheet / Tearsheet','OIC — IV Rank / IV Percentile','CME Intro to Futures'],
        significance:'How much the name actually moves (annualized stdev of returns) — the <b>baseline for risk</b> and the yardstick you compare implied vol against. High rVol means wider stops, smaller size, and pricier options. It encodes the fundamental-vs-transitory split, so use it as a <b>regime/sizing input, not a standalone stock picker</b>. On futures, compute on a roll-adjusted series so roll gaps aren’t counted as volatility.',
        exampleSignal:'IV_rank high AND IV >> realized_vol_30d -> options overpriced (favor selling premium)'},
      {metric:'Beta (vs SPY)', feedTier:'ohlcv', multiSource:true,
        sources:['Harris — Trading &amp; Exchanges','Fama-French','Bailey et al. — Backtest Overfitting','How to Read a Tear Sheet','Information Sheet / Tearsheet','NY Fed — Yield Curve Leading Indicator'],
        significance:'Tells you how much the name amplifies the market — high beta means the P/L is really a <b>leveraged index bet</b>, and in a selloff beta drives your loss regardless of the single-name thesis. Use it to size and for regime/low-vol tilts (favor low-beta quantiles), not as a standalone signal. Under a risk-off macro regime the default screen should <b>bias away from high-beta names</b>.',
        exampleSignal:'beta < 0.8 tilt when P(recession) >= 30% (risk-off) -> defensive low-beta bias'},
      {metric:'IV / IV-rank (the §2h mirror in volatility)', feedTier:'paid', multiSource:true,
        sources:['OIC — IV Rank / IV Percentile','Derivatives — Types &amp; Signals','How to Read a Tear Sheet'],
        significance:'Implied volatility and its rank also live in the volatility view as the forward-looking counterpart to realized vol — the core edge options screening adds is <b>realized-vs-implied</b>. Raw IV isn’t comparable across names, so it must be <b>normalized to IV Rank/Percentile</b>. Requires a paid options-chain feed (see Options group for full treatment).',
        exampleSignal:'IV_rank vs realized_vol_30d divergence -> rich/cheap premium (see Options group)'},
    ]],
    ['Price & momentum (issue #49)', [
      {metric:'Momentum factor (prior 2–12 month return, skip-most-recent-month)', feedTier:'ohlcv', multiSource:true,
        sources:['Fama-French','Harris — Trading &amp; Exchanges','Chan — Quantitative Trading','Greenblatt — Magic Formula','Bailey et al. — Backtest Overfitting','Douglas — Trading in the Zone'],
        significance:'The core academic momentum signal: cumulate the return from 12 months ago to 2 months ago and <b>skip the most recent month</b>, then percentile-rank each name against the universe — that rank <b>is</b> the winner/loser bucketing. Skipping the last month matters: including it <b>contaminates momentum with short-term reversal</b>. Trade it as a <b>cross-sectional rank, re-ranked monthly</b>, and never surface a name that fails the liquidity floor — price impact eats the edge otherwise. It is a price-discovery signal (informed flow drags price toward value), but it is only <b>tradeable, not a certainty</b>.',
        exampleSignal:'ret_2_12_rank >= 80 (skip t-1) AND dollar_vol > $20M AND price > 200DMA -> momentum long candidate'},
      {metric:'Relative strength (RS) rank vs universe', feedTier:'ohlcv', multiSource:true,
        sources:['Fama-French','Harris — Trading &amp; Exchanges','Bailey et al. — Backtest Overfitting','How to Read a Tear Sheet','Information Sheet / Tearsheet','CME Intro to Futures'],
        significance:'Converts the prior 2–12 month return into a cross-sectional percentile over the universe (top = winners). RS confirms leadership vs the market, but <b>the trend is only your friend when you can trade it</b> — gate every RS name on the dollar-volume floor. Set breakpoints from <b>liquid names only</b> so illiquid micro-caps don’t warp the percentile cut points. Prefer calls/longs on high-RS names in an uptrend; counter-trend needs a stronger catalyst.',
        exampleSignal:'RS_rank > 80 AND dollar_vol > $20M -> relative-strength long candidate\nsuppress if RS_rank computed on unadjusted futures series'},
      {metric:'Return 1/3/6/12-month (trailing returns)', feedTier:'ohlcv', multiSource:true,
        sources:['Fama-French','Harris — Trading &amp; Exchanges','CME Intro to Futures','Bailey et al. — Backtest Overfitting'],
        significance:'Standardized trailing-return windows feed the momentum/RS rank and give the tear sheet its “has this moved” context. The <b>12-month window (minus the skip month)</b> is the momentum input. On futures, compute on a <b>back-adjusted or return-spliced series</b> — naively stitched prices inject phantom roll gaps that fake momentum and breakouts.',
        exampleSignal:'ret_12m top-decile AND ret_1m NOT top-decile (avoid reversal) -> momentum-confirmed'},
      {metric:'Moving-average cross (50/200-day) / trend arrow', feedTier:'ohlcv', multiSource:true,
        sources:['How to Read a Tear Sheet','Information Sheet / Tearsheet','Chan — Quantitative Trading','CME Intro to Futures'],
        significance:'Defines the prevailing trend — price above a rising 50/200DMA is an uptrend; a 200-day break is a checkable bearish confirmation. Technicals rarely make the thesis, they <b>time it</b>: “cheap in a downtrend stays cheap.” The trend flag also gates whether <b>ATR stops are even valid</b> (stops help only in trending regimes). Compute on data up to the prior close only, and on futures choose the continuous-series construction deliberately — back-adjusting corrupts absolute MA levels.',
        exampleSignal:'price > 50DMA > 200DMA (golden-cross regime) -> trend-up; enables ATR trailing stop'},
      {metric:'RSI (momentum oscillator)', feedTier:'ohlcv', multiSource:true,
        sources:['How to Read a Tear Sheet','Information Sheet / Tearsheet','Chan — Quantitative Trading','Bailey et al. — Backtest Overfitting'],
        significance:'Confirms the move has fuel and isn’t exhausted (e.g. RSI ~61 = room before overbought). Read as a <b>mean-reversion signal in range regimes</b> and a <b>continuation gauge in trends</b>. Any RSI chosen by sweeping lookbacks/thresholds is the max of many noisy trials, so it must <b>clear an out-of-sample gate and log trials</b> before becoming a default column — and it must be lagged to the prior close.',
        exampleSignal:'RSI < 30 AND price near 52w_low AND mean-revert regime -> oversold bounce candidate'},
      {metric:'MACD (trend/momentum cross)', feedTier:'ohlcv', multiSource:true,
        sources:['Chan — Quantitative Trading','Bailey et al. — Backtest Overfitting','CME Intro to Futures'],
        significance:'A trend-following momentum cross. Same discipline as RSI: it is a <b>selection-biased signal if tuned over many parameter sets</b>, so gate it out-of-sample and log the trial count before defaulting on it, and lag it to the prior close so you don’t inject look-ahead. On futures, compute on the correctly constructed continuous series.',
        exampleSignal:'MACD line crosses above signal AND price > 200DMA -> trend-continuation long'},
      {metric:'VWAP', feedTier:'paid', multiSource:false,
        sources:['Harris — Trading &amp; Exchanges'],
        significance:'The benchmark price fills are measured against (Estimated Cost = TradeSize × TradeSign × (TradePrice − BenchmarkPrice)). Useful conceptually for execution-cost thinking, but real-time VWAP needs a <b>quote feed</b>, so it’s out of the free v1 for intraday use — a swing/position horizon doesn’t require it.',
        exampleSignal:'fill_price vs VWAP -> effective-cost estimate (paid/intraday only, not in v1)'},
    ]],
    ['Risk & sizing (issue #55)', [
      {metric:'Fixed-fractional sizing (ATR stop, 1–2% risk)', feedTier:'ohlcv', multiSource:true,
        sources:['QuantInsti — Risk Management','Harris — Trading &amp; Exchanges','CME Intro to Futures'],
        significance:'The core sizing rule that turns a screen hit into an executable, pre-sized trade plan: risk 1–2% of equity per trade and size backwards from an ATR stop — shares = (equity × risk%) / (k × ATR), stop = entry − k × ATR. This allocates <b>equal RISK (not equal dollars)</b> per name; wider stop means fewer shares. At 2% risk you can absorb <b>~50 consecutive losses</b> before ruin. Surface size, stop, and drawdown as default columns.',
        exampleSignal:'shares = (equity * 0.02) / (2*ATR); stop = price - 2*ATR -> pre-sized plan surfaced on each row'},
      {metric:'Kelly sizing (f = m/σ², half-Kelly, Sharpe/DD/MAR gates)', feedTier:'ohlcv', multiSource:true,
        sources:['Chan — Quantitative Trading','Harris — Trading &amp; Exchanges','Bailey et al. — Backtest Overfitting'],
        significance:'Kelly f = m/σ² (via ATR as the vol proxy) sets an optimal fraction, but use <b>HALF-Kelly</b>, further capped by the worst-historical-loss rule because Gaussian Kelly underestimates tail risk (the S&amp;P’s worst day was -20.5%). Attach Sharpe + max drawdown + MAR to the equity curve before trusting any ranking, and require backtest Sharpe <b>≥1 over ≥681 daily points</b>. ATR stops only in a trending regime — never on mean-reverting names, where a stop just realizes the loss.',
        exampleSignal:'size = min(half-Kelly f, worst-loss-cap); require backtest Sharpe >= 1 over >= 681 days before trusting rank'},
      {metric:'Stop distance (ATR multiple) gated on trend/regime', feedTier:'ohlcv', multiSource:true,
        sources:['QuantInsti — Risk Management','Chan — Quantitative Trading','Harris — Trading &amp; Exchanges','How to Read a Tear Sheet'],
        significance:'Express stops as a volatility unit — stop = entry − k×ATR — so share count auto-scales to each name’s noise and the stop isn’t an arbitrary round number. Critical caveat: stops only help in <b>trending/momentum regimes</b>; on mean-reverting names a stop realizes the catastrophic loss rather than avoiding it, so gate ATR stops on the 50/200DMA trend confirmation. News-driven moves are momentum (don’t stand in front of the train); newsless liquidity events mean-revert.',
        exampleSignal:'stop = price - 2*ATR ONLY IF trend_up (price>200DMA); mean-revert name -> no ATR stop'},
      {metric:'Max drawdown (historical)', feedTier:'ohlcv', multiSource:true,
        sources:['Chan — Quantitative Trading','QuantInsti — Risk Management','Douglas — Trading in the Zone','Bailey et al. — Backtest Overfitting','Information Sheet / Tearsheet'],
        significance:'The honest worst-case that must be pre-accepted up front and cross-checked against the per-trade risk % (the 2%→~50-losses-to-ruin gauge). It’s a sample-level input judged over a series of trades, not reacted to after one loss — max drawdown = <b>peak-to-subsequent-trough</b> (time order matters). Flag drawdowns deeper than ~10% or longer than ~4 months. Display it <b>deflated for search effort</b> with its trial-count N, never as a raw optimized figure.',
        exampleSignal:'max_drawdown > 10% OR dd_duration > 4mo -> risk red flag; show deflated with N_trials'},
      {metric:'Sharpe / MAR gate (with trial-count N)', feedTier:'ohlcv', multiSource:true,
        sources:['Chan — Quantitative Trading','Bailey et al. — Backtest Overfitting'],
        significance:'Rank on survivability, not raw return: a strategy with Sharpe below 1 is not suitable stand-alone, and a Sharpe without its trial count N is <b>uninterpretable</b> (strong evidence after 2 trials, pure luck after 1,000). Publish N and the deflated Sharpe (probability true Sharpe is positive) next to every performance figure, deflate for skew/kurtosis too, and demand a track record ≥ the minimum backtest length before trusting a factor.',
        exampleSignal:'show Sharpe only WITH N_trials and deflated_Sharpe (DSR = P(true Sharpe>0)); require Sharpe>=1 over>=681 pts'},
      {metric:'Behavioral pre-commitment layer', feedTier:'ohlcv', multiSource:true,
        sources:['Douglas — Trading in the Zone','QuantInsti — Risk Management'],
        significance:'The sizing outputs are pre-commitments to be obeyed <b>AFTER a drawdown</b> — predefine and fully accept the risk before entry, then don’t widen the stop or double up to ‘make it back.’ The concrete feature is a per-trade rule-adherence log (realized vs suggested size = discipline drift) plus a drawdown cool-down flag, and keeping the truths/principles visible as a checklist. This is <b>behavior/usage policy, not a new metric column</b>.',
        exampleSignal:'log(realized_size vs suggested_size) -> discipline-drift flag; after losing streak -> cool-down flag'},
    ]],
    ['Macro / regime (issue #54)', [
      {metric:'VIX regime column (FRED VIXCLS)', feedTier:'macro', multiSource:true,
        sources:['Cboe VIX Index','IV Rank / IV Percentile (OIC)','Harris — Trading &amp; Exchanges','Douglas — Trading in the Zone','Chan — Quantitative Trading'],

        exampleSignal:'P_recession >= 30% OR VIX > 30 -> default filters bias to (sector defensive, quality high, beta low), user-overridable'},

  const tierColor={ohlcv:'var(--green)',collected:'var(--accent)',macro:'#a371f7',paid:'var(--red)'};
  let html=`<div style="margin:6px 0 4px"><span class="big" style="font-size:22px">Learning the business of trading</span></div>
    <div class="muted" style="margin-bottom:6px;max-width:760px">Every metric the screener computes, grouped by section. Each card: why it matters &amp; how to trade off it, the sources that back it (an <b>overlap</b> pill means 2+ sources agree), and a concrete example signal in the shortlist&rsquo;s proposed column variables (most not yet in the live screener).</div>
    <div style="margin-bottom:6px">

      <span class="pill" style="border:1px solid ${tierColor.collected}">collected free</span>

      <span class="pill" style="border:1px solid ${tierColor.paid}">paid feed</span>

    html+=items.map(it=>{
      const tc=tierColor[it.feedTier]||'var(--border)';
      const overlap=it.multiSource?`<span class="pill" style="border:1px solid var(--accent);color:var(--accent)">overlap ×${it.sources.length}</span>`:'';
      const srcPills=it.sources.map(s=>`<span class="pill" style="font-size:11px">${s}</span>`).join('');
      return `<div class="card" style="padding:14px">
        <div style="display:flex;align-items:baseline;justify-content:space-between;gap:8px">
          <div class="name">${it.metric}</div>
          <span class="pill" style="border:1px solid ${tc};color:${tc};font-size:11px;white-space:nowrap">${it.feedTier}</span>
        </div>
        <div class="muted" style="font-size:12.5px;line-height:1.5;margin:8px 0 10px">${it.significance}</div>
        <div style="margin-bottom:8px">${overlap}${srcPills}</div>
        <div class="muted" style="font-size:11px;text-transform:uppercase;letter-spacing:.5px;margin-bottom:3px">Example signal</div>

      </div>`;
    }).join('');
    html+='</div>';
  }
  v.innerHTML=html;
}

// ── RESEARCH workspace (issue #95) — hypothesis projects ──
// A Research project is a FALSIFIABLE HYPOTHESIS, not a folder. Each states a
// prediction up front, names the data it needs, names the Tools that supply that
// data, declares its trial count BEFORE it runs, and ends in a verdict. Discipline
// is enforced, not optional: the repo already owns the look-ahead gate (#42,
// lookahead-gate/) and the out-of-sample + deflation + trial-count gate (#47) — a
// project that can't state its trial count before it starts is a fishing trip.
// Projects reference Tools; Tools never reference projects (one-directional).
// Schema per project: {id,title,hypothesis,verdict,trialCount,lookaheadGate,
//   oosGate,dataNeeded[],tools[],note}. verdict ∈ {open,supported,refuted,inconclusive}.

// ── TOOLS workspace (issue #95) — data-gathering / analysis modules ──
// A Tool is standalone and reusable. kind:'gather' pulls raw data in;
// kind:'analyze' consumes gathered data and emits a number / rank / classification.
// home ∈ {local,pipeline}: 'pipeline' tools already live upstream (the pipeline is
// the only writer — ARCHITECTURE.md); 'local' tools are exploratory, human-
// supervised, project-local and GRADUATE upstream once a field proves out.
const TOOLS=[
  {id:'edgar-scrubber', kind:'gather', home:'local', name:'EDGAR scrubber — 424B2 pilot',
   emits:'extracted field set, per filing document', inputs:['form','date range','full-text query','field spec'],
   status:'pilot · human-supervised', detail:'openEdgarScrubber',
   desc:'Crawls every 424B2 filing matching an EDGAR search, opens <b>every document</b> in each filing, and extracts a user-designated field set. A local model does the extraction; you hand-validate the first N documents so it learns your field definitions before it runs unattended.'},
  {id:'fred-puller', kind:'gather', home:'pipeline', name:'FRED macro puller',
   emits:'VIX / yield-curve series', inputs:['series id'], status:'graduated · upstream',
   desc:'Already lives in the shared pipeline (<code>fred.py</code>). Not re-implemented here — the boundary rule forbids a second ingest path. Listed so its home is explicit.'},
  {id:'options-chain-puller', kind:'gather', home:'pipeline', name:'Options-chain puller',
   emits:'chains + IV / Greeks / OI', inputs:['ticker'], status:'graduated · upstream',
   desc:'Lives upstream (<code>options.py</code>). Referenced by projects via the pipeline output, not re-scraped locally.'},
  {id:'magic-formula-ranker', kind:'analyze', home:'pipeline', name:'Magic-Formula ranker',
   emits:'ordinal rank', inputs:['roic','ebit_ev_yield'], status:'live screener column',

  {id:'smart-money-scorer', kind:'analyze', home:'pipeline', name:'Smart-money scorer',
   emits:'signed −100..100 score', inputs:['congress','insider','news','options flow'], status:'live column · OOS pending',
   desc:'Folds informed-flow legs into one score (#41). Reused by the Smart-Money tab and the committee-conflict project.'},
  {id:'vix-regime-classifier', kind:'analyze', home:'pipeline', name:'VIX regime classifier',
   emits:'class {calm|normal|elevated|stress}', inputs:['vix','vix3m'], status:'live',
   desc:'Buckets the VIX level + term-structure into a regime label that soft-gates the screener defaults.'},
  {id:'recession-probit', kind:'analyze', home:'pipeline', name:'Recession probit',
   emits:'P(recession, 12m)', inputs:['T10Y3M spread'], status:'live',
   desc:'Estrella–Mishkin probit on the yield-curve spread → a probability. Standalone; the Macro tab and any macro-timed project can call it.'},
];
const toolById=id=>TOOLS.find(t=>t.id===id);

function verdictBadge(v){
  const m={supported:['v-supported','supported'],refuted:['v-refuted','refuted'],inconclusive:['v-inconclusive','inconclusive'],open:['v-open','open']};
  const [cls,lab]=m[v]||m.open; return `<span class="tier ${cls}">${lab}</span>`;
}
function gatePill(label,state){
  const c=state==='pass'?'var(--green)':state==='fail'?'var(--red)':state==='pending'?'#e3b341':'var(--muted)';
  return `<span class="pill" style="border:1px solid ${c};color:${c};font-size:11px">${label}: ${state}</span>`;
}
function researchCard(p){
  const fishing=p.trialCount==null;
  const trial=fishing
    ? '<span class="neg">not declared — fishing trip</span>'
    : `<b>${p.trialCount}</b> trial${p.trialCount===1?'':'s'} <span class="muted">(declared before start)</span>`;
  const tools=p.tools.length
    ? p.tools.map(id=>{const t=toolById(id);return `<span class="pill" style="border:1px solid var(--accent);color:var(--accent);font-size:11px;cursor:pointer" onclick="goSection('tools')" title="Open Tools">${t?t.name:id}</span>`;}).join('')
    : '<span class="muted">none</span>';
  return `<div class="card" style="padding:14px${fishing?';border-color:#f8514955':''}">
    <div style="display:flex;align-items:baseline;justify-content:space-between;gap:8px">
      <div class="name">${p.title}</div>${verdictBadge(p.verdict)}
    </div>
    <div class="muted" style="font-size:12.5px;line-height:1.55;margin:8px 0 10px">${p.hypothesis}</div>
    <table style="font-size:12px">
      <tr><td class="muted" style="border:none;padding:3px 12px 3px 0">Trial count</td><td style="border:none;padding:3px 0">${trial}</td></tr>
      <tr><td class="muted" style="border:none;padding:3px 12px 3px 0;vertical-align:top">Discipline gates</td><td style="border:none;padding:3px 0">${gatePill('look-ahead #42',p.lookaheadGate)} ${gatePill('OOS+deflation #47',p.oosGate)}</td></tr>
      <tr><td class="muted" style="border:none;padding:3px 12px 3px 0;vertical-align:top">Data needed</td><td style="border:none;padding:3px 0">${p.dataNeeded.map(d=>`<span class="pill" style="font-size:11px">${d}</span>`).join('')}</td></tr>
      <tr><td class="muted" style="border:none;padding:3px 12px 3px 0;vertical-align:top">Tools</td><td style="border:none;padding:3px 0">${tools}</td></tr>
    </table>

// ── EDGAR scrubber detail (issue #95) — the pilot data-gathering tool ──
// Design corrections baked in: (1) NO browser automation — SEC ships JSON APIs,
// search + fetch are deterministic code, the model only extracts; (2) "the model
// learns what I want" is NOT fine-tuning — a 14B local model doesn't weight-update
// from ten examples, so what learns is (a) a few-shot exemplar store, then (b) rule
// induction, then (c) a LoRA (backlogged). Scope is project-local + graduates upstream.
const EDGAR_ENDPOINTS=[
  ['full-text search (2001→present)','https://efts.sec.gov/LATEST/search-index?q=&forms=424B2&startdt=&enddt=&from='],
  ['filing history per company','https://data.sec.gov/submissions/CIK##########.json'],
  ['every document in one filing','https://www.sec.gov/Archives/edgar/data/{cik}/{accession_nodash}/index.json'],
  ['pre-parsed XBRL facts','https://data.sec.gov/api/xbrl/{companyfacts,companyconcept,frames}'],
  ['quarterly form index','https://www.sec.gov/Archives/edgar/full-index/{yyyy}/QTR{n}/form.idx'],
];
// user-designated field set for the 424B2 pilot (structured / market-linked notes)
const EDGAR_FIELDSPEC=[
  {field:'issuer', desc:'Issuing entity + CIK', anchor:'cover-page header'},
  {field:'reference_underlying', desc:'Linked asset(s) — index / single name / basket', anchor:'“linked to” clause'},
  {field:'principal_amount', desc:'Aggregate principal of the takedown', anchor:'“Aggregate principal amount”'},
  {field:'contingent_coupon', desc:'Coupon rate + barrier condition', anchor:'“Contingent Coupon”'},
  {field:'barrier_buffer', desc:'Downside barrier / buffer (% of initial)', anchor:'“Barrier Level” / “Buffer”'},
  {field:'autocall_schedule', desc:'Automatic-call dates + thresholds', anchor:'“Automatic Call”'},
  {field:'maturity_date', desc:'Stated maturity', anchor:'cover-page terms table'},
  {field:'cusip', desc:'9-char CUSIP', anchor:'“CUSIP”'},
];
// "validate the first N by hand" surface. Accepting a span promotes it to a
// few-shot exemplar keyed (form, issuer, field). Mock, deterministic (offline demo).
let EDGAR_DOCS=[
  {doc:'424b2_0001.htm', issuer:'GS Finance Corp', field:'reference_underlying', span:'the S&amp;P 500® Index', status:'unreviewed'},
  {doc:'424b2_0001.htm', issuer:'GS Finance Corp', field:'contingent_coupon', span:'9.10% per annum', status:'unreviewed'},
  {doc:'424b2_0002.htm', issuer:'GS Finance Corp', field:'barrier_buffer', span:'70% of the Initial Level', status:'unreviewed'},
  {doc:'424b2_0003.htm', issuer:'Citigroup Global Markets', field:'reference_underlying', span:'the Russell 2000® Index', status:'unreviewed'},
  {doc:'424b2_0003.htm', issuer:'Citigroup Global Markets', field:'principal_amount', span:'$2,417,000', status:'unreviewed'},
];
let EDGAR_QUERY={q:'contingent coupon', startdt:'2024-01-01', enddt:'2024-12-31', from:0};
let EDGAR_PLANNED=false;
function edgarReview(i,ok){ if(EDGAR_DOCS[i]) EDGAR_DOCS[i].status=ok?'accepted':'corrected'; renderEdgarScrubber(); }
function edgarPlanCrawl(){
  const g=id=>{const el=document.getElementById(id);return el?el.value:'';};
  EDGAR_QUERY={q:g('edgar-q'), startdt:g('edgar-start'), enddt:g('edgar-end'), from:g('edgar-from')||0};
  EDGAR_PLANNED=true; renderEdgarScrubber();
}
function openEdgarScrubber(){ SECTION='tools'; TAB='gathering'; renderNav(); renderEdgarScrubber(); }
function renderEdgarScrubber(){
  const v=document.getElementById('view');
  const accepted=EDGAR_DOCS.filter(d=>d.status==='accepted').length;
  const reviewed=EDGAR_DOCS.filter(d=>d.status!=='unreviewed').length;
  const eftsURL=`https://efts.sec.gov/LATEST/search-index?q=${encodeURIComponent('"'+EDGAR_QUERY.q+'"')}&forms=424B2&startdt=${EDGAR_QUERY.startdt}&enddt=${EDGAR_QUERY.enddt}&from=${EDGAR_QUERY.from}`;
  const learnCard=(tag,title,accent,when,body)=>`<div class="card" style="padding:14px;border-left:3px solid ${accent}">
    <div style="display:flex;align-items:baseline;justify-content:space-between;gap:8px">
      <div class="name">${tag}. ${title}</div><span class="pill" style="font-size:11px;border:1px solid ${accent};color:${accent}">${when}</span>
    </div>
    <div class="muted" style="font-size:12px;line-height:1.5;margin-top:8px">${body}</div></div>`;

  let html=`<button class="pill" style="cursor:pointer;border:1px solid var(--border)" onclick="renderToolsGathering()">← Data Gathering</button>
    <div style="margin:10px 0 4px"><span class="big" style="font-size:22px">EDGAR scrubber</span> <span class="tier v-open" style="margin-left:6px">424B2 pilot</span> <span class="pill" style="border:1px solid #e3b341;color:#e3b341;font-size:11px">local · human-supervised</span></div>
    <div class="muted" style="margin-bottom:12px;max-width:840px">Enter EDGAR search criteria → crawl every matching filing → open <b>every document</b> in each filing → extract a user-designated field set. A local model does the extraction; you validate the first N documents by hand so it learns your field definitions before it runs unattended. <b>424B2</b> is the pilot form — prospectus supplements / structured-note issuance, thousands a year, heavily templated per issuer: the exact shape where hand-validated exemplars pay off fastest.</div>`;

  // A. crawl — search criteria + no-browser-automation note
  html+=`<div class="group-title">1 · Crawl — search criteria</div>
    <div class="notebox" style="border-left-color:#1f6feb;background:#1f6feb0d">🔌 <b>No browser automation.</b> SEC ships JSON APIs, so search and fetch are <b>deterministic code</b> — only extraction uses a model. The crawl runs full-text search → filing list → per-filing <code>index.json</code> → every document in the filing.</div>
    <div class="controls">
      <select disabled title="Pilot form — fixed to 424B2"><option>424B2</option></select>
      <input type="text" id="edgar-q" value="${EDGAR_QUERY.q}" placeholder="full-text query" style="min-width:220px" />
      <input type="text" id="edgar-start" value="${EDGAR_QUERY.startdt}" placeholder="startdt YYYY-MM-DD" />
      <input type="text" id="edgar-end" value="${EDGAR_QUERY.enddt}" placeholder="enddt YYYY-MM-DD" />
      <input type="text" id="edgar-from" value="${EDGAR_QUERY.from}" placeholder="from" style="width:80px" />
      <button class="pill" style="cursor:pointer;border:1px solid var(--accent);color:var(--accent)" onclick="edgarPlanCrawl()">Plan crawl</button>
    </div>`;
  if(EDGAR_PLANNED){
    html+=`<div class="card" style="padding:12px;margin-bottom:14px">
      <div class="muted" style="font-size:11px;text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px">Deterministic request (built from the form)</div>
      <code style="display:block;background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:8px 10px;font-size:11.5px;font-family:ui-monospace,Menlo,Consolas,monospace;color:var(--txt);white-space:pre-wrap;word-break:break-all">${eftsURL}</code>
      <div class="muted" style="font-size:12px;margin-top:8px">→ page the <code>from</code> offset until exhausted → for each hit GET <code>…/index.json</code> → open every document → queue for extraction. <i>Offline demo — no live SEC call is made here; a live run needs the local runtime and a declared User-Agent (below).</i></div>
    </div>`;
  }

  // B. client core — endpoints + access rules
  html+=`<div class="group-title">2 · Client core — SEC JSON endpoints</div>
    <div class="card" style="padding:0;overflow:hidden"><table style="font-size:12px">
      <tr><th style="width:34%">purpose</th><th>endpoint</th></tr>
      ${EDGAR_ENDPOINTS.map(([p,u])=>`<tr><td class="muted">${p}</td><td><code style="font-size:11px;word-break:break-all">${u}</code></td></tr>`).join('')}
    </table></div>
    <div class="notebox" style="border-left-color:#f85149;background:#f851490d">⚠ <b>Access rules (hard requirements — SEC blocks on violation).</b> Declare <code>User-Agent: &lt;name&gt; &lt;email&gt;</code> on every request, and stay <b>at or under 10 requests/second</b>. The client core is a shared rate-limited fetcher; every crawl / expansion / XBRL call routes through it.</div>`;

  // C. field spec
  html+=`<div class="group-title">3 · Field spec — the user-designated field set (424B2)</div>
    <div class="card" style="padding:0;overflow:hidden"><table style="font-size:12px">
      <tr><th>field</th><th>definition</th><th>typical anchor</th></tr>
      ${EDGAR_FIELDSPEC.map(f=>`<tr><td><code style="font-size:11px">${f.field}</code></td><td class="muted">${f.desc}</td><td class="muted">${f.anchor}</td></tr>`).join('')}
    </table></div>
    <div class="muted" style="font-size:11.5px;margin:6px 0 14px">Field set is per-project and editable — the scrubber extracts exactly these, nothing more. The <i>anchor</i> column is where each field usually lands in the prose; rule induction (§5) watches it.</div>`;

  // D. local runtime + provider ladder
  html+=`<div class="group-title">4 · Local runtime + provider ladder</div>
    <div class="card" style="padding:14px">
      <div class="muted" style="font-size:12.5px;line-height:1.55">A <b>local ~14B model</b> does the extraction. The provider ladder falls forward only when it must, cheapest first:</div>
      <ol class="muted" style="font-size:12.5px;line-height:1.6;margin:8px 0 0;padding-left:20px">
        <li><b>Deterministic rule</b> (§5) — if an induced extractor exists for this (issuer, field), use it. Free, exact, no model call.</li>
        <li><b>Local 14B</b> — few-shot prompted with exemplars from the store (§5a). Handles the vast majority.</li>
        <li><b>Remote fallback</b> — only for spans the local model flags low-confidence; logged so they become the next batch to hand-validate.</li>
      </ol>
    </div>`;

  // E. how the model "learns" — a/b/c build order (the second design correction)
  html+=`<div class="group-title">5 · How the model learns your fields — build order</div>
    <div class="notebox" style="border-left-color:#a371f7;background:#a371f70d">🧠 <b>“The model learns what I want” is not fine-tuning.</b> A 14B local model does not weight-update from ten examples. What actually learns, in the order it is built:</div>
    <div class="cards" style="grid-template-columns:repeat(auto-fill,minmax(340px,1fr))">
      ${learnCard('a','Few-shot exemplar store','var(--green)','built first — works from example #1',
        'Validated spans (§6) become prompt exemplars keyed by <b>(form, issuer, field)</b>. The local model is prompted with the closest exemplars for the filing in front of it. This is the mechanism that delivers what you asked for — from the very first hand-validated document.')}
      ${learnCard('b','Rule induction','#e3b341','built second — free + exact thereafter',
        'When a field lands at the <b>same anchor across N filings from one issuer</b>, promote it to a <b>deterministic extractor</b>. Free and exact from then on; the model demotes to fallback for that (issuer, field). Templated 424B2 issuers converge fast.')}
      ${learnCard('c','LoRA fine-tune','var(--muted)','backlogged — not built now',
        'A real weight update needs <b>~500+ labels</b>. Backlogged behind (a) and (b), which already cover the pilot. Listed so the roadmap is honest — this is the piece people mistake for “the model learned from my ten examples.”')}
    </div>`;

  // F. validation UI — the interactive "validate first N by hand" surface
  const total=EDGAR_DOCS.length;
  html+=`<div class="group-title">6 · Validation — hand-check the first N documents</div>
    <div class="card" style="padding:0;overflow:hidden"><table style="font-size:12px">
      <tr><th>document</th><th>exemplar key (form, issuer, field)</th><th>extracted span</th><th>review</th></tr>
      ${EDGAR_DOCS.map((d,i)=>{
        const st=d.status==='accepted'?'<span class="pos">✓ accepted → exemplar</span>':d.status==='corrected'?'<span class="neg">✎ corrected → exemplar</span>':'<span class="muted">unreviewed</span>';
        return `<tr>
          <td><code style="font-size:11px">${d.doc}</code></td>
          <td class="muted" style="font-size:11px">(424B2, ${d.issuer}, ${d.field})</td>
          <td>${d.span}</td>
          <td>${st} &nbsp;<button class="pill" style="cursor:pointer;border:1px solid var(--green);color:var(--green);font-size:11px" onclick="edgarReview(${i},true)">accept</button><button class="pill" style="cursor:pointer;border:1px solid var(--red);color:var(--red);font-size:11px" onclick="edgarReview(${i},false)">correct</button></td>
        </tr>`;
      }).join('')}
    </table></div>
    <div class="muted" style="font-size:12px;margin:8px 0 14px">Reviewed <b>${reviewed}/${total}</b> · exemplar store holds <b>${accepted}</b> accepted span${accepted===1?'':'s'}. Every accepted/corrected span is keyed <code>(form, issuer, field)</code> and fed straight into §5a. Unattended runs unlock once the eval harness (§7) clears its threshold on a held-out set.</div>`;

  // G. eval harness
  html+=`<div class="group-title">7 · Eval harness — gate to unattended</div>
    <div class="card" style="padding:14px">
      <div class="muted" style="font-size:12.5px;line-height:1.55;margin-bottom:8px">A held-out labeled set scores each field on exact-match / precision / recall. The scrubber only runs unattended once every field clears its threshold; below it, it stays in hand-validation. (Mock numbers — illustrative.)</div>
      <table style="font-size:12px">
        <tr><th>field</th><th class="num">exact-match</th><th class="num">precision</th><th class="num">recall</th><th>gate</th></tr>
        <tr><td><code style="font-size:11px">reference_underlying</code></td><td class="num">0.98</td><td class="num">0.99</td><td class="num">0.98</td><td><span class="pos">pass</span></td></tr>
        <tr><td><code style="font-size:11px">contingent_coupon</code></td><td class="num">0.95</td><td class="num">0.97</td><td class="num">0.94</td><td><span class="pos">pass</span></td></tr>
        <tr><td><code style="font-size:11px">barrier_buffer</code></td><td class="num">0.88</td><td class="num">0.91</td><td class="num">0.86</td><td><span class="neg">below — keep validating</span></td></tr>
      </table>
    </div>`;

  // H. graduation path + boundary
  html+=`<div class="group-title">8 · Graduation path</div>
    <div class="boundarynote">🎓 <b>Graduate upstream, then retire the local extractor.</b> When a field proves out inside a Research project, it moves into <b>Stock-Data-Pipeline</b>’s EDGAR ingest — the pipeline is the only writer (<code>ARCHITECTURE.md</code>) — and the local extractor is switched off. This keeps the scrubber exploratory and prevents it becoming a second permanent ingest path that calcifies like the artifacts in #90 / #91.</div>`;

  v.innerHTML=html;
}
